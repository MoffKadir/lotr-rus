 praxis_government_desc:1 "#F Церемониархия — сложная система обрядов и обычаев, объединённых вокруг стремления к [Glossary( 'Альдмерису', 'ALDMERIS_GLOSS' )]. Хотя у церемониархии много общего с другими феодальными монархиями — вассалы так же поставляют сюзерену [levies|El] и платят [taxes|El], она, помимо прочего, предполагает следование альтмерской философии, закладывающей стратификацию общества и требующей строгого соблюдения социальных ролей от его членов.#!"
