 ceremoniarchy_rejection_title:0 "Вассал отступил от церемониархии"
 ceremoniarchy_rejection_desc:0 "Мой вассал, [dissident.GetTitledFirstName], [Select_CString(dissident.IsFemale, 'отвергла', 'отверг')] [Concept( 'ceremoniarchy', 'церемониархические' )|El] практики и стремится править как варварский феодальный землевладелец."
