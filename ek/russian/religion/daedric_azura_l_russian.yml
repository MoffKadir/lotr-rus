 azura_cult:1 "Азурическ"
 azura_cult_adj:1 "Культ Азуры"
 azura_cult_adherent:1 "Культист Азуры"
 azura_cult_adherent_plural:1 "Культисты Азуры"
 azura_cult_desc:0 "Культ Азуры посвящает себя Королеве Рассвета и Заката. В их догматы входит постоянный поиск смыслов и предназначения в мире смертных, который возможен только через беспрестанную саморефлексию и медитацию."

 hidden_moon:1 "Криптолуническ"
