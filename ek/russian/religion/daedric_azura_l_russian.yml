 azura_religion_desc:0 "Объединение из малосвязанных верований, почитающих Азуру, Королеву Рассвета и Заката. Её последователи живут по всему Тамриэлю, но особое место она занимает в сердцах каджитов Эльсвейра и данмеров Морровинда."
