 necromantic_religion_desc:0 "Есть конфессии, представители которых в противовес остальным не интересуются богами и поклонением им. Их члены могут практиковать прагматичный подход, заключая договоры с теми всемогущими сущностями или тёмными покровителями, которые были бы в силах и согласны удовлетворить их интересы. В конце концов, разве не является абсолютная власть над душой суть божественной силой?"
