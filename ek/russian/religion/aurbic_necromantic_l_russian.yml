 worm_cult_desc:0 "Орден Чёрного Червя — это культ, созданный последователями Маннимарко, могущественного эльфийского некроманта, первым присвоившего себе титул Короля Червей. Их ритуалы сосредоточены на подражании архетипичному Некроманту. Они стремятся занять его место как идеального космического существа, навеки узурпировав власть над циклом жизни и смерти."
