 boethiah_religion_adherent:1 "Боэтист"
 boethiah_religion_adherent_plural:1 "Боэтисты"
 boethiah_religion_desc:0 "Объединение из малосвязанных верований, почитающих Боэтию, Князя Заговоров. Каждый, кто стремится к величию: и те, кто бьются на поле брани, и те, кто наносит удар в спину — воспевает её имя. Но данмеры Морровинда и каджиты Эльсвейра относятся к Боэтии с особым почтением."
