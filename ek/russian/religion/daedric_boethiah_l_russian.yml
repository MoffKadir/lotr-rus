 boethiah_cult:1 "Боэтистск"
 boethiah_cult_adj:1 "Культ Боэтии"
 boethiah_cult_adherent:1 "Культист Боэтии"
 boethiah_cult_adherent_plural:1 "Культисты Боэтии"
 boethiah_cult_desc:0 "Культисты Боэтии стремятся к почтению Обманщицы Народов путём следования её строжайшим принципам. Они известны великими сумятицами, которые устраивают в Тамриэле в ходе войн или вероломных заговоров."