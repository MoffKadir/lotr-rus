 breton_cult_desc:0 "Поклонение Божествам в Хай-Роке началось с приходом Реманской империи. Желая снискать расположение Сиродила, бретонская знать стала почитать имперских богов, и со временем эта вера распространилась среди их подданных. За столетия имперского владычества Божества вытеснили большинство старых богов, однако некоторые [Glossary( 'Аэдра', 'AEDRA_GLOSS' )] — Магнус, Финастер и И'ффре — по-прежнему широко почитаются."
