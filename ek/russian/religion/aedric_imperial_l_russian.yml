 hero_cult_desc:0 "История народа Сиродила знает немало легендарных героев, некоторые из которых за свои подвиги и добродетели почитаются наравне с Восемью божествами. Местные герои, святые, императоры и защитники Сиродила постоянно пополняют этот гибкий и вечно растущий пантеон, который может разительно отличаться в зависимости от конкретного региона или человека."
