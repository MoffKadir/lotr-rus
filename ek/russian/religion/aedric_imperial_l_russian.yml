 eight_divines_adherent_plural:0 "Почитатели Восьмерых"
 eight_divines_desc:0 "Поклонение Божествам претерпело изменения со времён восстания Алессии, однако вера в Восьмерых и Завет с Акатошем всё так же выступает фундаментом для религиозных воззрений Сиродила. На территории провинции всё ещё представлены местные верования а также почитание богов-героев, а ещё, говорят, что Имперский город — это дом для тысячи культов…"
