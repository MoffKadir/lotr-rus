 anui_el_desc:0 "Эти имга преданы своему исконному божеству, чьё имя — Самрух — они славят в многочисленных святилищах, разбросанных по всему Валенвуду. Почитаемый как творец, Самрух прежде всего заботится о душах имга — он собирает их после смерти и уносит в Полый ствол, обитель их загробной жизни."
