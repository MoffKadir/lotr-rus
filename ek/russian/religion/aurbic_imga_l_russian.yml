 ius_cult_adj:0 "Культы Иуса"
 ius_cult_adherent:0 "Культист Иуса"
 ius_cult_adherent_plural:0 "Культисты Иуса"
 ius_cult_desc:0 "Те, кто почитают Иуса, представляют собой весьма пёструю паству, ибо они преклоняются перед многочисленными чудовищами времён первозданного рассвета Валенвуда, видя в них воплощения своего бесформенного бога. Главными среди этих древних существ считаются аватары Грозового вепря, Кровожадного зайца, Змея-грифа, Двуглавого леопарда и Уродливой жабы."
