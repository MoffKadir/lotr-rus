#Magna-Ge
 magna_ge:0 "Магна-гетическ"
 magna_ge_adj:1 "Магна Ге"
 magna_ge_adherent:1 "Адепт Магна Ге"
 magna_ge_adherent_plural:1 "Адепты Магна Ге"
 magna_ge_desc:0 "Магна Ге или Звёзды-Сироты были среди тех эт'Ада, кто последовал за богом Магнусом и покинул Мундус, когда обман Лорхана стал очевиден. Магна Ге, отказавшиеся принимать какое бы то ни было участие в дальнейшей жизни мира-тюрьмы, являются даже более бессловесными и отстранёнными, чем Божества — не стоит ждать от них ни чудес, ни ответа на молитвы. И всё же мистика, которая их окружает, а также тот факт, что их холодный равнодушный свет одаривает Мундус магией, привлекают тех, кто ищет смыслы и мистицизм за пределами аурбического конфликта и хочет удалиться от нескончаемой борьбы на территории Арены…"
 magna_ge_religious_symbol:0 "эмблема звезды"
 magna_ge_devotee_male:0 "адепт"
 magna_ge_devotee_male_plural:0 "адепты"
 magna_ge_priest_male:0 "искатель"
 magna_ge_priest_male_plural:0 "искатели"
 magna_ge_priest_alternate_plural:0 "искатели"
 magna_ge_bishop:0 "вестник"
 magna_ge_bishop_plural:0 "вестники"

#Magnus Cult
 magnus_cult:0 "Магническ"
 magnus_cult_adj:1 "Культ Магнуса"
 magnus_cult_adherent:1 "Культист Магнуса"
 magnus_cult_adherent_plural:1 "Культисты Магнуса"
 magnus_cult_desc:0 "Многие древние чародеи манмеров охотно начали поклоняться Магнусу, создавая культы в честь нового бога. Большинство этих общин кануло в небытие, однако друиды, почитающие Бога Солнца, живы и поныне — как и леденящие кровь слухи о плетёных людях. Говорят, что заключённых внутри них пленников предают священному очищающему пламени, принося несчастных в жертву Магнусу в знак благодарности за мир, который он сотворил и продолжает оберегать."
    
