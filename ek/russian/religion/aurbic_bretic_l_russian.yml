# Forgotten Gods
 forgotten_gods: "Староверск"
 forgotten_gods_adj: "Забытые боги"
 forgotten_gods_adherent: "Старовер"
 forgotten_gods_adherent_plural: "Староверы"
 forgotten_gods_desc: "Традиционное народное верование залива Илиак своими корнями восходит к друидизму древних бретонских племён. Его последователи отвергают большинство богов имперцев, редгардов и Диренни, вместо этого они придерживаются своеобразного пантеона, вобравшего в себя богов и святых из самых разных культур на протяжении веков, который к тому же серьёзно разнится от региона к региону."    
