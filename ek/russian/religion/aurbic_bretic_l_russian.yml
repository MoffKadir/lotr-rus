 forgotten_gods_house_of_worship_plural: "братства" 
 forgotten_gods_religious_head_title: "Архижрец"
 forgotten_gods_religious_head_title_name: "Храм Илиака"
 forgotten_gods_religious_text: "смутные каноны"
 
# Breton Aedra
 breton_aedra: "Бретонско-аэдрическ"
 breton_aedra_adj: "Бретонские Аэдра"
 breton_aedra_adherent: "Бретонец"
 breton_aedra_adherent_plural: "Бретонцы"
 breton_aedra_desc:0 "Прежде чем Реманская империя принесла в эти земли культ Восьми Божеств, народы Хай-Рока почитали пантеон, сочетавший эльфийских [Glossary( 'Аэдра', 'AEDRA_GLOSS' )] и местных духов, которым поклонялись ещё до прихода клана Диренни. Превыше всех в небесах правит король Аури-Эль со своими жёнами, Кин и Марой, в окружении свиты из прочих богов."
 breton_aedra_religious_head_title_name: "Предки"
 breton_aedra_religious_symbol: "солнце"