# Beldama Wyrd
 beldama_wyrd: "Белдамск"
 beldama_wyrd_adj: "Белдамское ведовство"
 beldama_wyrd_adherent: "Верующий Белдамы"
 beldama_wyrd_adherent_plural: "Верующие Белдамы"
 beldama_wyrd_desc:0 "Древний ковен ведьм, посвятивший себя Джефре, Лесному Богу бретонцев. Эти вещуньи служат лесу и защищают его, а помогают им в этом хранители стихий. Несмотря на их мирный образ жизни, всевозможные лорды Хай-Рока и сиродильская империя видят в них потенциальную угрозу."
 beldama_wyrd_religious_head_title_name: "Белдамский ковен"
 
# Glenmoril Wyrd
 glenmoril_wyrd: "Гленморильск"
 glenmoril_wyrd_adj: "Гленморильское ведовство"
 glenmoril_wyrd_adherent: "Верующий Гленморила"
 glenmoril_wyrd_adherent_plural: "Верующие Гленморила"
 glenmoril_wyrd_desc:0 "Ведьмы природы из Гленморильского ковена посвящают себя Хирсину. Известно, что их могущественная магия способна излечить от вампиризма и ликантропии, из-за чего эти вещуньи на ножах с другими почитателями [Glossary( 'даэдрического Князя', 'DAEDRA_GLOSS' )] Охоты, для которых ликантропия — благословение."
 glenmoril_wyrd_religious_head_title_name: "Гленморильский ковен"
 
# Druid Circles
 druid_circles: "Друидическ"
 druid_circles_adj: "Круги друидов"
 druid_circles_adherent: "Друидист"
 druid_circles_adherent_plural: "Друидисты"
 druid_circles_desc:0 "Друидские традиции бретонцев, которые их же последователи называют Истинным Путём Джефре, отличаются уникальностью по всему Тамриэлю. Как и велит им Рассказчик, эти друиды ценят дикую природу превыше цивилизации, которая в их представлении обречена на саморазрушение. Признавая эту её материальную и духовную несостоятельность, друидисты собираются в глуши, чтобы проводить там обряды и жить как можно ближе к своему божеству. Последователи их взглядов формируют круг — ячейку, которая более всего подходит под определение управляющего органа в друидском сообществе. Каждый из кругов независим друг от друга, и расколы — как новые, так и старые, отдаляют возвращение единообразного поклонения по образцу друидов Галена."
 druid_circles_religious_text: "истинный путь"
