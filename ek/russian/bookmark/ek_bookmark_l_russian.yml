 # Warlord Rising - Skyrim
 bm_skyrim:0 "Оспоренная Истинность"
 bm_skyrim_desc:0 "Родина нордов разделена.\n\nВерховный король Логрольф был убит, и ярл Солитьюда Сварт оспорил легитимность его законного наследника. Когда выборное собрание избрало наследницей дочь Логрольфа Фрейдис, признанную самой Короной Истинности, Сварт созвал собственное собрание в Солитьюде.\n\nЭто привело к многовековому разделению Скайрима на восток, попавший под власть Фрейдис и её рода, и запад, которым правили Сварт и его наследники.\n\n#bold Сумеет ли один претендент сокрушить другого, объединив провинцию? Или же норды останутся разделены на века, пока чужак не захватит их земли, подчинив этот народ своей власти?#!"
 bm_skyrim_svartr:0 "Верховный король Сварт"
 bm_skyrim_svartr_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_svartr_desc:0 "Стареющий ярл Солитьюда Сварт стал первым, кто подверг сомнению легитимность Фрейдис после убийства её отца Логрольфа. Действуя быстро и решительно, он созвал неполное выборное собрание в своих палатах, чтобы его объявили верховным королём. Однако это не позволило ему опередить Фрейдис, проведшую собственное собрание и надевшую Корону Истинности. Сварт вместе со сторонниками, не желая уступать, называет корону не более чем бестолковым артефактом, и предпочитает в своих королевских притязаниях опираться на силу армий.\n\n#bold Сумеет ли претендентка на корону положить конец кампании Сварта, пока тот не успел набрать поддержку? Или же вы сможете взять бразды правления в свои руки и объединить Скайрим под знаменем вашего дома, положив конец векам правления Востока?#!"
 bm_skyrim_freydis:0 "Королева Фрейдис"
 bm_skyrim_freydis_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_freydis_desc:0 "Дочь покойного верховного короля Логрольфа Фрейдис не пользуется единогласной поддержкой, и её власть над западной частью Скайрима можно назвать в лучшем случае слабой. Сватр, старый ярл Солитьюда, отказывается признавать её законным правителем. И если она не желает, чтобы Скайрим остался разделён на века, Фрейдис должна отправиться в поход на запад и восстановить свою власть над Солитьюдом и сторонниками Сварта.\n\n#bold Неужели Фрейдис и её род обречены на поражение? Или же вы сумеете сокрушить претендента, объединить провинцию и наконец пройти коронацию как верховная королева Скайрима?#!"
 bm_skyrim_lodvar:0 "Король Лодвар"
 bm_skyrim_lodvar_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_lodvar_desc:0 "Король-норд в королевстве предельцев, Лодвар пришёл к власти, захватив Маркарт и сокрушив окружающие его местные племена. Большая часть Предела всё ещё ему не подвластна, а вассалы плетут заговоры по его свержению, но он ещё может найти союзников к востоку и северу.\n\n#bold Свергнет ли вас непокорный народ Предела, вновь обретя свободу, или же вы сумеете превратить Предел в полноценное нордское ярлство, принеся в него цивилизацию?#!"
 bm_skyrim_yashnag:0 "Король Яшнаг"
 bm_skyrim_yashnag_subheading: "Король Фалькрента"
 bm_skyrim_yashnag_desc:0 "После разорения Орсиниума Яшнаг и его племя отправились на восток к землям их предков в Скайриме. Сварт, удерживающий власть в западной части провинции, оказался неспособен остановить орков, и те отвоевали собственное вождество в Фолкрите. После нескольких десятилетий властвования в Фолкрите, Яшнаг и его почётные воины были вызваны на дуэли и побеждены сыном прошлого ярла Фолкрита Хакквильдом.\n\n#bold Яшнаг и его род окружены врагами. Если они канут в забвение, оркам останется лишь в очередной раз разбрестись по миру. Или быть может вам хватит мужества, чтобы сохранить вождество Фолкрит за орками и сковать в местном горниле войны новый Орсиниум?#!"
 bm_skyrim_torygg:0 "Король Торигг"
 bm_skyrim_torygg_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_torygg_desc:0 "Лишь немногие норды заслужили за свою жизнь такое же уважение, как Торигг Честный, но ещё меньше тех, кто говорит плохо об этом мудром харизматике. Правя владением Вайтран — перекрестьем дорог Скайрима — Торигг принёс мир и процветание землям центральных полей, ведя дружбу с теми, кто её ищет, и раздавая обещания тем, кто их достоин.\n\nОднако сейчас, когда титул верховного короля находится под вопросом и линии фронта строятся вокруг его королевства, Ториггу, возможно, придётся примкнуть к одной из сторон, ведь оба претендента уповают на богатую казну и арсеналы Вайтрана.\n\n#bold Сметут ли его грядущие беспорядки словно шторм, пронизывающий тундру, или же его миротворческих умений окажется достаточно, чтобы уберечь Вайтран в надвигающуюся бурю?#!"
 bm_skyrim_brynjolfr:0 "Верховный вождь Бриньольф"
 bm_skyrim_brynjolfr_subheading: "Верховный вождь Фельсада"
 bm_skyrim_brynjolfr_desc:0 "На плечи верховного вождя Бриньольфа возложены большие ожидания, ведь он последний живой родственник легендарного Эйвара Певца Камней, героя скаалов, что в давнюю пору вернул дары Все-Создателя после их кражи Врагом.\n\nТеперь, когда большая часть земель Солстхейма была утеряна в пользу риклингских племён, народ скаалов надеется, что Бриньольф вернёт принадлежащие им земли, как его предок когда-то вернул божественные дары. Но в душе Бриньольф мало полагается на вырезанные на камнях предания и небылицы и верит, что хорошее случается с теми, кто умеет выжидать.\n\n#bold Сумеет ли он вернуть Солстхейм с миром, как сделал это его предок, или станет героем, каким его хочет видеть его народ?#!"



 # recommanded characters for the iliac bay 440


 # recommanded characters for the topal bay 440
 bm_topal:0 "Море Невзгод"
 bm_topal_desc:0 "Потентат рушится под собственной тяжестью! Его обломки стекают вниз по Нибену, скапливаясь в устье реки, но новопостроенные мосты ни за что не дадут им достигнуть моря. Вместе с властью и коммерческой мощью, что ускользают из рук больного человека Тамриэля, в бассейн Топальского моря и на его берега могучим потоком льются не только возможности, но и опасности — их извечный спутник.\n\nКоролева йеспестов, правящая на востоке, смотрит в будущее с надеждой и опаской. На севере Лейавин и герцогство Голубая Кровь играют с огнём: ценой великой выгоды им приходится разбираться с недовольством. И наконец, Сенчал как никогда раньше может обрести невероятное могущество.\n\n#bold Четверо правителей стоят на обрыве истории, впереди — возможность принести процветание своим землям. Сумеют ли они ей воспользоваться? Или же их владениям суждено обратиться в руины, ценные разве что для археологов?#!"
 bm_topal_aine:0 "Королева Айне"
 bm_topal_aine_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_topal_aine_desc:0 "Айне из клана Атла — дочь выдающегося короля Аурила, объединителя племён йеспестов. Её правление приходится на непростые времена: аргонианские набеги становятся всё более частыми, лилмотиты дерзеют день ото дня, и что ещё хуже, амбиции Лейавина угрожают суверенитету её народа.\n\n#bold Веками независимость йеспестов находилась под угрозой, и йеспесты многое принесли в жертву, чтобы ощутить вкус свободы. Сможет ли Айне сохранить её, или она померкнет в тени своего отца?#!"
 bm_topal_fabiana:0 "$duke_feudal_female_cyrodiilic_independent$ Фабиана"
 bm_topal_fabiana_subheading: "$duke_feudal_female_cyrodiilic_independent$ Голубой Крови"
 bm_topal_fabiana_desc:0 "Фабиана Аркатона совершенно без ума от йеспестской королевы Айне, но ещё больший восторг у них обеих вызывает мысль о том, как голова Ловиера Лейавинского отделяется от тела. Лучше отцеубийства двух благородных людей может сблизить только жажда возмездия.\n\nНо состояние владений Фабианы препятствует воплощению её мечты в жизнь — военачальницу-чужеземку не поддерживают местные нибену в Чёрном Лесу. Ей придётся искать компромиссы, иначе её свергнут уже за то, что она не знает имён всех до единого речных святых.\n\n#bold И если Фабиане удастся сохранить стабильность во владениях и угодить своей союзнице, можно быть уверенным — никакой «повелитель» не будет повелевать ни ей, ни кому-либо ещё.#!"
 bm_topal_lovierus:0 "$king_feudal_male_nibenese$ Ловиер"
 bm_topal_lovierus_subheading: "$king_feudal_male_nibenese$ Лейавина"
 bm_topal_lovierus_desc:0 "Повелитель Эсдруф Дарак оставил своему наследнику множество неоконченных дел. На западе уже слышится грозный рёв транснибенских малапитов. По другую сторону реки — лязг ножей, что точат циснибенские властительницы. Не стоит забывать и про лейавинские мосты, безумный проект, который, хоть и приносит выгоду, но делает из Лейавина мишень для всех, кто находится выше по течению и вплоть до Румаре. Ловиер находится в раздумьях. Если ему удастся перехитрить врагов, он сможет превратить Топальское море в свой личный источник дохода.\n\n#bold Сможет ли Ловиер справиться с призраком наследия своего отца? Или же собственная самоуверенность станет его погибелью?#!"
 bm_topal_kahada:0 "$duke_feudal_female_khajiiti$ Кахада"
 bm_topal_kahada_subheading: "$duke_feudal_female_khajiiti$ Сенчала"
 bm_topal_kahada_desc:0 "Сенчал находится в эпицентре идеального шторма. Лейавин враждует со своими мятежными вассалами-нибенуйцами и племенами йеспестов, что открывает перед Кахадой шанс воспользоваться хаосом и захватить власть в Топальской бухте. Но королева Сенчала предпочитает мир войне и не стремится к захвату новых территорий.\n\n#bold Проявит ли она силу духа в этот критический период и приведёт ли Сенчал к господству на морях? Или, быть может, даже к возрождению независимого Пеллитина?#!"

 # recommanded characters for reaper's march 440
 bm_reaper:0 "Доля Смерти"
 bm_reaper_desc:0 "На перекрестье дорог Валенвуда и Эльсвейра лежит Марка Смерти. Эти засушливые поля столетиями оставались спорной территорией, и к Междуцарствию ситуация не поменялась. Коловианские военачальники воюют с племенами босмеров и каджитов, и все они претендуют на законную власть над этой землёй.\n\n#bold Многие годы Марка Смерти остаётся гробницей людских амбиций. Кто же выйдет победителем из предстоящей схватки?#!"
 bm_reaper_cicero:0 "Король Цицерон"
 bm_reaper_cicero_subheading: "Король Южного Вельда"
 bm_reaper_cicero_desc:0 "Знать к северу от Стрида пришла в изумление, узнав, что один из них с поддержкой отряда наёмников, сумел завоевать Арентию. В самом начале вторжения дела у Цицерона Пуллии шли хорошо, но даже в упадке стражи Арентии сумели развязать бесконечную партизанскую войну, ставшую занозой в его боку. Ещё большее беспокойство вызывали доклады о том, что древождество Сумеречной Лозы собирает значительные силы, чтобы отбросить его обратно в Западный вельд. И пусть его разнообразные вассалы пока покладисты, и они начнут активное сопротивление его власти, если учуют его слабость.\n\n#bold «Южный Вельд» ещё далёк от полного усмирения и, чтобы основать долгоживущее королевство к югу от Стрида, Цицерону понадобится подавить все очаги сопротивления. Заберёт ли коварная Смерть свою долю в срок?.. Или же вы сумеете одолеть испытания на вашем пути и создать наследие, что останется в веках?#!"
 bm_reaper_maevelle:0 "$count_feudal_female_bosmeris$ Мэвэль Каморан"
 bm_reaper_maevelle_subheading: "$count_feudal_female_bosmeris$ Осенней Стоянки"
 bm_reaper_maevelle_desc:0 "Пусть корни древа Каморан и раскинулись по всему Валенвуду, жалкое положение его арентийской ветви после утраты родовых земель вызывает немалое беспокойство. Мэвэль предстоит ещё долгий путь, если она желает обеспечить себе прочное положение в Марке Смерти. Сейчас же положение её слабо, и она уязвима для налётов со стороны коловианцев и босмеров, что стремятся съесть, чтоб самими не быть съеденными. Хуже того, худородный, прозванный Нендером Железной Корой, нагло претендует на все её владения! Благо кровь Эплира ещё имеет вес в этих землях, и, быть может, ей удастся заключить удачный брак или союз?\n\n#bold Судьба рода лежит в её руках, пока она танцует на лезвии ножа. Возможно, Смерть пришла, чтобы подрезать древо… Или же вы сумеете вынести груз ответственности, свергнуть короля-узурпатора и сокрушить всех предателей вашего правления?#!"
 bm_reaper_habais:0 "$king_feudal_male_khajiiti$ Хабаис"
 bm_reaper_habais_subheading: "$king_feudal_male_khajiiti$ Дюнея"
 bm_reaper_habais_desc:0 "С радостным спокойствием наблюдает Хабаис за хаосом, разворачивающимся в Арентии, ведь королевство его сильно и окружено слабыми соседями. Единственная крупная для него угроза, Южный Вельд, рушится от внутренних конфликтов, вызванных неумением коловианского короля подчинить босмеров, населяющих его земли. Если Хабаис воспользуется возможностью, то вынудит военачальников, что не принимают его власть, преклонить колена, и даже процветающая Арентия может быть возвращена в лоно Анеквины.\n\n#bold Многие возможности разворачиваются перед Хабаисом, но, затяни он с действиями, и враги окопаются, а великие амбиции его будут разрушены. Хорошие вещи случаются с теми, кто умеет ждать, но возьмёте ли вы бразды в свои руки, воспользовавшись шансом пройти по пути Дарлока Брэя, восстановив величие Не-Квин-Ала?#!"
 bm_reaper_nendaer:0 "$duke_feudal_male_bosmeris$ Нендер Железная Кора"
 bm_reaper_nendaer_subheading: "$duke_feudal_male_bosmeris$ Сумеречной Лозы"
 bm_reaper_nendaer_desc:0 "Коловианские «авантюристы» для Сумеречной Лозы не в новинку, но крах влиятельных семей около десятка лет тому назад, подтолкнул к действию ранее незначимых акторов. И Нендер Железная Кора стал частью такой «свежей крови», не убоявшись Мэвэль Каморан, претендуя на её вождество и намереваясь свергнуть пришедшего в Арентию короля-самозванца. Цицерон, как и Камораны, потерпит крах, и Нендер имеет все шансы стать освободителем и в дальнейшем — хранителем Марки Смерти. Но возможность ещё не гарантирует успех, и Нендер, разгневавший сразу столько значимых фигур, может рано встретить смерть…\n\n#bold Егеря Сумеречной Лозы заявили о больших планах на Марку Смерти, но могут ли они надеяться прожить долго в регионе, известном павшими в нём героями?.. Быть может, вы сможете привести их к славе и заложить порядок, что защитит Арентию в будущем?#!"

 # recommanded characters for hammerfell 440
 bm_hf:0 "Венец песков"
 bm_hf_desc: "#italic Разделяй и властвуй#! — такова была политика Второй Сиродильской Империи.\n\nРедгардская нация расколота. Среди предшественников идёт междоусобица — каждый стремится воспользоваться хаосом Междуцарствия; но венценосцы едины и верны своему лидеру в Хегате, желая вернуть утраченное.\n\n#bold Воссядут ли На-Тотамбу вновь во главе Республики Хаммерфелл? Или же в этом хаосе родится новый лидер?#!"
 bm_hf_kavar: "$title_crown_republic_female$ Арлимахера"
 bm_hf_kavar_subheading: "$title_crown_republic_female$ Венценосной республики"
 bm_hf_kavar_desc: "Венценосная Арлимахера правит расколотым Хаммерфеллом, но её нельзя винить за недостаток усилий. Она использовала все доступные ей средства, чтобы вернуть власть своего народа над Хаммерфеллом, включая услуги вселяющего ужас Тёмного Братства.\n\n#bold Вернёт ли Арлимахера [Glossary( 'На-Тотамбу', 'NATOTAMBU_GLOSS' )] их законное место, или же её методы приведут к падению Республики?#!"
 bm_hf_ahlam: "Герцогиня Кати"
 bm_hf_ahlam_subheading: "Герцогиня Бераджи"
 bm_hf_ahlam_desc: "Герцогиня Кати может и не правит Сентинелем, но именно она возглавляет оборону королевства от наступления венценосцев. Хотя династия до-Нисеван долгое время правила справедливо, боевые отряды [Glossary( 'Ра Гада', 'RAGADA_GLOSS' )] недовольны королевой Ферештой и её слабым руководством.\n\n#bold Пока что Кати довольствуется служением Сентинелю, но поведёте ли вы её и её потомков к куда более высоким вершинам?#!"
 bm_hf_murahd: "Королева Ирвина"
 bm_hf_murahd_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_murahd_desc: "Рихад может похвастаться редким достижением: они восстали против Империи и победили. Ирвина привела свой народ к этой победе, но годы берут своё, и все рихадцы тревожатся о будущем…\n\n#bold Останутся ли воины-предшественники Рихада столь же сильны? Или же боевые отряды погрузятся во взаимные распри, лишившись сильного лидер?#!"
 bm_hf_isobel: "Герцогиня Лассиния"
 bm_hf_isobel_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_isobel_desc: "Лассиния возглавляет остатки Империи в Хаммерфелле после убийства её брата, последнего наместника провинции. Собрав всех верных легионеров, которых только смогла найти, она взяла на себя временное руководство префектурой Лейнлин, откуда намерена восстановить имперскую власть.\n\n#bold Сумеет ли Лассиния вернуть закон и порядок в Хаммерфелл?#!"
 bm_hf_yarana: "Король Дивад IV"
 bm_hf_yarana_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_yarana_desc: "Династия до-Рахал правит Элинхиром по воле Империи. Но с падением империи ослабляется и власть королей-предшественников. Набеги орков учащаются, а Республика Венценосцев только и ждёт момента, чтобы вернуть свои законные владения.\n\n#bold Выживут ли [Glossary( 'Ра Гада', 'RAGADA_GLOSS' )] Элинхира в эпоху Междуцарствия, или победа На-Тотамбу неизбежна?#!"

 # recommanded characters for black marsh 440
 bm_kv:0 "Ку-вастей"
 bm_kv_desc:0 "В Чернотопье нет ничего постоянного — эту истину отлично знает народ корня. На севере дом Дрес сталкивается с восстанием рабов, а королевство Сильянорн остаётся последним оплотом народа айлейдов. На юге племена йеспестов и хорвалли впервые централизовались. Аргониане же наблюдают за происходящим с надеждой и смирением, зная, что подъёмы и падения — лишь части одного и того же цикла.\n\n#bold Сумеете ли вы оседлать волну перемен и построить династию, что продержится века — или ваше наследие без следа канет в трясине?#!"
 bm_kv_morilye:0 "$count_feudal_independent_female_ayleid$ Карандол Морилие"
 bm_kv_morilye_subheading: "$count_feudal_independent_female_ayleid$ Арлиса"
 bm_kv_morilye_desc:0 "Морилие Карандол, правительница Лориаселя, происходит из почтенной династии айлейдских королей: её предки бежали из Сирода во времена [Glossary( 'Нарфинсельского раскола', 'NARFINSEL_GLOSS' )] и обрели новый дом в негостеприимном Чернотопье. Сейчас её народу вновь грозит опасность: бывший ключевой союзник, Стормхолд, теперь в руках данмеров, и баланс сил стал хрупок.\n\n#bold Сможет ли Морилие, окружённая потенциальными врагами, одержать верх?#!"
 bm_kv_xir:0 "$duke_feudal_male_lilmothiit$ Хир Узурпатор"
 bm_kv_xir_subheading: "$duke_feudal_male_lilmothiit$ Озёрного Болота"
 bm_kv_xir_desc:0 "Хир Изгнанник, ныне известный как Хир Узурпатор, — старший сын и несостоявшийся наследник Аиисхара из Чёрной Розы. Не далее чем два года назад из-за ссоры с отцом его изгнали, и он нашёл приют у родичей матери в Бувомусе. Теперь же его и отец мёртв, и трон Чёрной Розы заняла сестра Хира.\n\n#bold Хир собрал лояльные племена и намеревается отвоевать Чёрную Розу, но преуспеет ли он?#!"
 bm_kv_alt_mispaxa:0 "Землепроходец Миспаха"
 bm_kv_vraseth:0 "Верховный вождь Урсет"
 bm_kv_vraseth_subheading: "Верховный вождь Архона"
 bm_kv_vraseth_desc:0 "Никто не ожидал, что Урсет, родившийся в семье обыкновенных членов одного из племён хорвалли, добьётся чего-то выдающегося, не говоря уж об объединении всего его народа под одним знаменем. Его величайшей победой была, пожалуй, битва за Архон, в ходе которой он собственноручно одолел аргонианского короля и отвоевал для хорвалли право поселиться на стратегически выгодном месте. Но Урсет уже не тот юный воин, что прежде, и множество врагов выжидают, когда он умрёт…\n\n#bold Переживут завоевания и мечты Урсета о великом королестве хорвалли его смерть?#!"
 bm_kv_brandshei:0 "$duke_feudal_male_argonian$ Бранд-Шей"
 bm_kv_brandshei_subheading: "$duke_feudal_male_argonian$ Альтен-Тормонта"
 bm_kv_brandshei_desc:0 "Мало кто может похвастаться таким же количеством шрамов, как у Бранд-Шея. Годы рабства у дома Дрес в Стормхолде были ужасающими, но всё же сыграли ключевую роль в формировании его целеустремлённости. Когда Бранд-Шей горбатился, вкалывая на пригородных полях, он поклялся самому себе, что подчинит это место своей власти и насадит голову губернатора на пику! Но сперва он должен помочь своему шурину ни много ни мало в восстании против коалиции магнатов из дома Дрес. \n\n#bold Сумеет ли Бранд-Шей обеими руками ухватиться за свою мечту, или же его могильный столб станет одним из множества на кладбище несостоявшихся освободителей?#!"
 bm_kv_milos:0 "$duke_feudal_male_argonian$ Милос"
 bm_kv_milos_subheading: "$duke_feudal_male_argonian$ Приморского"
 bm_kv_milos_desc:0 "Вожди Таруми когда-то были королями всего Архона, но те дни давно прошли. С течением времени они утрачивали всё больше земель, а пять лет назад хорвалли разорили и заняли сам Архон, попутно убив отца Милоса, радж-каала Дрикиуса. Милос сохраняет власть лишь над некоторыми северными провинциями, в то время как его сестра — над Арчалом.\n\n#bold Неужели народу Таруми суждено пасть в пучины безвестности? Или же Милос сумеет отвоевать Архон и, быть может, даже восстановить власть над одноимённым королевством?#!"
 bm_kv_talenjei:0 "Радж-каал Тален-Джей Возрождённый"
 bm_kv_talenjei_subheading: "$duke_feudal_male_argonian$ Хелстрома"
 bm_kv_talenjei_desc:0 "За тысячи лет до нынешней эры в Чернотопье правил Король Теней. Порядок, прогресс и долгосрочные цели были законом на этой земле. С помощью загадочной магии занмиров король подготовил своё перерождение. Но что-то — ошибка ли в расчётах или разрушительное влияние времени — внесли свои корректировки в его планы, и его новый сосуд оказался куда более… скромным. Тален-Джей — наследник разорённого королевства, чей народ погряз в нищете и убогости. \n\n#bold Сумеет ли Тален-Джей восстановить величие Сумеречья или же ему не удастся найти своё место в сердцах подданных?#!"

# 450
 # Interregnum
 bm_group_450:0 "2Э 450"
 bm_interregnum:0 "Междуцарствие"
 bm_interregnum_desc:0 "Двадцать лет назад последний акавирский потентат и все его наследники были убиты, что положило конец Второй империи.\nОтныне Сиродил и Хай-Рок поделены на десятки враждующих государств, претендующих на их наследие. Скайрим, в свою очередь, страдает от народных волнений, вызванных борьбой двоих претендентов на верховный трон провинции. Те, кто ещё недавно называл себя подданными Империи, ныне грызутся даже по самым мелким поводам. На остальном материке дела обстоят не лучше: по всем уголкам Тамриэля — кроме, разве что, Алинора — вспыхивают локальные войны.\n\n#bold Есть ли шанс, что, несмотря на разгоревшийся хаос, Империя сумеет восстать из пепла? Смеет ли хоть кто-нибудь надеяться, что обуздает нестабильность, возвысится над всеми и провозгласит себя императором не только Сиродила, но и всего Тамриэля? В условиях хаоса, что посеяло Междуцарствие, возможно всё.#!"
 bm_interregnum_marandrujo:0 "Грива Ма'рандру-джо"
 bm_interregnum_marandrujo_subheading: "Грива Конфедерации Эльсвейр"
 bm_interregnum_marandrujo_desc:0 "Грива направлял верующих с незапамятных времён. В эти нелёгкие времена «корону из кос» носит Его Превосходительство Ма'Рандру-джо, законный правитель Эльсвейра!\n\nИ если Пеллитина ещё подчиняется власти Гривы, то Анеквина сопротивляется себе же во вред. Какое-то подобие порядка сохраняет лишь Дюна, Риверхолд же, Оркрест и Риммен погрузились в пучину анархии. Даже дом Брэев не обошли беды: они сражаются в ужасной войне против собственных римменейских подданных, объявивших себя королями.\nСогласно светскому закону, Анеквина должна подчиниться Танцу Двух Лун, но сумеет ли Ма'Рандру-джо преодолеть свой отстранённый характер, чтобы добиться этого?\n\n#bold Вырвется ли Анеквина из хватки Гривы, или же вам удастся восстановить безраздельную власть иерократии?#!"
 bm_interregnum_hakkvild:0 "$duke_feudal_male_nordic$ Хакквильд"
 bm_interregnum_hakkvild_subheading: "$duke_feudal_male_nordic$ Хельга"
 bm_interregnum_hakkvild_desc:0 "Хакквильд не рос в роскоши. Почти два десятка лет назад назад клан Ял отнял у него отца и земли по праву рождения. Служба у его дяди Энгара в Хелгене дала ему времени довольно, чтоб истереть в порошок не один топор.\n\nТеперь, когда он унаследовал трон своего покровителя, ему не терпится вернуть владение в нордские руки — #italic свои#! руки. И учитывая, что теперь в борьбе против мародёрствующих орков он заручился поддержкой Вайтрана, а столица его - прекрасная точка как для начала атаки, так и для отступления, цель эта видится достижимой.\n\n#bold С орками, врагами коварными и жестокими, готовыми для победы на всё, нельзя быть «чрезмерно» осторожным. Сможете ли вы сломить их защиту и прогнать Малоховых отродий или будете лишь бессильно наблюдать за тем, как Хакквильд сокрушается о мощь орков?#!"
 bm_interregnum_mariette:0 "$duke_feudal_female_bretic_independent$ Мариэтта"
 bm_interregnum_mariette_subheading: "$duke_feudal_female_bretic_independent$ Камлорна"
 bm_interregnum_mariette_desc:0 "Дом Риэль восходит корнями ко многим великим людям: от Фабре Железного Сына, сумевшего выстроить сферу влияния в пост-нордском Хай-Роке, до Себастьяна Великого, официально аннексировавшего зависимые территории, вошедшие в современное королевство Камлорн. А Фабре Чёрному быть может даже удалось бы объединить Гленумбру и земли за её пределами, если бы не злодейство клана Диренни. У королевы Мариэтты подобных амбиций нет: она полностью сосредоточена лишь на том, чтобы держать своих вассалов на коротком поводке. Но если она когда-нибудь устанет играть у них на нервах, князья и мелкие монархи Камлорна останутся  ждать своего часа.\n\n#bold Должна ли Мариэтта тенью нависать на своими владениями, или же наводимый ей гнетущий ужас станет её же погибелью?#!"
 bm_interregnum_kaidarbul:0 "Ашхан Уршилаку Каид-Арбул"
 bm_interregnum_kaidarbul_subheading: "Ашхан Уршилаку"
 bm_interregnum_kaidarbul_desc:0 "Уршилаку. Одно из четырех великих племён эшлендеров находится в надёжных руках Каид-Арбула, сына Энкиду. Мало что может потревожить велотийцев Валенвариона под управлением такого набожного, стоического и добросердечного соплеменника, как он.\n\nУвы, жадность чужеземцев порой даёт о себе знать, неизбежно подталкивая их посягать на принадлежащее велотийцам и идти с ними на конфликт. Сказки о герое, который придёт и покарает злого данмера, могут успокоить кротких и слабых, но Каид-Арбул знает одну-единственную истину: #bold Сила есть право!#!\n\n#bold Смогут ли уршилаку отбросить чужаков в море или же вскоре начнётся начало их конца?#!"
 bm_interregnum_torg:0 "Верховный вождь Торг гро-Брог"
 bm_interregnum_torg_subheading: "Верховный вождь клана Рубедит"
 bm_interregnum_torg_desc:0 "Клан железных орков Рубедит, чей девиз: «Кровь алых вен», достиг своего благодаря добыче одноимённой руды. Заполучив немалые богатства и сильные войска, Торг гро-Брог оказался на перепутье.\n\nСоплеменники недовольны его мягким нравом, который является противоположностью упрямости и безжалостности, которые требуются от ош орним. Его собственный отец однажды сказал, что он «робкий козлёнок, порождённый свирепым кабаном». Вождь Брог не был плодовитым орком, что позволило Торгу беспрепятственно занять место вождя.\n\n#bold Потерпит ли Торг крах, столкнувшись с ожиданиями ош орним в отношении власти, или же вы проведёте чёткую черту между его истинным «я» и долгом?#!"
 bm_alinor_hidellith:0 "$emperor_feudal_male_altmer$ Хиделлит 'лен Имари"
 bm_alinor_hidellith_subheading: "$emperor_feudal_male_altmer$ Алинора"
 bm_alinor_hidellith_hidellith_desc:0 "Хиделлиту 'лен Имари Тандилу 'ата Неймону Тамлиену, церемониарху альтмеров, королю Алинора и островов Саммерсет выпало вести свою державу через неспокойные воды.\n\nЛучшие из предсказателей видят, как опасности грядущих лет окружают прекрасный Алинор. Апраксис будоражит сердца масс, сея по всему королевству семена хаоса. Элендари V из Лилландрила ведёт войну за престол из-за своей #italic сомнительной#! родословной. То, что принято называть мудростью, давно оставило нынешнего Рилиса из Фёстхолда, и вот он уже исполняет нечестивые [Glossary( 'даэдрические', 'DAEDRA_GLOSS' )] ритуалы. Если не пресечь это, то вскоре он начнёт собирать приспешников.\n\n#bold Чем станет родина альдмеров под властью этого Аран-Эля? Раем покоя или пристанищем бедствий? Это зависит лишь от вас.#!"

 bm_ir_cyro:0 "Расколотый красный алмаз"
 bm_ir_cyro_desc:0 "Двадцать лет назад потентат Савириен-Чорак и все его наследники были убиты, что положило конец Второй империи.\n\nВосемь лет назад Аттреб Сосильдор победил потентата Айксниераса-Веса и сам стал владыкой Сиродила.\n\nШесть лет назад правители Нибенейской долины восстали против Аттреба под предводительством Венара Куптора.\n\n#bold Год назад Аттреб умер. Единство в Сиродиле было разрушено и началось Междуцарствие.#!"
 bm_ir_cyro_hesta:0 "$king_feudal_female_heartlands$ Геста"
 bm_ir_cyro_hesta_subheading: "$king_feudal_female_heartlands$ Румаре"
 bm_ir_cyro_hesta_desc:0 "Леди Геста правит центральными землями Румаре как наследница несостоявшегося императора Аттреба. Несмотря на хаос последнего десятилетия Имперский город по-прежнему остаётся жемчужиной Тамриэля, и держава Гесты одна из самых стабильных и процветающих во всём Сиродиле. Но в Сиродиле множество властителей, и каждый мечтает править столицей…\n\n#bold Падёт ли сосильдорское королевство жертвой амбиций военачальников, как и остальной Сиродил, или наследникам Аттреба хватит амбиций, чтобы объединить Империю и воплотить его мечту?#!"
 bm_ir_cyro_caius:0 "Кай Лекс"
 BOOKMARK_RELATION_REGENT:0 "Регент"
 bm_ir_cyro_venaros:0 "$title_grand_overlord$ Венар"
 bm_ir_cyro_venaros_subheading: "$title_grand_overlord$ Нибенея"
 bm_ir_cyro_venaros_desc:0 "Когда Аттреб издал печально известный «Указ о цаэски», Венар увидел в этом свой шанс. Он возглавил восстание и одержал победу в битве в лесах Поппад, где и погиб сам Аттреб. Куптор ныне именует себя великим владыкой Нибенея, хотя лорды за пределами Циснибена отвергают его притязания, а родовое владение Бравил всё ещё ему не принадлежит.\n\n#bold Вернёт ли Венар утраченные земли его семьи и станет ли истинным владыкой Нибенея?#!"
 bm_ir_cyro_hieron:0 "Король Иерон"
 bm_ir_cyro_hieron_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_hieron_desc:0 "Когда Аттреб обратился за помощью к правителям Коловии, Санкр Тор отказал. Когда же Аттреб потерпел поражение, Санкр Тор остался сильным и непобеждённым, а его король с радостью принялся склонять на свою сторону коловианских лордов. Он твёрдо убеждён, что именно он — тот великий человек, который нужен Сиродилу, и что он #bold добьётся#! успеха там, где Аттреб потерпел неудачу!\n\n#bold Вернётся ли род Дор на Рубиновый трон или коловианские претенденты будут разбиты во второй раз?#!"
 bm_ir_cyro_ilnori: "Король Ильнори"
 bm_ir_cyro_ilnori_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_ilnori_desc:0 "Не так-то просто понять, выиграли ли Аквиларии больше от резкого взлёта Аттреба или же от его внезапного падения. Когда военачальник захватил Имперский город, Гельвидий Аквиларий был назначен править Корролом. Теперь же, после гибели Аттреба независимые герцоги Коррола превратились в одну из наиболее могущественных сил Коловианского нагорья.\n\n#bold Превзойдёт ли Ильнори наследие Аттреба или пребывание Аквилария на троне окажется ещё более недолговечным?#!"
 bm_ir_cyro_abnur:0 "Герцог Абнур"
 bm_ir_cyro_abnur_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_abnur_desc:0 "«Нерешительность — погибель судьбы». Так говорил Абнур в начале своего «регентства» от имени отца. Взор Тарна устремлён на город Сиродилов, в его мыслях его род уже сидит на Рубиновом троне. Никто не отрицает магического дара Абнура и его политической проницательности, но выдающихся стратегических талантов он никогда не проявлял.\n\n#bold Сумеет ли Абнур уцелеть в хаосе Нибенея и сокрушить его многочисленных военачальников?#!"
 bm_ir_cyro_harald:0 "Король Харальд"
 bm_ir_cyro_harald_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_harald_desc:0 "После смерти великого вождя Борвира из Брумы трон занял его мягкий и сдержанный сын. Нынешние вожди кланов отвергают авторитет рода Морозной Бороды, а восточные правители перестали платить дань Бруме и фактически стали независимы.\n\n#bold Станет ли мягкий характер Харальда погибелью для его королевства — или же он принесёт пользу его клану?#!"



 # recommanded characters for the iliac bay 450
 bm_iliac:0 "В тени Башни"
 bm_iliac_desc:0 "Адамантиновая Башня, колыбель Нирна на острове Балфиера, уже в который раз становится молчаливой свидетельницей того, как торговля уступает место войне в тихих водах Илиака.\n\nИстория залива как естественной границы между Хай-Роком и Хаммерфеллом всегда являла собой причудливое переплетение происходящих здесь завоеваний, интриг, эпидемий и восстаний. Бретонцы, альтмеры, редгарды и даже пришлые акавирские пираты да орки-налётчики — все желают заполучить в свои руки власть над одним из богатейших регионов Тамриэля.\n\nЗа прошедший век благодаря хаосу Междуцарствия даже для самых ничтожных баронов открылась возможность назваться королями собственных клочков земли, открыв новую главу в истории вечной грызни за Илиак.\n\n#bold Суждено ли кому-нибудь стать новым неоспоримым владыкой залива? Или же этот регион обречён на раздробленность?#!"
 bm_iliac_donella:0 "Королева Донелла"
 bm_iliac_donella_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_donella_desc:0 "Королева Донелла выросла, слыша истории о завоевании острова Бетони племенем Морской Скалы. Орки жестоко расправились с местной королевской семьёй, включая её любимую тетю Нурезу, создав орочий плацдарм у входа в залив Илиак. И это бельмо на глазу сохраняется до сих пор.\n\nПосле этого проявления слабости лорды Гленумбры постепенно теряют веру в способность Даггерфолла защитить их, выдвигая требования о независимости, которые угрожают самому существованию королевства.\n\n#bold Сможет ли королева Донелла изменить этот сценарий или Даггерфолл будет низведён до второстепенной державы региона?#!"
 bm_iliac_lywel:0 "Король Ливель"
 bm_iliac_lywel_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_lywel_desc:0 "Король Ливель, ветеран великой войны против Орсиниума, стал свидетелем того, как торговые сделки его королевства терпят крах, поскольку богатые порты Хаммерфелла постепенно закрываются на фоне недавней Революции Предшественников.\n\nБанкротство Вэйреста, что некогда был известен как жемчужина залива, позволило некоторым недовольным вассалам, всё больше сомневающимся в способности короля защитить их от вторжений Диренни и редгардов, разорвать связи со столицей, объявить о своей независимости и ещё больше подорвать финансы королевства.\n\n#bold Сможет ли король Ливель вернуть своему королевству былую славу или Вэйрест останется лишь в древней истории?#!"
 bm_iliac_ancotar: "Кинлорд Диренни Анкотар"
 bm_iliac_ancotar_subheading: "Страж Балфиеры"
 bm_iliac_ancotar_desc:0 "Мечтая подражать своим предкам Эйдену и Рейвену Диренни, Кинлорд Анкотар медленно восстанавливает господство своего клана над их бывшими владениями в Великой Бретонии.\n\nОн лично наблюдал за хаосом, вызванным Междуцарствием после убийства [Glossary( 'потентата', 'POTENTATE_GLOSS' )], и поэтому Анкотар уверен, что лишь возрождение гегемонии Диренни над Хай-Роком может принести столь необходимый мир в регион.\n\n#bold Сможет ли Анкотар достичь своих целей или Диренни так и останутся всего лишь хранителями Адамантиновой башни?#!"
 bm_iliac_vhosek:0 "Король Восек"
 bm_iliac_vhosek_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_vhosek_desc: "Король Восек правит молодым, но амбициозным королевством. Оджвамбу расположен на сухопутной границе Хай-Рока и Хаммерфелла, но никогда не играл активной роли в регионе из-за присутствия Империи и был ограничен границами, определёнными Реманом I в конце Первой эры.\n\n#bold Воспользуется ли Восек падением Империи, чтобы расширить земли Оджвамбу? Или, быть может, он даже сумеет объединить предшественников?#!"
 bm_iliac_ulmug:0 "Верховный вождь Улмуг"
 bm_iliac_ulmug_subheading: "Верховный вождь Фарруна"
 bm_iliac_ulmug_desc:0 "Улмуг гро-Гаротмук вырос в причудливой тени своего отца Гаротмука, необычного орка и необычного отца. Поражённый культурными потерями от утраты Орсиниума, он закопался в писания давно умерших орков, не заботясь о воинских качествах вождя.\nНо это не про Улмуга. Задавшись целью стать образцом воинской культуры орков, он, ещё будучи юнцом, со звериной свирепостью постигал путь воителя. Что-то и досталось Улмугу в наследство от отца, к примеру, грамотность, что молодой орк с неохотой признаёт, в остальном он отбросил пережитки Гаротмука и взамен взял в руки топор, избрав стезю налётчика.\n\n#bold Удастся ли ему вновь наладить набеговую экономику Фаруна? Заберёт ли Улмуг для орков богатства землевладельцев Предела? Или он будет грезить о том чтобы последовать за отцом, в архивы, отчаянно искать тот последний манускрипт, который спасёт ему жизнь..?#!"

 # recommanded characters for the abecean 450
 bm_abecean:0 "Приливные стремления" 
 bm_abecean_desc:0 "Феномен карпаччо из абесинского окуня — деликатеса, вхожего и в альтмерскую, и в бретонскую, и в йокуданскую, и в сиродильскую кухню — иллюстрирует, сколь велико культурное разнообразие Абесинского региона.\n\nС падением Потентата безопасность в море существенно снизилась, и вместе с тем пришла в упадок торговля. Страховщики страхуют только самые оснащённые корабли, да и те нередко грабят ещё на виду у докеров. Покой уступил место организованному хаосу, создавшему две противоборствующих стороны: на одной — те, кто продолжает заниматься честной торговлей, а на другой — те, кто за их счёт предпочитает заниматься нечестной.\n\nВолны этих противоречий обернулись качкой для торговых узлов, таких как Строс М'Кай, Систры и Причал Абы, — им придётся выбирать сторону. Но вот периферия Абесин давно сделала выбор в пользу корсаров.\n\n#bold Приливы приходят и уходят, а старые волны смываются новыми. Солнечные деньки подошли к концу, и пришло время решить, кто вы: беспомощный государь или свирепый пират?#!"
 bm_abecean_afshuur:0 "Князь Афшур"
 bm_abecean_afshuur_subheading: "Князь Хнаса"
 bm_abecean_afshuur_desc: "Всего за пять лет Афшур до-Аддин прошёл путь от мелкого дворянина-венценосца, которому доверили управление бедными землями, до правителя одного из крупнейших городов Хаммерфелла. Заручившись поддержкой жителей Причала Абы, недовольных тарифами и религиозной политикой, он организовал переворот против наместника-венценосца и провозгласил себя независимым князем Хнаса.\n\n#bold Сумеет ли Афшур обогатить себя и свой народ, или его княжество обречено?#!"
 bm_abecean_arctur:0 "Король Арктур"
 bm_abecean_arctur_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_abecean_arctur_desc:0 "Арктур Доралис принадлежит к той редкой породе королей-пиратов, которые промышляют как на путях снабжения, так и в портах своих соперников. Он сверг Дом Оло практически в одночасье, убив короля Рогата в бою в весьма удачном для него году 2Э 444. Арктур провозгласил себя королём Анвила по праву завоевания.\n\nЕго дальновидность и военная смекалка не вызывают сомнений, и немало мелкого люда опасается за свою жизнь и конечности, гадая, что выберет свой новой целью этот коварный и своенравный корсар. В конце концов, пираты всегда ищут где бы поживится.\n\n#bold Сможете ли вы угомонить своих каперов и стать уважаемым королём или морская жизнь не отпустит вас?#!"
 bm_abecean_fabrelle: "Герцогиня Мартина"
 bm_abecean_fabrelle_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_abecean_fabrelle_desc: "Отец Мартины был назначен управлять архипелагом Систры и его тюрьмами от имени провинциального наместника Хаммерфелла. К несчастью для Мартины, Империя погрузилась в хаос, наместник мёртв, Абесинское море кишит пиратами, а она застряла на самом отдалённом острове архипелага.\n\n#bold Мартина окружена врагами со всех сторон. Выстоят ли Систры в этом шторме — или повторят судьбу Империи?#!"
 bm_abecean_velehk:0 "Верховный адмирал Велек"
 bm_abecean_velehk_subheading: "Верховный адмирал Бессердечной Орды"
 bm_abecean_velehk_desc:0 "Велек Сейн — [Glossary( 'даэдрический', 'DAEDRA_GLOSS' )] лорд, пребывающий в Нирне необычайно долго. Он родился из хаоса Обливиона и успел изгнать многих своих противников во тьму, прежде чем скромный йокуданский колдун призвал его в Нирн.\nБыстро расправившись с глупым смертным, он остался с избытком времени и избытком жестокости. Так он и выбрал своим занятием пиратство. Неисчислимое количество «героев» пытались изгнать его, но были сломлены разумом и телом либо убиты — в лучшем случае.\n\n#bold Захват Панкора было первым шагом на пути ко всемирному опустошению… или господству? Поглотит ли тьма отголосок Сейна или перед нами рождение легендарного короля-пирата?#!"

 # recommanded characters for valenwood 450
 bm_vw_nilwen_nilwen:0 "Королева Каморан Нилвен"
 bm_vw_nilwen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_vw_nilwen_desc:0 "Королева Нилвен правит разделённым королевством, унаследовав его от слабого отца, передавшего Кормаунт своему незаконнорождённому сыну. Теперь Нилвен окружена врагами со всех сторон, но она принимает вызов и готова доказать свою храбрость на поле боя.\n\n#bold Напомните ли вы Валенвуду о могуществе Древлего Корня и завоюете титул королевы-лани? Или королевству Нилвен суждено погибнуть, затерявшись в истории?#!"

# Kamal
 bm_group_572: "2Э 572"
 bm_kamal: "#R Камаль#!"
 bm_kamal_desc: "#R ПОКА ЕЩЁ НЕ ДОСТУПНО ДЛЯ ИГРЫ.\nИСКЛЮЧИТЕЛЬНО ДЛЯ ОЗНАКОМЛЕНИЯ С РАННИМИ ИСТОРИЧЕСКИМИ ИСХОДАМИ#!"
 bm_kamal_aethra: "Императрица Этра"
 bm_kamal_aethra_subheading: "Императрица Империи Дуркораха"
 bm_kamal_aethra_desc: "Этра Дуркорах недавно унаследовала великий дар от своего отца: в будущем историки назовут Анейрина «Последним из [Glossary( 'Императоров Длинного Дома', 'LONGHOUSE_EMPEROR_GLOSS' )]», ведь именно он окончательно завоевал сердце Империи, которым теперь правит Этра. Однако ни она, ни её отец не предвидели вторжения камаль на восточных рубежах государства.\n\n#bold Поможете ли вы Этре превратить эту угрозу в новую возможность и выйти из хаоса ещё более могущественной, чем её отец?#!"
 

