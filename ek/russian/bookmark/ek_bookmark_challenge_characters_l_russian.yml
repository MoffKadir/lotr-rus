# 450
# Oreyn Bearclaw
 challenge_character_oreyn: "Вождь Орейн"
 challenge_character_oreyn_desc: "Орейн Медвежий Коготь, сын босмерского шамана и данмерки-мистика, в раннем возрасте отправился на поиски приключений и славы. После убийства ведьмы-змеи Гленвифаунвы Орейна прославляли как героя во всем Валенвуде, и он даже на короткое время получил место при дворе королевы Нилвен. Но до него дошли слухи, что его безжалостный отец с помощью нечестивой некромантии захватил Древочаг. Услышав эту новость, Орейн помчался домой, собрав под свои знамёна племена Лесной Сени, дабы спасти королевство.\n\n#bold Его мощь велика, но легионы нежити практически неисчислимы… Сможете ли вы одержать верх в неравной борьбе и сотворить легенду, что будет известна от Древочага до Шеогорада?#!"

# Malgoth Blackroot
 challenge_character_malgoth: "$duke_feudal_male_bosmeris$ Малгот"
 challenge_character_malgoth_desc: "Большинство хранителей кланов довольствуются тем, что защищают своих сородичей. Это не про Малгота — он мечтает быть королём Валенвуда. С начала своих завоеваний десять лет назад он вытеснил альтмерских колонистов и теперь ведёт войну против хектахамских айлейдов.\n\n#bold Сможет ли Малгот осуществить свои грандиозные амбиции и занять королевский трон, которого, как он сам верит, справедливо заслуживает? Или Малгот падёт, так и не достигнув бессмертной славы?#!"
 
 challenge_character_rilis: "Аран Торинан Рилис XII"
 challenge_character_rilis_desc: "Король Рилис всегда славился своими амбициями, но в последнее время он окончательно ступил на тёмный путь, тайно поклявшись в верности Молаг Балу и отрёкшись от поклонения Аэдра.\n\n#bold Окажется ли его борьба за власть успешной, или же он погибнет подобно другим даэдрапоклонникам, что пытались закрепиться на островах?#!"

 challenge_character_zyg: "Вождь Зыг"
 challenge_character_zyg_desc: "Родившийся в Южном Алиноре Зыг был изгнан из своего племени и отправился на север. Племя Костежителей не спешило доверять чужаку, пока тот не защитил их вождя от покушения. Зыг безжалостно перебил предателей, получив поддержку смертельно раненого вождя. На похоронах он поклялся отомстить кин-владениям Клаудреста...\n\n#bold Сможет ли Зыг исполнить кровную клятву, данную своему покровителю? Или же его опрометчивое обещание навлечёт гибель на Калкракт?#!"