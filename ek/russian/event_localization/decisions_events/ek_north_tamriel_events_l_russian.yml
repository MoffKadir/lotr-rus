l_russian:
 north_tamriel.0001.t:0 "Воссоединение Скайрима"
 north_tamriel.0001.desc.intro:0 "Смерть верховного короля Логрольфа ознаменовала начало многолетней гражданской войны в Скайриме, во время которой восточная и западная половины провинции отказывались признавать права на престол претендента противоборствующей стороны.\n\n"
 north_tamriel.0001.desc.war:0 "Многие жители Скайрима боялись, что из этого патового положения никак не выйти и что норды навечно будут разделены. Но у судьбы были другие планы. [winner.GetFullName] [Select_CString(winner.IsFemale, 'столкнулась', 'столкнулся')] с армиями, которыми [Select_CString(loser.IsFemale, 'командовала', 'командовал')] [loser.GetFullName], и [Select_CString(winner.IsFemale, 'разгромила', 'разгромил')] их! По мере того, как [winner.GetSheHe] [Select_CString(winner.IsFemale, 'ступала', 'ступал')] по своей новой территории, каждый ярл и вождь, которые до этого были верны [Select_CString(loser.IsFemale, 'проигравшей', 'проигравшему')], присягнули [winner.GetHerHim], и вскоре не осталось никого, кто бы оспаривал [winner.GetHerHis] право на престол.\n\n"
 north_tamriel.0001.desc.other:0 "Прошли года, и хотя многие думали, что война между двумя половинами провинции неминуема, судьба решила, что родина нордов должна быть объединена мирно.\n\n"
 north_tamriel.0001.desc.eastern:0 "Сыновья и дочери Исграмора вновь последуют за королями и королевами востока!"
 north_tamriel.0001.desc.western:0 "Баланс сил в Скайриме сместился, отныне корона севера принадлежит ярлам запада!"
 north_tamriel.0001.desc.cyro_nord:0 "Нынешние монархи Скайрима, правящие собратьями-нордами, родом из Джерольских гор."
 north_tamriel.0001.desc.reachfolk:0 "Над Скайримом развеваются знамёна Предела: дети Фаолана одолели отпрысков Атморы."
 north_tamriel.0001.desc.dwemer:0 "Нет сомнения в том, что двемерам в Скайриме нет равных."
 north_tamriel.0001.desc.falmer:0 "По прошествии нескольких эр крови и мучений, Скайрим вернулся к народу фалмеров."
 north_tamriel.0001.desc.skaal:0 "Всем Скайримом теперь правят суровые скаалы, выходцы с другого берега моря Призраков."
 north_tamriel.0001.desc.mountain_orc:0 "Неостановимая сила горных орков позволила им захватить Скайрим."
 north_tamriel.0001.desc.atmoran:0 "Атморцы, совершив последнее Возвращение, вновь завоевали свою тамриэльскую родину."
 north_tamriel.0001.desc.other_culture:0 "Народ Скайрима во всех владениях следует приказам #L [winner.GetCulture.GetCollectiveNoun]их#! лордов."
 north_tamriel.0001.a:0 "Скайрим теперь — единая земля под властью #L [winner.GetCulture.GetCollectiveNoun]ого#! правителя!"
 
 north_tamriel.0005.t:0 "Раздел Скайрима"
 north_tamriel.0005.desc:0 "После смерти верховного короля Логрольфа Скайрим разделился на две части. Новые Владения поддерживают нового претендента с запада, в то время как Старые Владения сплочились и поддерживают дочь последнего верховного короля.\nТеперь, после нескольких лет шаткого мира и холодной войны, два претендента на старинный трон Исграмора встретились и положили конец этому конфликту.\n\n[wk_holder.GetTitledFirstName] и [ek_holder.GetTitledFirstName] признали друг друга как [wk_holder.GetTitleTierName] Западного Скайрима и [ek_holder.GetTitleTierName] Восточного Скайрима соответственно.\n\nТолько время покажет, будет ли этот мир долгим или одна из сторон однажды попытается вновь претендовать на трон старого верховного королевства…"
 north_tamriel.0005.a:0 "Отчизна раздроблена, но спасена?" 

 north_tamriel.0010.t: "Столица Скайрима"
 north_tamriel.0010.desc: "За годы у Скайрима было много столиц, но ни одна не сравнится по значимости с Виндхельмом и Солитьюдом. Я [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] верховное королевство и пора выбирать столицу снова.\n\nЯ могу править из древнего Виндхельма, города самого Исграмора и его потомков, которые жили там вплоть до Войны за престолонаследие.\n\nСолитьюд, в свою очередь, менее древний город, но зато это самый богатый из городов Новых Владений, и он долгое время был столицей во времена поздней [Glossary( 'Первой эры', 'FIRST_ERA_GLOSS' )].\n\nИ, конечно, я могу не соблюдать традицию и править из собственного домена, как уже делали многие короли до меня.\n\nКакой же город мне выбрать?"
 north_tamriel.0010.a: "Виндхельм, Город Королей!"
 north_tamriel.0010.b: "Солитьюд, могучий и богатый город Запада!"
 north_tamriel.0010.c: "Мой город, какой же ещё!"
 
 north_tamriel.0011.t:0 "Великий Солстхейм"
 north_tamriel.0011.desc:0 "После того, как мы переплыли море Призраков и ступили на земли Скайрима, мы захватили острова Стылая Скала и Каприз Яфета.\n\nМы восстановили местные порты и гавани, и вскоре они будут служить промежуточной остановкой для путешествующих между материком и Солстхеймом."
 north_tamriel.0011.a:0 "Выпьем за завоевания! Прошедшие и грядущие!"
 
 north_tamriel.0021.t:0 "Девятое владение"
 north_tamriel.0021.desc:0 "Хотя Предел был завоёван королём Врагге в ранние годы Первой эры, регион никогда надолго не оставался под властью нордов, постоянно возвращаясь в руки свирепых людей Предела.\n\nМои усилия позволили силой вырвать укоренившееся в Пределе варварство, и поселенцы со всего Скайрима съезжаются в этот регион, стремясь заселить новые земли."
 north_tamriel.0021.a:0 "Предел наконец познает мир."
 
 north_tamriel.0022.desc:0 "Хотя Предел был завоёван королём Врагге в ранние годы Первой эры, регион никогда надолго не оставался под властью нордов, постоянно возвращаясь в руки свирепых людей Предела.\n\nУсилия, которые [Select_CString(reach_pacifier.IsFemale, 'приложила', 'приложил')] [reach_pacifier.GetTitledFirstName], позволили наконец поместить Предел в лоно цивилизации, и теперь поселенцы со всего Скайрима съезжаются в регион, стремясь заселить новые земли."
 north_tamriel.0022.a:0 "Предел наконец познает мир."
 
 north_tamriel.25.t:0 "Тень Высокого Хротгара"
 north_tamriel.25.desc:0 "Wow, much desc"
 north_tamriel.25.a:0 "Hrothgar is here now"

 north_tamriel.0030.t: "Нордская Империя"
 north_tamriel.0030.desc: "Под моим началом норды вернули себе свои законные земли. Наши кланы и сословия едины как братья и сёстры перед лицом врагов, мы денно и нощно трудимся ради общих целей. Моё слово — закон, мой трон — средоточие истинной власти.\n\nИ вот мой первый указ: мы должны заявить о себе всему Мундусу. Мы можем взять пример с наших великих предков-атморцев и истинной истории наших земель, назвав себя #bold Флотом Возвращения#!. Также мы можем воздать первенство земле, что принадлежит нам, нашей #bold Отчизне#!. Помимо этого, мы можем орудовать нашим прошлым, словно дубиной, провозгласив #bold Старое Королевство#!. Наконец, мы можем отбросить всякие претензии на легитимность и законы: мы — #bold Нордская Империя#!."
 north_tamriel.0030.a: "Победа и империя!"
 north_tamriel.0030.a.tooltip: "[GetTitleByKey('h_nordic_empire').GetName] сохранит своё изначальное название. Ваш персонаж будет использовать титул «$hegemon$» или «$hegemon_female$»."
 north_tamriel.0030.b: "Время вернуть Старое Королевство!"
 OLD_KINGDOM: "Старое Королевство"
 north_tamriel.0030.b.tooltip: "[GetTitleByKey('h_nordic_empire').GetName] будет переименована в $OLD_KINGDOM$. Ваш персонаж будет использовать титул «$title_ysmir_male$»."
 north_tamriel.0030.c: "Славься, о Отчизна!"
 FATHERLAND: "Отчизна"
 north_tamriel.0030.c.tooltip: "[GetTitleByKey('h_nordic_empire').GetName] станет известна как $FATHERLAND$. Ваш персонаж будет использовать титул «$title_harbinger_male$»."
 north_tamriel.0030.d: "Славься, о [ROOT.Char.Custom('GetQueenKing')]-капитан!"
 FLEET_RETURN: "Флот Возвращения"
 north_tamriel.0030.d.tooltip: "[GetTitleByKey('h_nordic_empire').GetName] будет переименована во $FLEET_RETURN$. Ваш персонаж будет использовать титул «$title_king_captain_male$» или «$title_king_captain_female$»."
 
 north_tamriel.1001.t: "Гегемония Диренни"
 north_tamriel.1001.desc: "Клан Диренни стал доминирующим семейством в Хай-Роке в первые века [Glossary( 'Первой эры', 'FIRST_ERA_GLOSS' )], правя всем регионом, пока они не потеряли большую часть своего могущества из-за возвышения бретонской знати. Но наследие Диренни никуда не исчезло, и я нахожусь на верном пути к его возвращению. Обеспечив контроль над центральными владениями Диренни, я [Select_CString(ROOT.Char.IsFemale, 'провозгласила', 'провозгласил')] восстановление Гегемонии. Хотя некоторые всё ещё неохотно принимают мои притязания, вскоре все они падут ниц перед своим новым гегемоном."
 north_tamriel.1001.desc_direnni: "Мои предки когда-то были хозяевами Хай-Рока, ни один чужеземец не мог оспорить нашу власть. Не справилась даже могучая Алессианская Империя. Но шло время, и мы были вынуждены уступить наши земли бретонцам, что некогда были нашими подданным. Однако мы не забыли о былых свершениях нашей древней династии, и сегодня я официально провозглашаю восстановление Гегемонии. Благодаря моему чуткому лидерству и силе моей крови мы выкуем Гегемонию Диренни заново!"
 north_tamriel.1001.a: "Власть и слава ожидают нас и наш род!"
 
 north_tamriel.1011.t: "Восстановление Гегемонии"
 north_tamriel.1011.desc: "Новая эпоха начинается на севере Тамриэля! Все земли, которыми некогда правил древний клан Диренни, ныне находятся под моим прямым контролем. Я собираю всех своих вассалов от Гленумбры до Предела и от Ривенспайра до Краглорна, и все они присягают на верность своему новому гегемону. В далёкое прошлое ушли дни малых королей Хай-Рока, ведь Гегемония Диренни наконец-то восстановлена."
 north_tamriel.1011.a: "Де Рерум Диреннис!"

 north_tamriel.1012.t: "Диренни"
 north_tamriel.1012.desc: "Мой клан восстановил Гегемонию и сокрушил наших древних сиро-нордских врагов. Остаётся лишь один вопрос: продолжим ли мы править как гегемоны, держась на расстоянии и довольствуясь самоуправлением местной знати? Или же пришло время для возвышения новой эльфийской нации?"
 north_tamriel.1012.a: "Пришло время для создания нового эльфийского королевства."
 north_tamriel.1012.a.tooltip: "[GetTitleByKey('h_direnni_hegemony').GetName] сохранит своё прежнее название. Ваш персонаж будет использовать титул $emperor_feudal_male_altmer$ или $emperor_feudal_female_altmer$."
 north_tamriel.1012.b: "Нет смысла отказываться от традиций."
 north_tamriel.1012.b.tooltip: "[GetTitleByKey('h_direnni_hegemony').GetName] станет известен как $DIRENNI_HEGEMONY$. Ваш персонаж будет использовать титул $title_hegemony_male$."
 DIRENNI_HEGEMONY: "Гегемония Диренни"

 ek_wrothgar_event.0001.t:0 "Становление ротгарцев"
 ek_wrothgar_event.0001a.desc: "Горы Ротгара издавна служили домом для свирепых орков и гоблинов, и никто, кроме них, по-настоящему не владел этой землёй… до сих пор.\n\nМы, ротгарцы, величаем эти горные вершины своим домом. Не менее стойкие, чем орки и, когда надо, такие же свирепые, как и предельцы; мы также умеем вести прибыльную торговлю и наследуем от наших предков-северян прекрасные традиции пехоты.\n\nИ всё же мы можем многому научиться у народов, столь долго выживавших в этих землях. Стоит ли нам приспособиться и перенять их черты или же мы должны следовать своим собственным путём?"
 ek_wrothgar_event.0001b.desc: "Горы Ротгара издавна служили домом для свирепых орков и гоблинов, и никто, кроме них, по-настоящему не владел этой землёй… до сих пор.\n\nНекоторые представители нашего народа — ротгарцы, как они себя называют, обосновались в этих горах. Не менее стойкие, чем орки и, когда надо, такие же свирепые, как и предельцы; они также умеют вести прибыльную торговлю и наследуют от своих предков-северян прекрасные традиции пехоты.\n\nИ всё же они могут многому научиться у народов, столь долго выживавших в этих землях. Стоит ли им приспособиться и перенять их черты или же они должны следовать следовать своим собственным путём?"
 ek_wrothgar_event.0001.option.1: "Орки — отважные воины, у них многому можно научиться"
 ek_wrothgar_event.0001.option.1.tooltip: "[wrothgarian_culture.GetName] получат традицию [GetCultureTradition('tradition_only_the_strong').GetName|V]"
 ek_wrothgar_event.0001.option.3: "Ротгарцы проложат свой собственный путь"
 ek_wrothgar_event_cultural_acceptance_gain: "Взаимное уважение между народами"