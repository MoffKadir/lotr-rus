l_russian:
 south_tamriel.0001.t: "Сияние Арнезии"
 south_tamriel.0001.desc:0 "Ах, Арнезия — могучая крепость-королевство кантемирцев!\n\nЗдесь мудрый оракул Кантемира некогда достигла просветления, обретя от учителей-Хистов истинное понимание Устремления. Арнезия, наряду со своими братьями Архоном и Торном, была безопасной гаванью в этих негостеприимных землях и настоящим укрытием от испытаний Мундуса. В этом городе, словно приливы и отливы, богатство кантемирцев отступало и приходило вновь, но никогда не опускалось на дно.\n\nВо времена, когда велотийцы переживали медленный упадок, [ROOT.Char.GetFullNameNicknamedNoTooltip] своим руководством [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] им оседлать волну. [ROOT.Char.GetSheHe|U] [Select_CString(ROOT.Char.IsFemale, 'смыла', 'смыл' )] всё сопротивление снаружи и изнутри и [Select_CString(ROOT.Char.IsFemale, 'присоединила', 'присоединил' )] земли к югу от крепости вплоть до Архона, восстановив давно утраченное королевство Арнезия.\n\nКотринги, аргониане, и, возможно, не только они, ещё узнают о прочности кантемирских стен и кантемирской веры."
 south_tamriel.0001.a:0 "Арнезия, моя любимая…"
 
 south_tamriel.0011.t:0 "Топи Тира"
 south_tamriel.0011.desc:0 "После несчитанного количества войн и набегов со стороны жителей Топей Тира, регион наконец перешёл под наш контроль.\nНаша администрация не покладая рук работала над интеграцией Топей Тира, и теперь их народ и правящая элита зовут Чернотопье своим домом."
 south_tamriel.0011.a:0 "Больше никаких набегов и войн."
 
 # it's a very simple event with simple desc, not gonna bother making too unique descs for it
 south_tamriel.0012.t:0 "Топи Тира"
 south_tamriel.0012.desc:0 "После несчитанного количества войн и набегов со стороны жителей Топей Тира, регион наконец перешёл под наш контроль.\nНаша администрация не покладая рук работала над интеграцией Топей Тира, и теперь их народ и правящая элита зовут Кантемирис своим домом."
 south_tamriel.0012.a:0 "Больше никаких набегов и войн."

 south_tamriel.0013.t:0 "Топи Тира"
 south_tamriel.0013.desc:0 "После выдворения захватчиков регион снова оказался под нашим контролем.\nНашей администрации предстоит безустанная работа по повторной интеграции Топей Тира и компенсации ущерба, который был нанесён умам и сердцам их обитателей."
 south_tamriel.0013.a:0 "Справедливость восторжествовала!"

 south_tamriel.0014.t: "Новое племя"
 south_tamriel.0014.desc: "Наш народ нашёл сильного и расчётливого неприятеля в лице людей с запада, которые веками сражались с нами за эту землю. Бесконечная резня не принесла нам мира, но, сражаясь с ними, мы переняли систему торговли и иерархию чужаков.\n\nВозможно, что единственный способ одолеть этого противника — стать подобным ему. Перемены и адаптация — сама суть нашего народа, и сейчас выпал редкий шанс задать им направление."
 south_tamriel.0014.option.1: "Городские магократы сведущи в законе и мудры, к ним стоит прислушаться."
 south_tamriel.0014.option.1.tooltip: "[culture|E] [ojel_culture.GetName] получит [Concept('tradition', 'традицию')|E] «[GetCultureTradition('tradition_imperial_battlemages').GetName]»"
 south_tamriel.0014.option.2: "Сельский мистицизм куда ближе нашему духу."
 south_tamriel.0014.option.2.tooltip: "[culture|E] [ojel_culture.GetName] получит [Concept('tradition', 'традицию')|E] «[GetCultureTradition('tradition_ut_nibenu_folklore').GetName]»"
 south_tamriel.0014.option.3: "Наше новое племя должно развиваться естественным путём."