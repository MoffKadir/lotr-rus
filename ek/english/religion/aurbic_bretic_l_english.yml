# Beldama Wyrd
 beldama_wyrd: "Beldama Wyrd"
 beldama_wyrd_adj: "Beldama"
 beldama_wyrd_adherent: "Beldama Faithful"
 beldama_wyrd_adherent_plural: "Beldama Faithful"
 beldama_wyrd_desc: "An old coven of witches, dedicated to the Jephre, the Forest God of the Bretons. They serve and protect the forest, with the help of the Elemental Guardians. Despite their peaceful ways, the Empire of Cyrodiil and the various lords of High Rock see them as potential threats."
 beldama_wyrd_religious_head_title_name: "Beldama Wyrd"
 
# Glenmoril Wyrd
 glenmoril_wyrd: "Glenmoril Wyrd"
 glenmoril_wyrd_adj: "Glenmoril"
 glenmoril_wyrd_adherent: "Glenmoril Faithful"
 glenmoril_wyrd_adherent_plural: "Glenmoril Faithful"
 glenmoril_wyrd_desc: "The nature-witches of the Glenmoril Wyrd are dedicated to Hircine. Their powerful magic is known to cure vampirism and lycanthropy, which puts them at odds with other worshippers of the [Glossary( 'Daedric Prince', 'DAEDRA_GLOSS' )] of the Hunt, who consider lycanthropy as a blessing."
 glenmoril_wyrd_religious_head_title_name: "Glenmoril Wyrd"
 
# Druid Circles
 druid_circles: "Druidic Circles"
 druid_circles_adj: "Druidic"
 druid_circles_adherent: "Druidist"
 druid_circles_adherent_plural: "Druidists"
 druid_circles_desc: "Dubbed the True Way of Jephre by its faithful, the Druidic traditions of the Bretons are unique throughout Tamriel.  By decree of the storyteller they value the wilds and nature over civilisation which they see as ruinous and self-destructive. As an acknowledgement of this material and spiritual deficiency, Druidic practitioners gather in the wilds to conduct ceremonies and live closest to their god. Those aligned in their views will form a circle, the unit closest to a governing body a community of druids will have. Each circle is independent from one another, schisms both old and new preventing a return to the single minded worship of the Druids of Galen."
