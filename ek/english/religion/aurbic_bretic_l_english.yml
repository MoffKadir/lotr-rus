# Forgotten Gods
 forgotten_gods: "Forgotten Gods"
 forgotten_gods_adj: "Forgotten Gods"
 forgotten_gods_adherent: "Memorite"
 forgotten_gods_adherent_plural: "Memorites"
 forgotten_gods_desc: "A traditional folk faith of the Iliac Bay, with origins in the druidism of the ancient Breton tribes. Worshippers reject most gods of the Imperials, Redguards and Direnni, instead clinging to an idiosyncratic pantheon of gods and saints that have been absorbed from all manner of different cultures over the centuries, and which vary wildly from region to region."
 forgotten_gods_house_of_worship: "fellowship" 
 forgotten_gods_house_of_worship_plural: "fellowships" 
 forgotten_gods_religious_head_title: "Arch-Priest"
 forgotten_gods_religious_head_title_name: "Iliac Temple"
 forgotten_gods_religious_text: "obscure liturgies"

# Breton Aedra
 breton_aedra: "Breton Aedric"
 breton_aedra_adj: "Breton Aedric"
 breton_aedra_adherent: "Breton"
 breton_aedra_adherent_plural: "Bretons"
 breton_aedra_desc: "Before the Reman Empire brought the Eight Divines, the people of High Rock worshipped a combination of the elven [Glossary( 'Aedra', 'AEDRA_GLOSS' )] and the local spirits venerated prior to the Direnni arrival. Above everything, Auriel the King rules the heavens with his wives, Kyne and Mara, served by other gods."
 breton_aedra_religious_head_title_name: "the Ancestors"
 breton_aedra_religious_symbol: "the sun"