 #Eight Divines
 eight_divines: "Eight Divines"
 eight_divines_adj: "Eight Divines"
 eight_divines_adherent: "Divines Cultist"
 eight_divines_adherent_plural: "Divines Cultists"
 eight_divines_desc: "The worship of the Divines has changed since Alessia's rebellion, but the belief in the Eight and of the Covenant with Akatosh still shapes the beliefs of Cyrodiil. Local beliefs and Hero Gods can still be found throughout the province, and it is said that the Imperial City is home to a thousand cults..."
 eight_divines_religious_head_title: "Arch-Prelate"
 eight_divines_religious_head_title_name: "Chapel of Cyrodiil"
 
 #Breton Rite
 breton_cult: "Breton Rite"
 breton_cult_adj: "Breton Rite"
 breton_cult_adherent: "Bretonnite"
 breton_cult_adherent_plural: "Bretonnites"
 breton_cult_desc: "Worship of the Divines in High Rock began with the arrival of the Reman Empire. Breton nobles, seeking Cyrodiil's favour, started worshipping Imperial gods, which eventually spread to their subjects. After centuries of Imperial rule, the Divines replaced most of the old gods, but some [Glossary( 'Aedra', 'AEDRA_GLOSS' )] are still venerated: Magnus, Phynaster, and Jephre."
 breton_cult_religious_symbol: "divine banner"
 breton_cult_religious_text: "teachings"
 breton_cult_religious_head_title: "Arch-Prelate"
 breton_cult_religious_head_title_name: "Chapel of High Rock"
 breton_cult_devotee: "acolyte"
 breton_cult_devotee_plural: "acolytes"
