 #Marukhati (previously Temple of the One)
 temple_one: "Marukhati"
 temple_one_adj: "Marukhati"
 temple_one_adherent: "Marukhati"
 temple_one_adherent_plural: "Marukhati"
 temple_one_desc: "Marukhati Monkey Truth is an ancient faith dedicated to the worship of the Single God and uncovering mysteries of the divine. During the time of the Alessian Order, this religion was laden with tyrannical strictures and famous for repression, but in the modern day its adherents are largely scholars who disregard the dogma of their predecessors."
