 #Cult of Heroes
 hero_cult: "Cult of Heroes"
 hero_cult_adj: "Cult of Heroes"
 hero_cult_adherent: "Hero Cultist"
 hero_cult_adherent_plural: "Hero Cultists"
 hero_cult_desc: "The people of Cyrodiil have many legendary heroes in their history, some of whom are venerated alongside the Eight Divines for their virtues and great deeds. Local heroes, saints, emperors, and champions of Cyrodiil are constantly added to this malleable and ever-growing pantheon, which can vary wildly depending on the individual or region."
