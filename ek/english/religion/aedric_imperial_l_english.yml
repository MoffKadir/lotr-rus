 niben_cult_pantheon_term_has_have: "$pantheon_term_have$"
 niben_cult_desc: "The Nibenese practice a loose, tolerant, and profoundly diverse polytheism. The thousand cults of Nibenay vary greatly in doctrine, but they share a unifying tradition of elaborate costumes, tapestries, tattoos, brandings, and ceremonies dedicated to specific gods, ancestors, saints, and heroes."
