 #Reman Mysteries
 reman_cult: "Remanada"
 reman_cult_adj: "Remanic"
 reman_cult_adherent: "Remanite"
 reman_cult_adherent_plural: "Remanites"
 reman_cult_desc: "Remanada is the esoteric, literate, and massively mythologized worship of the legendary emperor Reman Cyrodiil. Popular among Colovian nobles, Remanic fraternal cults believe that the king embodies the land he rules as an extension of his body and mind. Especially virtuous kingship may 'become' Reman and see to the restoration of his empire."
