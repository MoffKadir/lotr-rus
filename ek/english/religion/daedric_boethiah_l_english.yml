 # Boethiah Faiths
 boethiah_religion: "Boethiah"
 boethiah_religion_adj: "Boethiahide"
 boethiah_religion_adherent: "Boethiahide"
 boethiah_religion_adherent_plural: "Boethiahides"
 boethiah_religion_desc: "A loose collection of faiths all revering Boethiah, the Prince of Plots. All those who seek great things, either through battle or murder, chant her name. But the Dunmer of Morrowind and the Khajiits of Elsweyr hold her in higher regard."
 boethiah_religious_symbol: "snake-and-fist"
 boethiah_religious_text: "inspirations"
 boethiah_religious_head_title: "Prophet"
 boethiah_religious_head_title_name: "Cult of Boethiah"

 boethiah_cult: "Cult of Boethiah"
 boethiah_cult_adj: "Cult of Boethiah"
 boethiah_cult_adherent: "Boethiah Cultist"
 boethiah_cult_adherent_plural: "Boethiah Cultists"
 boethiah_cult_desc: "The Cult of Boethiah seeks to honour the Deceiver of Nations, by adhering to its strictest principles. They are known to cause great havock in Tamriel, be it by warfare or deceitful plots."