 idealmasters_adherent: "Ideal Servant"
 idealmasters_adherent_plural: "Ideal Servants"
 idealmasters_desc: "Long ago in the [Glossary( 'Merethic Era', 'MERETHIC_GLOSS' )], a powerful cabal of necromancers discovered a way to discard their mortal bodies and transform into beings of pure soul-energy, and with their newfound abilities carve out a realm for themselves somewhere within Oblivion. These are the Ideal Masters. Ruling from the Soul Cairn, these godlike entities often reach out and bargain with mortal sorcerers, granting power and arcane knowledge in exchange for souls."
