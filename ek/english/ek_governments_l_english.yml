 ## Contributions
 vassal_contribution_group: "Vassal Contribution Basis"
 vassal_contribution_none: "No Contribution"
    vassal_contribution_none_short: "None"
    vassal_contribution_none_desc: "#emphasis The [vassal|E] does not have to contribute any tax or levy to their [liege|E].#!\n\n#flavor The vassal is free of any burden towards their liege, enjoying great privileges. This may push vassals towards strenghtening their realm, and could help ambitious vassals in the long term.#!"
 vassal_contribution_prowess: "Contribution Based on Prowess"
 vassal_contribution_tied_prowess_name: "Vassal Contribution Based on Prowess"
    vassal_contribution_prowess_short: "Prowess"
    vassal_contribution_prowess_desc: "#emphasis The amount of taxes and levies the [vassal|E] is expected to send to their [liege|E] is tied to the Liege's [prowess|E].#!\n\n#flavor The vassal will only respect and recognize a strong liege. Should the liege grow old or physically weak, the vassal will keep most of the taxes and levies they would otherwise send. A weak liege means a weak realm.#!"
 vassal_contribution_opinion: "Contribution Based on Opinion"
    vassal_contribution_opinion_short: "Opinion"
    vassal_contribution_opinion_desc: "#emphasis The amount of taxes and levies the [vassal|E] is expected to send to their [liege|E] is tied to their [opinion|E] of their [liege|E].#!\n\n#flavor The vassal is expected to send an amount of taxes and levies they consider reasonable. In practice, this means that vassals will help lieges they like, and will withold troops and money from lieges they actively hate.#!"
 vassal_contribution_devotion: "Contribution Based on Devotion"
    vassal_contribution_devotion_short: "Devotion"
    vassal_contribution_devotion_desc: "#emphasis The amount of taxes and levies the [vassal|E] is expected to send to their [liege|E] is tied to the liege's [piety_level|E].\nIf the vassals are of a different [faith|E], their obligations are reduced according to the [faith_hostility|E] between their faith and their liege's faith.#! If the vassal's faith considers the liege's evil, they will not pay #bold any#! taxes.\n\n#flavor The vassal is expected to send an amount of taxes and levies considered appropriate by how pious their liege is. It's the will of the gods afterall.#!"
 vassal_contribution_fame: "Contribution Based on Fame"
    vassal_contribution_fame_short: "Fame"
    vassal_contribution_fame_desc: "#emphasis The amount of taxes and levies the [vassal|E] is expected to send to their [liege|E] is tied to the liege's [prestige_level|E].#!\n\n#flavor The vassal is expected to send an amount of taxes and levies considered appropriate by how famous their liege is. A well known ruler can surely be entrusted with more power.#!"
 vassal_contribution_arcana: "Contribution Based on Arcana"
    vassal_contribution_arcana_short: "Arcana"
    vassal_contribution_arcana_desc: "#emphasis The amount of taxes and levies the [vassal|E] is expected to send to their [liege|E] is tied to the Liege's [arcana|E].#!\n\n#flavor Only powerful mages are respected by this vassal. Disputes in their land are solved via magic duels, and if the liege wishes to extract taxes and levies they should prove their mastery of the magical arts.#!"
 ## Special clauses
 # Provincial Governor
 special_contract_provincial_governor: "Provincial Governor Contract"
    special_contract_provincial_governor_desc: "#emphasis #bold [vassal|E] Privileges:#!#!\nThe [liege|E] can not revoke titles or vassals that are [de_jure|E] part of the Province\n\n#flavor Provincial Governors are appointed by their Emperor-liege to rule over foreign provinces. While they are only ruling in the name of their suzerain, they are given almost absolute authority over their Province, and are tasked with ensuring its loyalty towards the Empire and its ruler.#!"
    special_contract_provincial_governor_short: "Provincial Governor"
    ek_character_interactions_cannot_revoke_title_provincial_governor_province: "You cannot revoke a title belonging to a #high $special_contract_provincial_governor_short$#! if this title belongs to the Governor's designated province"
 # Cultural Protection
 cultural_rights: "Cultural Rights"
    cultural_rights_none: "Culturally Unprotected"
    cultural_rights_none_short: "Unprotected"
    cultural_rights_protected: "Culturally Protected"
    cultural_rights_protected_desc: "#emphasis #bold [vassal|E] Privileges:#!#!\nThe [liege|E] can not use [promote_culture|E] in the [vassals|E]' lands, except to spread the vassal's [culture|E]. The [liege|E] can not freely [revoke|E] from, [imprison|E] or [execute|E] a [pariah|E] or [daedric_race|E] vassal. [outlander|E] vassals are protected. \n\n#flavor The [vassal|E] is granted a special protected status, with the realm officially recognizing their right to practice their own [culture|E]. Special land grants and status in their own territory allows the vassal's culture to easily be spread in the vassal's lands.#!"
    cultural_rights_protected_short: "Protected"
  minor_tributes_rights: "Minor Tributes"
    minor_tributes_rights_default: "No Minor Tributes"
    minor_tributes_rights_default_shorts: "None"
    minor_tributes_rights_enforced: "Minor Tributes Enforced"
    minor_tributes_rights_enforced_short: "Enforced"
    minor_tributes_rights_enforced_desc: "#flavor The [vassal|E] is expected to regularly send minor trinkets to their Liege, funneling some of their [prestige|E] to their suzerain.#!"
 
