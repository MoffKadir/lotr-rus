l_english:
 ### Summon Thurvokun
 ek_special_buildings_events.0001.t: "Thurvokun Stirs"
 ek_special_buildings_events.0001.desc: "Numerous treasures lie buried within the ruins of Fang Lair, and the moment has arrived to seize the most significant of them all: the remains of Thurvokun himself, the formidable dragon that once dwelled in this location until his life was extinguished by a violent death, like he inflicted upon countless others. However, his bones never came to rest completely. They still thirst for blood and vengeance, and I shall empower them to satisfy this desire.\n\nA dragon remains a formidable entity, even in death, but not formidable enough to withstand my necromantic abilities. With such a minion under my control, I will undoubtedly become unstoppable."
 ek_special_buildings_events.0001.a: "Rise and do my biding!"
 thurvokun_event_troops: "Thurvokun"

 ### Undertake Trials of Alkosh
 ek_special_buildings_events.0021.t: "The Trials of Alkosh"
 ek_special_buildings_events.0021.desc: "Since the Halls of the Highmane are part of my domain, I am granted entry to this sacred place, typically reserved for the Pride of Alkosh and its members. Now, having resolved to test myself against its challenges, it is time to embark on my journey."
 ek_special_buildings_events.0021.a: "Travel to the Halls of the Highmane"
 ek_special_buildings_events.0021.b: "I changed my mind"
 ek_special_buildings_events.0021.b.tt: "You won't face the trials yet and it will take a year until the decision can be taken again"

 ek_special_buildings_events.0022.t: "The Trials of Alkosh - Arrival"
 ek_special_buildings_events.0022.desc: "As I arrive at the end of my journey the air feels thick with the weight of history and honor. These hallowed halls, built by the legendary Forgotten Mane Ja'darri herself, now stand before me, a testament to the bravery and skill required to face whatever challenges lie beyond these doors."
 ek_special_buildings_events.0022.a: "There is no way back now"
 ek_special_buildings_events.0022.a.tt: "This is your one and only chance to face the trials. Try not to fail..."

 ek_special_buildings_events.0023.t: "Path of the Winged Goddess"
 ek_special_buildings_events.0023.desc: "I was prepared for many things, but not for the great chasm that awaited me just beyond the entry. I can see the other side, but surely not even a Forgotten Mane who trained their whole life could leap such a distance! There is no bridge or crossing, only a small shrine to Khenarti, the Winged Goddess of wind and air.\n\nWhat is the meaning of this? Is it a test of faith? Should I just... step forward?"
 ek_special_buildings_events.0023.a: "Just close your eyes and hope for the best"
 ek_special_buildings_events.0023.a.success: "A sudden gust of wind carries you over the chasm"
 ek_special_buildings_events.0023.b: ""All I need is some rope, a hook and something to get it to the other side...""
 ek_special_buildings_events.0023.b.success: "Your unusual approach is indeed successful"
 ek_special_buildings_events.0023.c: ""There is nothing to be afraid off. Just jump!""
 ek_special_buildings_events.0023.c.success: "Your leap miraculously carries you to the other side"
 ek_special_buildings_events.0023.d: ""Khenarti is going to protect me.""
 ek_special_buildings_events.0023.d.success: "The Winged Goddess is not letting you down"
 ek_special_buildings_events.0023.e: ""My faith will carry me to the other side.""
 ek_special_buildings_events.0023.e.success: "Khenarthi is indeed with those who believe in her"
 ek_special_buildings_events.0023.f: ""Good thing I know that levitation spell""
 ek_special_buildings_events.0023.f.success: "Khenarti is looking kindly on your arcane abilities"
 ek_special_buildings_events.0023.g: "This whole thing was a bad idea. Turn around."
 ek_special_buildings_events.alkosh_trials_withdraw: "You will retreat from the trials and never be allowed to enter these halls again."

 ek_special_buildings_events.0024.t: "Path of the Moon Prince"
 ek_special_buildings_events.0024.desc: "A dark hall awaits me next. I can hear the echo of my own heart beating within these walls, as if someone is pounding a doomful drum... Is this just another test of will? But no, something is coming from the shadows: dark beings with glowing blue lines on their fur. These are dro-m'Athra! The souls of Khajiit that have fallen to Namiira. They move as if dancing to the rhythm of my heartbeat, mockingly yet with eerie beauty.\n\nAnd then, I notice the blades in their claws."
 ek_special_buildings_events.0024.a: "Draw your own blade and fight"
 ek_special_buildings_events.0024.a.success: "You beat those corrupted souls"
 ek_special_buildings_events.0024.a.failure: "The dro-m'Athra are putting you to flight"
 ek_special_buildings_events.0024.b: "Use your magic to fend off these horrors"
 ek_special_buildings_events.0024.b.success: "Your arcane capabilties are securing your triumph"
 ek_special_buildings_events.0024.b.failure: "The dro-m'Athra are unaffected by your pitiful magic"
 ek_special_buildings_events.0024.c: "Flee those practitioners of the bent dance"

 ek_special_buildings_events.0025.t: "Path of Mending"
 ek_special_buildings_events.0025.desc: "I move from door to door, walking through long corridors adorned with withered reliefs and seemingly senseless divergences, all the while anticipating the next trial. But there are no more chasms, no more enemies to confront. It takes me a moment to realize that this section itself is the next trial! The structure has transformed into a colossal maze, and I am already lost within its labyrinthine passages."
 ek_special_buildings_events.0025.a: "Try to find a pattern in all of this"
 ek_special_buildings_events.0025.a.success: "You navigate your way through the maze"
 ek_special_buildings_events.0025.a.failure: "Wherever you go, all doors just lead back to the entrance"
 ek_special_buildings_events.0025.b: "There has to be a way around..."
 ek_special_buildings_events.0025.b.success: "You manage to find a shortcut"
 ek_special_buildings_events.0025.b.failure: "You are not cunning enough to beat this maze"
 ek_special_buildings_events.0025.c: "That's all too confusing. Just seek an outlet."

 ek_special_buildings_events.0026.t: "The Trials of Alkosh - Success"
 ek_special_buildings_events.0026.desc: "As I enter the cave that lies beyond the maze, I instantly sense that the trials are at an end. There is no looming threat in this place; it is a sacred ground, open to the sky and adorned with statues and blooming flowers. In the center of it all stands a gigantic hourglass, so strangely beautiful in its otherworldly form that it must surely be a gift from Alkosh, the Cat of Time, himself. As I cautiously reach out to touch it, I feel its blessing warming my [ROOT.Char.Custom('SkinScalesFur')]."
 ek_special_buildings_events.0026.a: ""I have proven my worth!""

 ### Cut Sunspire Funding
 ek_special_buildings_events.0031.t: "The Dereliction of Sunspire"
 ek_special_buildings_events.0031_hs.desc: "May Alkosh be lenient with my decision to withhold further funding for this venerable site dedicated to his worship.\n\nAs the Cat of Time, he surely understands that time brings change, even to the holiest of places. And after all, this transformation will unfold gradually. The remaining monks of Sunspire will steadfastly guard the temple and welcome the pilgrims who still seek its sacred grounds.\nEven as the structure begins to fade, the legacy of Sunspire will endure throughout the ages."
 ek_special_buildings_events.0031_no_hs.desc: "The monks of Sunspire are far from pleased with my decision, but they must accept the new reality: it was my gold that held their temple together and it won't flow any longer.\n\nDespite the change, Sunspire will continue to be a sacred site for their faith, drawing pilgrims to its heights. Though they may now offer their prayers amid walls that are slowly crumbling, even in decay, this temple's grandeur will endure for a very long time."
 ek_special_buildings_events.0031.a: "All things change - that's just how it is"

 ### Restored Senchal Palace
 ek_special_buildings_events.0041.t: "Restored Glory"
 ek_special_buildings_events.0041.desc: "It took an immense amount of time and an incredible sum of gold, but finally, the jewel of southern Elsweyr, the palace of Senchal, has been reborn from ruins. Hundreds of builders, architects, masons, carpenters, and jewelers were involved in this monumental project, and the result of their labor is truly breathtaking. Each room is adorned with more reliefs, pillars, and statues than the previous one, while the gardens are filled with beautiful flowers and exotic animals.\n\nSome may claim that it still falls short of capturing the opulence of the old palace, but even they cannot deny that it is once again a seat fit for a truly great [CHARACTER.GetTitleAsNameNoTooltip]."
 ek_special_buildings_events.0041.a: "I am now famous for my wealth"

 # Turn Dragonguard Sanctum into Pirate Hideout
 ek_special_buildings_events.0051.t: "A Perfect Hideout"
 ek_special_buildings_events.0051.desc: "It was surprisingly easy; everything we needed was already there, thanks to the Dragonguard who once inhabited this place. Now, we have transformed this old fortress into a formidable hideout, perfectly suited to the needs of our ships and with ample storage for countless treasures.\n\nAs I watch my ships crossing in the shadow of the ancient sanctum, their sails billowing, I know they are now prepared for any challenge that lies ahead."
 ek_special_buildings_events.0051.a: "This sea is ours, now."

 # Release Arum Khal
 ek_special_buildings_events.0061.t: "Arum-Khal Awakens" 
 ek_special_buildings_events.0061.desc: "With the destruction of the last seals, placed centuries ago by those who survived the schism of the Order of the Hidden Moon, the crypt has been breached, allowing Arum-Khal to return to this sphere of existence. Shadows twist and dance across the ancient walls as his figure manifests in the empty air, the darkness from behind the world seeping into Mundus around him.\n\nHe knows that I was the one who freed him and I may demand his service in return.\nYet, I can feel the weight of his malevolent gaze rest upon me, as he awaits my reaction to his apperance."
 ek_special_buildings_events.0061.a: "You will join my court."
 ek_special_buildings_events.0061.b: "Reclaim your seat as my vassal, Arum-Khal."
 ek_special_buildings_events.0061.c: "Go back where you came from!"
 ek_special_buildings_events.0061.c.success: "You banish [arum_khal.GetName] back into the Dark Behind the World"
 ek_special_buildings_events.0061.c.failure: "[arum_khal.GetName|E] overpowers you"

 ### Finished Development Committee of South Argonia 
 ek_special_buildings_events.0071.t: "Built the Unbuildable"
 ek_special_buildings_events.0071.desc: "It took over 600 years, absurd amounts of money, and the sanity of more than one person who worked on the project, but in the end, it became more than just a fever dream of a long-dead architect. Lilmoth New City is finished!\n\nWhile it may not be as grand as originally envisioned and its longevity in this climate is uncertain, for now, the region can prosper. The new streets and grand plazas will welcome traders from near and far, and many more people can now settle in the beautiful, geometrically ordered buildings."
 ek_special_buildings_events.0071.a: "Well, was it worth it?"

 ### Awake a Wild Hunt Monster
 ek_special_buildings_events.0091.t: "Ancient Bones"
 ek_special_buildings_events.0091.desc: "Hundreds of thousands of bones lie buried in the Barrowbough. But a tree, no matter how big or old, will not stop my ambition. My minions have unearthed layer after layer, ripping bones from beneath the roots, shaking the enormous trunk. Now, they have found what I tasked them to discover: a giant monster, a relic from an ancient Wild Hunt.\n\nIt will take all my power and knowledge to raise this being from its eternal slumber, but the reward will be well worth the effort."
 ek_special_buildings_events.0091.a: "Out of the earth, I call you!"
 earth_bone_event_troops: "Awoken Wild Hunt Mosnter"


 ## Rebuilt the Bridges of Leyawiin
 ek_special_buildings_events.0111.t: "Divide and Connection"
 ek_special_buildings_events.0111.desc: "It was a daunting project, but it is now complete: the Bridges of Leyawiin stand proudly reconstructed. These imposing structures not only connect both sides of Cyrodiil, opening new pathways for overland trade, but also prevent larger ships from navigating down the Niben River. This means that any merchant wishing to sell goods in these lands has no choice but to offer them in our markets.\n\nWhile some caution that this move may make us a target in the future, for now, Leyawiin is poised for prosperity, and so are its people."
 ek_special_buildings_events.0111.a: "Leyawiin once again controls the Niben!"
 bridges_leyawiin_disables_buildings_imperial_isle_ct: "The [GetBuilding('imperial_city_harbor_01').GetName] and [GetBuilding('port_hestra_01').GetName] will be disabled, and their effect negated"
 bridges_leyawiin_disables_port_buildings_rumare_ct: "The Tradeport building line will be inaccessible to coastal counties along the [GetGeographicalRegion('mundus_tamriel_cyrodiil_rumare_niben').GetName]"

 ek_special_buildings_events.0112.t: "Divide and Connection"
 ek_special_buildings_events.0112.desc: "The Bridges of Leyawiin are once again constructed. [bridge_builder.GetName|E] may call it progress, but for those of us dependent on the Niben, it’s a knife to the throat. For years, our ports thrived as merchants from all corners of Tamriel came to trade, bringing wealth and opportunity. Now, with Leyawiin’s bridges blocking the river to all larger vessels, they’ve forced every ship, every coin, into their hands.\n\nThey may bask in their newfound fortune, but at what cost? Leyawiin’s greed has stifled our lifeline, and they would do well to remember that such power grabs seldom go unchallenged."
 ek_special_buildings_events.0112.a: "This calls for action!"
 bridges_leyawiin_gains_cb_ct: "You gain access to a special [casus_belli|E] to destroy the [GetBuilding('bridges_leyawiin_02').GetName]"

