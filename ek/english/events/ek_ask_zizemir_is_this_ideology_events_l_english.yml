l_english:
 ek_ask_zizemir_is_this_ideology_events.0001.title: "Zizemir sniffs"
 ek_ask_zizemir_is_this_ideology_events.0001.it_is_ideology: "It is… ideology."
 ek_ask_zizemir_is_this_ideology_events.0001.your_faith_is_ideology: "\"Your [faith|E], [actor.GetFaith.GetName],\" — and Zizemir sniffs again — \"it is ideology."
 ek_ask_zizemir_is_this_ideology_events.0001.your_culture_is_ideology: "\"Your [culture|E], [actor.GetCulture.GetName] is…\" (and Zizemir mumbles incomprehensibly) \"ideology.\""
 ek_ask_zizemir_is_this_ideology_events.0001.your_heritage_is_ideology: "\"This [heritage|E] of yours, [actor.GetCulture.GetHeritage.GetName],\" says Zizemir as he sniffs and mumbles, \"it is ideology.\""
 ek_ask_zizemir_is_this_ideology_events.0001.your_dynasty_is_ideology: "Zizemir mumbles so much it's impossible to hear him speak. All that can be made out is \"[dynasty|E]\", \"[actor.GetDynasty.GetName]\", and \"ideology\"."
 ek_ask_zizemir_is_this_ideology_events.0001.your_house_is_ideology: "Zizemir sniffs something about a \"[house|E]\", \"[actor.GetHouse.GetName]\", and \"ideology\"."
 ek_ask_zizemir_is_this_ideology_events.0001.your_primary_title_is_ideology: "Zizemir talks so slowly that it's obvious by the first word, \"[title|E]\", that he is about to call [actor.GetPrimaryTitle.GetDefinitiveName] \"ideology\"."
 ek_ask_zizemir_is_this_ideology_events.0001.my_culture_is_ideology: "It is… shameful to admit… my [culture|E] [recipient.GetCulture.GetName] it is ideology."
 ek_ask_zizemir_is_this_ideology_events.0001.my_faith_is_ideology: "I wish I could cast it into the dustbin of manifest metaphors… my [faith|E], [recipient.GetFaith.GetName], it is ideology."
 ek_ask_zizemir_is_this_ideology_events.0001.my_heritage_is_ideology: "It is… ideology, my [heritage|E], [recipient.GetCulture.GetHeritage.GetName]."
 ek_ask_zizemir_is_this_ideology_events.0001.my_dynasty_is_ideology: "Ideology… that is what my [dynasty|E], [recipient.GetDynasty.GetName] is."
 ek_ask_zizemir_is_this_ideology_events.0001.my_house_is_ideology: "Ideology… that is what my [house|E], [recipient.GetHouse.GetName], is."