l_english:
### Towers
 building_type_white_gold_tower_01: "White-Gold Tower"
 building_type_white_gold_tower_01_desc: "Standing in the center of the Imperial City, White-Gold was built ages ago by the Ayleids, in reverence of the Adamantine Tower. Some say the very powers of the world course through here, and the shape of the Tower allows it to radiate throughout the entire province of Cyrodiil..."
 building_white_gold_tower_01: "$building_type_white_gold_tower_01$"
 building_white_gold_tower_01_desc: "$building_type_white_gold_tower_01_desc$"
 
 building_type_adamantine_tower_01: "Adamantine Tower"
 building_type_adamantine_tower_01_desc: "Built by the Gods themselves, this place of power was where the Convention took place, and Time first started to exist. A divine presence can still be felt around the Tower, and its impact on the world should not be understated..."
 building_adamantine_tower_01: "$building_type_adamantine_tower_01$"
 building_adamantine_tower_01_desc: "$building_type_adamantine_tower_01_desc$"
 
 building_type_crystal_tower_01: "Crystal Tower"
 building_type_crystal_tower_01_desc: "The first Tower to be built after the Convention, the Crystal Tower was made in the image of Ada-Mantia, which gave it its other name 'Crystal-like-Law'. An important symbol for the Altmer, some say it could potentially hold the key to other dimensions..."
 building_crystal_tower_01: "$building_type_crystal_tower_01$"
 building_crystal_tower_01_desc: "$building_type_crystal_tower_01_desc$"

##Cyrodiil Special Buildings
#Imperial City
 # Imperial Walls
 building_type_imperial_city_01: "The Imperial City"
 building_type_imperial_city_01_desc: "There is but one city in the Imperial Province, but one city in Tamriel, but one city in the World; that, my brothers, is the city of the Cyrodiils."
 building_imperial_city_01: "The Imperial City"
 building_imperial_city_01_desc: "$building_type_imperial_city_01_desc$"
 
 # Temple of the One
 building_type_temple_of_the_one_01: "Temple of the One"
 building_type_temple_of_the_one_01_desc: "The largest religious temple in Cyrodiil, the Temple of the One was dedicated to the deity worshipped by the Alessian Order. Even after the fall of the Alessian line, the Temple was used as a place of worship by the Reman dynasty.\n\nThe Dragonfires can be seen in the center of the Temple, and the ritual to light them when a new Emperor is crowned can be shortened in times of crisis by lighting the fires in the Temple, instead of in the Dragonfire Cathedral."
 building_temple_of_the_one_01: "$building_type_temple_of_the_one_01$"
 building_temple_of_the_one_01_desc: "$building_type_temple_of_the_one_01_desc$"
 holy_site_or_the_one: "Holder [faith|E] must consider it a [holy_site|E] or have The One as its [pantheon|E]"
 
 # Imperial Arena
 building_type_imperial_city_arena_01: "Imperial City Arena"
 building_type_imperial_city_arena_01_desc: "Also named the 'Bloody Jewel of the Imperial City', the Imperial Arena was built by Gaiden Shinji at the end of the first millennium of the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )]. In here, the people of the Imperial Isle can enjoy watching warriors from all of Tamriel clash to the death for the greatest pleasure of the local population, as well as some well-enjoyed money for the lucky and daring gamblers."
 building_imperial_city_arena_01: "$building_type_imperial_city_arena_01$"
 building_imperial_city_arena_01_desc: "$building_type_imperial_city_arena_01_desc$"
 
 # The Bastion
 building_type_the_bastion_01: "The Bastion"
 building_type_the_bastion_01_desc: "While not nearly as big as White-Gold, the tower sitting in the middle of the Imperial City Prison District is a reminder of the harsh judiciary system that led Cyrodiil for centuries. Housing the City's jails, it is often the first stop for some of the most dangerous criminals of the province before they are shipped to a more remote location. Most who are sent here are never to be seen again..."
 building_the_bastion_01: "$building_type_the_bastion_01$"
 building_the_bastion_01_desc: "$building_type_the_bastion_01_desc$"
 building_the_bastion_02: "$building_type_the_bastion_01$ (Expanded)"
 building_the_bastion_02_desc: "$building_type_the_bastion_01_desc$\n\nThe recently refurbished Imperial Legion headquarters have been stationed next to the Bastion, and hundreds of volunteers can be seen joining the Imperial Legion everyday. They serve as a pacifying force during times of peace, dealing with infestations and bandits, and they reinforce the armies of the Imperial Isle in times of war."
 the_bastion_decision_req: "Can only be upgraded through #V $rebuild_imperial_legion_decision$#! [decision|E]"
 
 # Imperial Harbor
 building_type_imperial_city_harbor_01: "Imperial City Harbor"
 building_type_imperial_city_harbor_01_desc: "The biggest merchant port in Tamriel, the Imperial City Harbor is home to countless merchants and sailors, transporting goods from the far-way isles of Cathnoquey, the isolated archipelago of Summerset, and the forgotten ports of Yokuda. The constant influx of goods, wealth, and travelers makes it one of the bustling spots of the Imperial Isle." #AI
 building_imperial_city_harbor_01: "$building_type_imperial_city_harbor_01$"
 building_imperial_city_harbor_01_desc: "$building_type_imperial_city_harbor_01_desc$"
 
 # Port Hestra
 building_type_port_hestra_01: "Port Hestra"
 building_type_port_hestra_01_desc: "Built by the Empress Hestra before her campaigns against piracy in Black Marsh, Port Hestra houses most of the Imperial Navy in peacetime. Able to project power over most of Tamriel, it is an integral part of the efforts of the various Imperial administrations to enforce their peace."
 building_port_hestra_01: "$building_type_port_hestra_01$"
 building_port_hestra_01_desc: "$building_type_port_hestra_01_desc$"
 
 # Arcane University
 building_type_arcane_university_01: "Arcane University"
 building_type_arcane_university_01_desc: "Founded in the [Glossary( 'Second Era', 'SECOND_ERA_GLOSS' )], the Arcane University is the center of magical learning in Tamriel, even surpassing Crystal-like-Law in Summerset. Its vast libraries, countless artifacts, and unique amenities such as the Chironasium for enchanting, the Praxographical Center for spell making, the Lustratorium for Alchemy, and the Imperial Orrery to chart Nirn and the heavens, make it a powerful place to hold in one's realm, even if they're not versed in the arts of magicka."
 building_arcane_university_01: "$building_type_arcane_university_01$"
 building_arcane_university_01_desc: "$building_type_arcane_university_01_desc$"

#Colovia
 building_type_garlas_agea_01: "Garlas Agea"
 building_type_garlas_agea_01_desc: "In the early [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], Garlas Agea was home to the most prominent Sorcerer-King on the Gold Coast. It served as a sort of Arcane High Palace, until Garlas Malatar began to eclipse the influence of Garlas Agea. This early demise might be what saved the structure from being destroyed following the Alessian Slave Rebellion in the early 1E 240s."
 building_garlas_agea_01: "$building_type_garlas_agea_01$"
 building_garlas_agea_01_desc: "$building_type_garlas_agea_01_desc$\n\nHowever to this day its exact arcane functions remain a mystery, making it a prime destination of regional scholars and noble tourists alike."
 building_garlas_agea_02: "$building_type_garlas_agea_01$ (Restored)"
 building_garlas_agea_02_desc: "$building_type_garlas_agea_01_desc$\n\nThe ancient contraptions have now been restored; the glow of Welkynd stones illuminates every hall, and starlight itself is captured within a vast Ayleid well. Whoever sits upon the throne of Garlas Agea will be bathed in its magical power."

 # Cloud Ruler Temple
 building_type_cloudruler_temple_01: "Cloud Ruler Temple"
 building_type_cloudruler_temple_01_desc: "Cloud Ruler Temple lords over the Jerall Mountains like a stone dragon perched upon its roost. In this resolute Tsaesci complex, more fortress than temple, the Dragonguard prepare themselves for the hunt, train new blood, preserve ancient Akaviri texts, and pursue all other duties to the Emperor that were once entrusted to them."
 building_cloudruler_temple_01: "$building_type_cloudruler_temple_01$"
 building_cloudruler_temple_01_desc: "$building_type_cloudruler_temple_01_desc$"

 # Great Chapel of Kynareth
 building_type_great_chapel_kynareth_01: "Great Chapel of Kynareth"
 building_type_great_chapel_kynareth_01_desc: "Kynareth's patronage of sailors and nature made Sutch a natural home for her cult. Constructed from cliffside stones, the numerous gargoyles and murals of the Great Chapel of Kynareth are an ode to the Goddess of Winds. Some report that on blessed days the building seems to come to life and soothe passerbies by its mere presence.\n\nNo matter how perilous or long a journey ought to be, it is anchored in Stridentine superstition that one ought to make a trip to the Chapel and pray to Kynareth for good fortune. Few are the ones that dare to forgo this tradition and numerous are the folk tales of those who didn't that met an ominous end at sea as a consequence."
 building_great_chapel_kynareth_01: "$building_type_great_chapel_kynareth_01$"
 building_great_chapel_kynareth_01_desc: "$building_type_great_chapel_kynareth_01_desc$"
 kynareth_or_cyrodiilic_cult: "Holder [faith|E] must either have Kynareth in its [pantheon|E], have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."
 
 # Great Chapel of Dibella
 building_type_great_chapel_dibella_01: "Temple of Dibella Estetica"
 building_type_great_chapel_dibella_01_desc: "Here the faithful worship the goddess of beauty in her aspect of Dibella Estetica - creating works of art, tending the sacred baths, and serving the populace with alms and entertainment. Prudish worshippers of other faiths might balk at the sight of the temple prostitutes roaming the Hall of the Arts, but the Temple of Dibella Estetica does not heed to the scurrilous rumours that comes its way."
 building_great_chapel_dibella_01: "$building_type_great_chapel_dibella_01$"
 building_great_chapel_dibella_01_desc: "$building_type_great_chapel_dibella_01_desc$"
 dibella_or_cyrodiilic_cult: "Holder [faith|E] must either have Dibella in its [pantheon|E], have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."

 # Monastery of the Hourglass
 building_type_great_chapel_akatosh_01: "Monastery of the Hourglass"
 building_type_great_chapel_akatosh_01_desc: "The Monastery of the Hourglass houses two monastic orders who worship a rather curious aspect of Akatosh, the deity of time. The orders of the Black Dove and of the Ivory Crow are devoted to an ascetic fatalistic view of the world, worshipping Black-Winged Al-Ad and White-Crowned Ak-Tosh as twin aspects of the deity of time, the beauty of endings and the ending of all things beautiful."
 building_great_chapel_akatosh_01: "$building_type_great_chapel_akatosh_01$ (Destroyed)"
 building_great_chapel_akatosh_01_desc: "The Monastery of the Hourglass once was the pride of Kvatch, but was completely destroyed during the infamous Kvatch Bread riots."
 building_great_chapel_akatosh_02: "$building_type_great_chapel_akatosh_01$"
 building_great_chapel_akatosh_02_desc: "$building_type_great_chapel_akatosh_01_desc$"
 holy_site_or_akatosh: "Holder [faith|E] must either consider it a [holy_site|E], have Akatosh in its [pantheon|E], have The One as its [pantheon|E], have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."

 # Sancre Tor
 building_type_sancre_tor_01: "Sancre Tor"
 building_type_sancre_tor_01_desc: "A city built on the face of the mountain, Sancre Tor has been the holy site for Cyrodiils since Emperor Reman's ascension. It is here that he was born from the union of Alessia and Hrol, and it is here where he and his descendants were buried."
 building_sancre_tor_01: "$building_type_sancre_tor_01$ (Defiled)"
 building_sancre_tor_01_desc: "$building_type_sancre_tor_01_desc$\n\nHowever, the Interregnum weakened the protectors of the holy city, and it was taken over by the necromancers. The ancient tombs beneath it now harbor nameless horrors, and the dark magic haunting this once-sacred place stands as a stark reminder of the Empire’s current weakness."
 building_sancre_tor_02: "$building_type_sancre_tor_01$"
 building_sancre_tor_02_desc: "$building_type_sancre_tor_01_desc$\n\nWhile the 'Golden Hill' is far from its former glory under the Reman emperors, it remains one of the most important and sacred cities in Colovia, attracting pilgrims from all over Cyrodiil."
 building_sancre_tor_03: "$building_type_sancre_tor_01$"
 building_sancre_tor_03_desc: "$building_type_sancre_tor_01_desc$\n\nWith the mantle of The Cyrodiil reclaimed, the Sancre Tor was restored to its past glory. Faithful from all around the Empire travel to the city to pay their respects to emperors, both old and new."
 cyrodiil_restored_requirement: "You or your [liege|E] hold one of the following titles: [GetTitleByKey('e_cyrodiil').GetNameNoTier], [GetTitleByKey('e_potentate').GetNameNoTier] or [GetTitleByKey('h_tamriel').GetNameNoTier]"
 holy_site_or_reman: "Holder [faith|E] must consider it a [holy_site|E] or have Reman in its [pantheon|E]"

#Nibenay
 # Pantherfang Chapel
 building_type_pantherfang_chapel_01: "Pantherfang Chapel"
 building_type_pantherfang_chapel_01_desc: "Erected during the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )] by the Quenching Grail religious order, this sacred sanctuary served for centuries as both a chapel and a formidable fortress, safeguarding the clergy and believers amidst turbulent times."
 building_pantherfang_chapel_01: "Pantherfang Chapel"
 building_pantherfang_chapel_01_desc: "Erected during the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )] by the Quenching Grail religious order, this sacred sanctuary served for centuries as both a chapel and a formidable fortress, safeguarding the clergy and believers amidst turbulent times."

 # Great Chapel of Zenithar
 building_type_great_chapel_zenithar_01: "Great Chapel of Zenithar"
 building_type_great_chapel_zenithar_01_desc: "Saint Kaladas the Architect constructed the Great Chapel of Zenithar, after constantly having dreams about Pelinal, in tribute to the legend of a messenger who is said to have carried the Mace of the Crusader to Leyawiin following the death of Pelinal Whitestrake at the hands of the Ayleids. However, when Saint Kaladas was laid to rest in the chapel undercroft, those who prayed to Zenithar at his tomb began to receive visions of the Mace."
 building_great_chapel_zenithar_01: "Temple of Two Moons"
 building_great_chapel_zenithar_01_desc: "Previously a Cyrodiilic chapel dedicated to Zenithar, its new owners converted it to the worship of the Two Moons, Jone and Jode.\n\nSome scholars claim that this conversion already happened once—during the conquests of Darloc Brae."
 building_great_chapel_zenithar_02: "$building_type_great_chapel_zenithar_01$"
 building_great_chapel_zenithar_02_desc: "$building_type_great_chapel_zenithar_01_desc$"

 # Great Chapel of Shezarr
 building_type_temple_shor_01: "Temple of Shor"
 building_type_temple_shor_01_desc: "Nords rarely build temples to their gods, especially to dead ones, but Cyrodiils do. This great temple of Shor was built by Colovian nobility of Bruma, who worship the missing god in the Nordic manner. Most local Nords, however, still don't see any point in a temple to a dead god."
 building_temple_shor_01: "$building_type_temple_shor_01$"
 building_temple_shor_01_desc: "$building_type_temple_shor_01_desc$"
 shezarr_or_cyrodiilic_cult: "Holder [faith|E] must consider have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]"

 # The Eschatorium of Saint Venaros the Repentant
 building_type_esharotium_venaros_01: "Eschatorium of Saint Venaros"
 building_type_esharotium_venaros_01_desc: "Saint Venaros the Repentant is perhaps the most famous of the Living Saints of Arkay, his holy deeds during the dark ages before the Second Empire being remembered to this day. The sepulchre where his remains were interred grew into the largest temple to Arkay in Cyrodiil, usually known as the Bone Chapel or more formally as the Eschatorium. The Eschatorium's most impressive feature would be its very foundations and walls, built up from the many bones of those who passed away in service to the god of the dead. Legends hold that the bones of Saint Venaros himself are the foundation of the temple, for even in death his holy presence repels any sort of attempts to raise the dead in the vicinity of the Eschatorium."
 building_esharotium_venaros_01: "$building_type_esharotium_venaros_01$"
 building_esharotium_venaros_01_desc: "$building_type_esharotium_venaros_01_desc$"
 holy_site_or_arkay: "Holder [faith|E] must consider it a [holy_site|E], have Arkay in its [pantheon|E], have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."

 # The Grand Chapel of Saint Balyna the Compassionate
 building_type_chapel_balyna_01: "Grand Chapel of Saint Balyna"
 building_type_chapel_balyna_01_desc: "Almost every child born in Cyrodiil knows the tales of Saint Balyna the Compassionate, from her miracle of healing the Thousand-Strong of Sedor to her martyrdom at the hands of Prince Coethil Eight-Fingers. The chapel itself is not a grand sight, yet what it lacks in outer beauty it makes up in the ludicrous amount of reliquaries and artefacts the temple houses, including the body of the Living Saint herself. Pilgrims flock to the chapel to pray, to ask for healing, and to hold marriages upon the altar of Mara Sospitator."
 building_chapel_balyna_01: "$building_type_chapel_balyna_01$"
 building_chapel_balyna_01_desc: "$building_type_chapel_balyna_01_desc$"
 mara_or_cyrodiilic_cult: "Holder [faith|E] must either have Mara in its [pantheon|E], have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."

 building_type_xaria_tears_01: "Xaria's Tears"
 building_type_xaria_tears_01_desc: "Xaria's Tears is a tor, surrounded by shrines of all sorts. The cult of the Flaming Empress worships a deified form of the Empress Hestra and claims that Xaria is her reincarnation. They come in conflict with the cult of the Blessed Virgin, which says that the tor is the spot where Saint Dulsa the Martyr lost her life and that Xaria is the name of her unborn child. Both cults clash with the cult of the Carapace, who think that Xaria is the firstborn and accursed child of the lost Insect God and that sacrifices must be made to appease her."
 building_xaria_tears_01: "$building_type_xaria_tears_01$"
 building_xaria_tears_01_desc: "$building_type_xaria_tears_01_desc$"
 cyrodilic_cult_or_imperial_requirement: "Holder [faith|E] must have have [GetFaithDoctrine('special_doctrine_cyrodiilic_cult').GetBaseName] [doctrine|E] or be part of [GetReligionByKey('imperial_religion').GetName] [religion|E]."

 # Artemnon River Channels
 building_type_artemon_river_channels_01: "Artemon River Channels"
 building_type_artemon_river_channels_01_desc: "Thanks to an extensive network of channels and a cleverly engineered irrigation system, the salt rice fields of Artemon encompass a substantial portion of the land within the bend of the Panther River. Small boats navigate the canals, facilitating transportation for the locals between various points. Meanwhile, the harvested crops are transported via the larger river, serving to nourish thousands of people in Cyrodiil itself and also beyond its borders."
 building_artemon_river_channels_01: "$building_type_artemon_river_channels_01$"
 building_artemon_river_channels_01_desc: "$building_type_artemon_river_channels_01_desc$"

 # Hot Springs of Caer Suvio
 building_type_hot_springs_caer_suvio_01: "Hot Springs of Caer Suvio"
 building_type_hot_springs_caer_suvio_01_desc: "The hot springs of Caer Suvio are a popular attraction in Cyrodiil, where nobles and common folk alike travel sometimes for days just to spend a little bit of time surrounded by the hot water and beautiful flora."
 building_hot_springs_caer_suvio_01: "$building_type_hot_springs_caer_suvio_01$"
 building_hot_springs_caer_suvio_01_desc: "$building_type_hot_springs_caer_suvio_01_desc$"
 building_hot_springs_caer_suvio_02: "$building_type_hot_springs_caer_suvio_01$"
 building_hot_springs_caer_suvio_02_desc: "Caer Suvio hosts an abundance of natural hot springs, whose fragrant and clouded waters are said to be rich in wholesome elements and whose location among natural rock cliffs and light jungle canopies have made it a favoured resort destination for the noble and the wealthy in the Cyrodiilic East and beyond."
 
 # Hot Springs of Mir Corrup
 building_type_hot_springs_mir_corrup_01: "Hot Springs of Mir Corrup"
 building_type_hot_springs_mir_corrup_01_desc: "The hot springs of Mir Corrup are a popular attraction in Cyrodiil, where nobles and common folk alike travel sometimes for days just to spend a little bit of time surrounded by the hot water and beautiful flora."
 building_hot_springs_mir_corrup_01: "$building_type_hot_springs_mir_corrup_01$"
 building_hot_springs_mir_corrup_01_desc: "$building_type_hot_springs_mir_corrup_01_desc$"
 building_hot_springs_mir_corrup_02: "$building_type_hot_springs_mir_corrup_01$"
 building_hot_springs_mir_corrup_02_desc: "Mir Corrup hosts an abundance of natural hot springs, whose fragrant and clouded waters are said to be rich in wholesome elements and whose location among natural rock cliffs and light jungle canopies have made it a favoured resort destination for the noble and the wealthy in the Cyrodiilic East and beyond."

 # Bridges of Leyawiin
 building_type_bridges_leyawiin_01: "Bridges of Leyawiin"
 building_type_bridges_leyawiin_01_desc: "The patch of land connecting the two sides of Cyrodiil southern lands has become a strategic and economic hotpoint, as whoever controls it is able to disconnect the sea trade from the Imperial Isle to Topal Bay."
 building_bridges_leyawiin_01: "$building_type_bridges_leyawiin_01$ (Destroyed)"
 building_bridges_leyawiin_01_desc: "$building_type_bridges_leyawiin_01_desc$\n\nTherefore, the bridges once built here have been dismantled, leaving only a few pillars as a broken testament to their former dominance over the Niben and beyond. The trade flowing into the city is now just a fraction of what it once was, and Castle Leyawiin is now accessible only by ferries, which at least grants it a strategic advantage."
 building_bridges_leyawiin_02: "$building_type_bridges_leyawiin_01$"
 building_bridges_leyawiin_02_desc: "$building_type_bridges_leyawiin_01_desc$\n\nEnormous stone bridges have been constructed to ensure that no ship above a certain size can sail further up the Niben, leaving Leyawiin as the focal point of trade in the region.\n\n#N As long as this building stands, the [GetBuilding('imperial_city_harbor_01').GetName] and [GetBuilding('port_hestra_01').GetName] are deactivated.#!"
 bridges_leyawiin_02_must_be_disabled: "The [GetBuilding('bridges_leyawiin_02').GetName] are constructed, diverting trade away from Imperial City.\n\nThey can be dismantled by the #V '$destroy_bridges_leyawiin_decision$'#! [decision|E] or the #V '$DESTROY_BRIDGES_OF_LEYAWIIN_CB_NAME$'#! [casus_belli|E]"

 # St. Bravillius District
 building_type_st_bravillius_01: "St. Bravillius District"
 building_type_st_bravillius_01_desc: "The ward of St. Bravillius is where the Jewel of Nibenay's high walls stack the highest, sheltering the enormous manors of shipping magnates whose ancestors realized the drakes to be made on the River Larsius. At the dawn of the [Glossary( 'Second Era', 'SECOND_ERA_GLOSS' )], fearing the bureaucracy that would follow in the wake of a stable empire, St. Bravillius's once-bickering wealthy families locked shields - and though the dockyards grew vacant and Bravil's common folk languished, palms were greased, arms and people were sold, and the old manor-district carried on.\n\nAll over the city, people muse that St. Bravillius's corruption will destroy the city in the coming centuries, in a tone which seems almost wishful."
 building_st_bravillius_01: "$building_type_st_bravillius_01$"
 building_st_bravillius_01_desc: "$building_type_st_bravillius_01_desc$"

 # Abbey Bazaar of Zenithar
 building_type_abbey_bazaar_of_zenithar_01: "Abbey Bazaar of Zenithar"
 building_type_abbey_bazaar_of_zenithar_01_desc: "The famous Abbey Bazaar is a vibrant marketplace, drawing merchants and artisans not only from Cyrodiil but also from neighboring regions such as Black Marsh, Elsweyr, and even Morrowind. Placed within the revered Abbey of Zenithar itself, the bazaar is lined with stalls showcasing finely crafted tools, jewelry, textiles, and rare enchanted artifacts - all blessed by the abbey's priests to bring prosperity. The exchange of unique wares and customs from diverse cultures creates a lively, bustling atmosphere, where each trade embodies Zenithar’s virtues of honest labor and fair commerce."
 building_abbey_bazaar_of_zenithar_01: "$building_type_abbey_bazaar_of_zenithar_01$"
 building_abbey_bazaar_of_zenithar_01_desc: "$building_type_abbey_bazaar_of_zenithar_01_desc$"

 #Immaterial institute
 building_type_immaterial_institute_01: "Immaterial Harmonics Institute of Extrinsic Travels"
 building_type_immaterial_institute_01_desc: "Despite the name, this institute is quite tangible. While the glorious days of Reman II and the first mananauts are gone, this place of learning is still a prestigious destinitation for many student battlemages."
 building_immaterial_institute_01: "$building_type_immaterial_institute_01$"
 building_immaterial_institute_01_desc: "$building_type_immaterial_institute_01_desc$"
 building_immaterial_institute_02: "$building_type_immaterial_institute_01$"
 building_immaterial_institute_02_desc: "With the Imperial moon exploration program restored, the institute is back to its original purpose of researching lunar travel and educating new Imperial mananauts."

##Elsweyr Special Buildings
 # Palace of the Mane
 building_type_mane_palace_01: "Palace of the Mane"
 building_type_mane_palace_01_desc: "More a temple than palace, though lacking no luxuries and ostentations by any means, the Palace of the Mane rises towards the moonlit night amidst sugarcane gardens and undisturbed cool ponds. Here can be found ancient tapestries, silent testimonies to the bygone [Glossary( 'Sixteen Kingdoms', 'SIXTEEN_K_GLOSS' )], and esoteric frescoes depicting the lunar mysteries of Lles'wer. In these halls are also the Bi-Lunar Guard, who stalk out all interlopers who would trespass without the Mane's invitation."
 building_mane_palace_01: "$building_type_mane_palace_01$"
 building_mane_palace_01_desc: "$building_type_mane_palace_01_desc$"

 # Moon Gate of Anequina
 building_type_anequina_moon_gate_01: "Moon Gate of Anequina"
 building_type_anequina_moon_gate_01_desc: "Though the knowledge on how to operate this ancient Moon Gate has been forgotten for millenia, it is still considered one of the most important sites of lunar worship and research, drawing in pilgrims and scholars alike."
 building_anequina_moon_gate_01: "$building_type_anequina_moon_gate_01$"
 building_anequina_moon_gate_01_desc: "$building_type_anequina_moon_gate_01_desc$"

 # Rimmen Palace
 building_type_rimmen_palace_01: "Brae Palace"
 building_type_rimmen_palace_01_desc: "The grand palace in the center of Rawla-Kei was built by the members of the Brae clan that survived the sack of Ne Quin-al. With its monumental spires, finely chiseled statues, and grandiose chambers, this palace holds glimmers of old Anequina's splendour."
 building_rimmen_palace_01: "$building_type_rimmen_palace_01$"
 building_rimmen_palace_01_desc: "$building_type_rimmen_palace_01_desc$"

 # Two Moons Path
 building_type_two_moon_path_01: "Two Moons Path"
 building_type_two_moon_path_01_desc: "This most venerated temple of the Khajiit is so unimaginably old, the Moon-Bishops say, that its continued existence must be the result of divine protection, and proof of the Mane's mandate to rule. Children of the Eclipse, littered but once a generation, are ushered here to be anointed as Mane, in a ritual as crucial to Elsweyr's civic religion as to the grand bureaucracy that unites the kingdom. No outsiders are known to have witnessed an ascension, but northern rumors tell of skooma-drunk seances, cathedrals in the stars, and moonlit specters wandering the courtyard at night, mane-braids shedding on the flagstones.\n\nMonks of the Path lead comfortable lives here as spiritual advisors, immersing themselves daily in moon-sugar trances to divine new Moonlight in Riddle'Thar, and the temple's hallways teem with relics of Manes past, left to collect dust and silt -- but not unwelcomely, for cats are often keen on sand."
 building_two_moon_path_01: "$building_type_two_moon_path_01$"
 building_two_moon_path_01_desc: "$building_type_two_moon_path_01_desc$"

 # Predator Mesa
 hircine_in_pantheon: "Holder [faith|E] must consider it a [holy_site|E] or have Hircine in its [pantheon|E]"
 building_type_predator_mesa_01: "Predator Mesa"
 building_type_predator_mesa_01_desc: "Existing since time immemorial, Predator Mesa is a site for Khajiiti hunters to test their skills against the region's wildlife. Those lucky enough to survive are said to be favored by the Hungry Cat himself."
 building_predator_mesa_01: "$building_type_predator_mesa_01$"
 building_predator_mesa_01_desc: "$building_type_predator_mesa_01_desc$"

 # Sunspire Temple
 building_type_sunspire_temple_01: "Sunspire Temple"
 building_type_sunspire_temple_01_desc: "Back in the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], the Khajiit were nearly annihilated by Pelinal, lost in the throes of violent madness. Alkosh's intervention saved the survivors on the Sunspire, and since then the mountain has been holy to the catfolk. The spire that gives its name to the place is among the highest houses of worship in Elsweyr, and Sunspire Temple is of special importance to every Khajiit in Anequina."
 building_sunspire_temple_01: "$building_type_sunspire_temple_01$ (Neglected)"
 building_sunspire_temple_01_desc: "$building_type_sunspire_temple_01_desc$\n\nThe many stoneworks and towers of ancient Khajiit craftsmanship that occupy the grounds are now slowly withering away. The few remaining monks strive to prevent their temple from falling into disrepair, but their numbers are also dwindling. This proud monument to Alkosh may become nothing more than a ruin in the coming centuries if things continue this way."
 building_sunspire_temple_02: "$building_type_sunspire_temple_01$"
 building_sunspire_temple_02_desc: "$building_type_sunspire_temple_01_desc$\n\nBut while the massive complex has profited for generations from offerings and patrons to glorify Alkosh, it is now on the step of decline. Since the Riddle'Thar took Alkosh's place as the highest of Khajiiti deities, the flow of pilgrims has ebbed down, and additional funding is needed to keep this temple in pristine condition."

 # Hidden Moon Crypts
 building_type_hidden_moon_crypts_01: "Hidden Moon Crypts"
 building_type_hidden_moon_crypts_01_desc: "Unfortunate burial place of Azurite templars, the Order of the Hidden Moon once stood where the Crypts are. Due to the treason of Arum-Khal their ranks were decimated and their teachings lost within the main Khajiit religious discourse.\n\nDespite their fall, the Hidden Moon Crypts remain in relatively good condition and stand vigil over the land, and hopefully, the souls of the departed."
 building_hidden_moon_crypts_01: "$building_type_hidden_moon_crypts_01$ (Defiled)"
 building_hidden_moon_crypts_01_desc: "$building_type_hidden_moon_crypts_01_desc$\n\nThe vigil of the Order of the Hidden Moon over the land and the souls of the departed has ended. The remaining ghosts of adepts, subjugated by the not-benevolent necromancy, now serve a far darker purpose; soon the only remaining legacy of the order will be revealing all of its secrets to those who did not use necromancy for good.""
 building_hidden_moon_crypts_02: "$building_type_hidden_moon_crypts_01$"
 building_hidden_moon_crypts_02_desc: "$building_type_hidden_moon_crypts_01_desc$"

 # Archive Vaults of Corinthe
 building_type_corinthe_archive_01: "Archives Vaults of Corinthe"
 building_type_corinthe_archive_01_desc: "Impressive repositories of books, scrolls, parchments, letters and other records can be found all over Corinthe; Following the destruction of the original Grand Archive back in 1E 463, the local notables scrambled to restore the institution with surviving works alongside some additions.\n\nBut the demise of the Grand Archive made recreating a single, vulnerable building a going concern. Fortunately, one merchant suggested adopting the system of the Anequinan monarchy—decentralized vaults with redundant stocks—at a smaller scale.\n\nAnd so began the Corinthian tradition of hoarding all manners of artifacts and literature. When affluent families marry their youths, books are exchanged and upon succeeding as clan chief, one must swear to protect and enrich the family collection."
 building_corinthe_archive_01: "$building_type_corinthe_archive_01$"
 building_corinthe_archive_01_desc: "$building_type_corinthe_archive_01_desc$"

 # Pridehome Temple
 building_type_pridehome_temple_01: "Pridehome Temple"
 building_type_pridehome_temple_01_desc: "Home to Alkosh's most fervent admirers, the temple at the heart of the Tenmar Jungle is where the Forgotten Manes go to find meaning, as members of the Pride of Alkosh. Founded by the Forgotten Mane Ja'darri during Reman I's reign, the ones born under the Eclipse will study liturgy, philosophy, martial arts and verses.\n\nMostly known as peacekeeers throughout the province, the Forgotten Manes still hold an invaluable role as a center of monastic life in eastern Pellitine, as it is so far from Torval's grasp."
 building_pridehome_temple_01: "$building_type_pridehome_temple_01$"
 building_pridehome_temple_01_desc: "$building_type_pridehome_temple_01_desc$"

 # Hall of Colossus
 building_type_hall_of_colossus_01: "Hall of Colossus"
 building_type_hall_of_colossus_01_desc: "The Halls of Colossus are a gargantuan complex of ruins overlooking its surrounds from an almost incomprehensible height. Some have speculated that its great scale indicates that its builders were a titanic race, but nobody has ever found any evidence that the Halls were constructed. Histories, oral and written, make no mention of anybody living in the area save for the Khajiit themselves, who are confident that this is not their work. However, a nearby tribe told a simple story.\n\nIn it, the nomadic tribe moves across Elsweyr for generations until, one day, strange humans bearing banners of the "diamond serpent", carting much brass, in a flurry of daemons wreathed in fire and frost, appear in the grasslands. Ever since, says the story, the tribe avoided what is now the Halls of Colossus. A later addendum claims a great Khajiiti hero destroyed the daemons. It does not articulate the fate of the strange humans and their cargo. Whatever the truth of the story, it is indisputable that these ominous ruins cast a dark shadow over the land."
 building_hall_of_colossus_01: "$building_type_hall_of_colossus_01$"
 building_hall_of_colossus_01_desc: "$building_type_hall_of_colossus_01_desc$"

 # Halls of the Highmane
 building_type_halls_of_highmane_01: "Halls of the Highmane"
 building_type_halls_of_highmane_01_desc: "Trial grounds for the Pride of Alkosh have existed for ages untold, but the Halls of the Highmane stand out for their dedication to a single, truly Forgotten Mane. When they enter these halls, the novice walk in the footsteps of uncountable Forgotten Manes.\n\nTheir strength and character will be assessed by the exotic trials left by the founder of the Halls. Those found lacking are either turned down or moulded so that they may best serve Elsweyr. Passing the trials of the Highmane with flying colors often marked the debut of prominent figures within the Pride of Alkosh."
 building_halls_of_highmane_01: "$building_type_halls_of_highmane_01$"
 building_halls_of_highmane_01_desc: "$building_type_halls_of_highmane_01_desc$"

 # Senchal Palace
 building_type_senchal_palace_01: "Senchal Palace"
 building_type_senchal_palace_01_desc: "Embellished by wares from across seas, Senchal Palace stands for all the great and worse of its town; Opulence, guile and and thrift are carved into its foundations. Several rulers arose from the native merchant oligarchy while even the [Glossary( 'Potentate', 'POTENTATE_GLOSS' )] elected to rule from within these walls.\n\nHence the Palace is more baroque meeting hall than grim stronghold, and its layout has plenty of room for fountains, gardens and lanterns to the delight of all authorized to walk the grounds. Generations of funding and rich history have made the Palace one of the most refined landmarks in all Southern Tamriel."
 building_type_senchal_palace_02: "$building_type_senchal_palace_01$"
 building_type_senchal_palace_02_desc: "$building_type_senchal_palace_01_desc$"
 building_senchal_palace_01: "$building_type_senchal_palace_01$"
 building_senchal_palace_01_desc: "$building_type_senchal_palace_01_desc$"
 building_senchal_palace_02: "$building_type_senchal_palace_01$ (Scorched)"
 building_senchal_palace_02_desc: "Ravaged by the terrible fire ignited in a desperate hope to burn away the deadly grip of the Knahaten Flu, the palace that once symbolized prosperity and influence is now nothing more than a smoldering ruin. Root-blackened statues and a few crumbling walls are all that remain, and no one visiting this place could imagine that it was once the jewel of southern Elsweyr."
 building_senchal_palace_03: "$building_type_senchal_palace_01$ (Rebuilt)"
 building_senchal_palace_03_desc: "Rebuilt from ashes and ruins, the Senchal Palace stands as a testament to the resilience of this city and its inhabitants. Its builders certainly tried to recapture the opulence and extravagant luxury of its predecessor. While some may say that this was not fully achieved, it is nevertheless a seat worthy of hosting even the wealthiest and mightiest rulers of Elsweyr. For those who have never seen the old palace, it is still breathtaking in its display of beauty and architectural marvels. Additionally, it was constructed to be more sturdy and defensive this time, in the hope of withstanding any future turmoil."

 # Lucky Cat's Port
 building_type_lucky_cat_port_01: "Lucky Cat's Port"
 building_type_lucky_cat_port_01_desc: "Senchal boasts one of the largest ports in southern Tamriel, and arguably the most lively of them all. Taverns, markets, skooma dens, brothels, and countless other businesses—both legal and illegal—thrive near the waterways.\n\nThe lords of Senchal certainly struggle at times to keep all this under control, but they don't really need to. In fact, the Lucky Cat's Port thrives best when left alone, and as long as the coins keep flowing, guards and harbormasters are likely to turn a blind eye to everything going on in there."
 building_type_lucky_cat_port_02: "$building_type_lucky_cat_port_01$"
 building_type_lucky_cat_port_02_desc: "$building_type_lucky_cat_port_01_desc$"
 building_lucky_cat_port_01: "$building_type_lucky_cat_port_01$"
 building_lucky_cat_port_01_desc: "$building_type_lucky_cat_port_01_desc$"
 building_lucky_cat_port_02: "$building_type_lucky_cat_port_01$ (Ravaged)"
 building_lucky_cat_port_02_desc: "The Lucky Cat's Port has always been a hotbed of rampant criminal activity, but the arrival of the Knahaten Flu turned it into uncontrollable chaos. Corruption, thievery, and murder run rampant, creating a lawless realm where only the strong survive and the word of Senchal's ruler goes unheard, even more then in the past."
 building_lucky_cat_port_03: "$building_type_lucky_cat_port_01$ (Restored)"
 building_lucky_cat_port_03_desc: "With great effort, order has finally been restored in the Lucky Cat's Port, making it once again a safe haven for ships from all over Tamriel."

 # White Walls of Alabaster
 building_type_alabaster_white_walls_01: "White Walls of Alabaster"
 building_type_alabaster_white_walls_01_desc: "The famous White Walls of Alabaster, formed by two rings, one around the hilltop castle district and the other around the entire city, shine like a beacon by day and glitter by night. As such, the city's actual lighthouse is rarely used, only in harsher weather conditions.\n\nAlthough the walls are primarily made of the soft stone of the same name, alabaster, they have protected the city for millennia - and may never have seen an actual siege, if the city's chronicles are anything to go by."
 building_alabaster_white_walls_01: "$building_type_alabaster_white_walls_01$"
 building_alabaster_white_walls_01_desc: "$building_type_alabaster_white_walls_01_desc$"

 # Potentate's Retreat
 building_type_potentate_retreat_01: "Potentate's Retreat"
 building_type_potentate_retreat_01_desc: "When the [Glossary( 'Potentate', 'POTENTATE_GLOSS' )] wasn't an 'honored guest' of the Senchal royals, he would reside in this villa at the southern tip of the Quin'rawl Peninsula. It appears as a rock-hewn Khajiiti manor, but with a prominent Imperial Diamond latched on the wooden door. According to records, the Potentate often felt more at ease within the Retreat: within bustling Senchal he stayed more guest than resident, despite absolute power. From there, he could freely organize audiences with less pomp than his dignity required at Senchal Palace, or start one of the legendary hunting parties this place as truly famous for."
 building_potentate_retreat_01: "$building_type_potentate_retreat_01$"
 building_potentate_retreat_01_desc: "$building_type_potentate_retreat_01_desc$"

 # Tonenaka Shrine
 building_type_tonenaka_shrine_01: "Tonenaka Shrine"
 building_type_tonenaka_shrine_01_desc: "Consecrated by fleeing Ilniviri, the Tonenaka Shrine is a nexus of Rimmen past and present history; A Khajiit city with a significant Cyrodiilic component and now Tsaesci settlers. Workers from throughout Elsweyr and beyond flocked to work on the centerpiece: ten thousand stone statuettes, who adorn the masonry work.\n\nSome say they honor the innumerable fallen of the chaotic post-[Glossary( 'Potentate', 'POTENTATE_GLOSS' )] period, in particular the trek to Rimmen. None knows for certain, as the five surviving patrons of the project entered the shrine alone and sealed it with wards of magic. As such only the outside has seen restoration work. Petitioners must do with the courtyard of the temple complex."
 building_tonenaka_shrine_01: "$building_type_tonenaka_shrine_01$"
 building_tonenaka_shrine_01_desc: "$building_type_tonenaka_shrine_01_desc$"

 # Dragonguard Sanctum
 building_type_dragonguard_sanctum_01: "Dragonguard Sanctum"
 building_type_dragonguard_sanctum_01_desc: "Tideholm houses one of the greatest fortresses ever inhabited by the Dragonguard of Emperor Reman. It is not completely certain whether he stationed them there to safeguard the lucrative trade routes in the Topal Bay, which is among the richest regions in Tamriel, or to prevent other threats.\n\nRegardless, due to its vital strategic position, the Dragonguard Sanctum never lost its value and importance to the region. Even after Reman's assassination, it remained a safe haven to the Akaviri who originally built it and is a coveted price for anyone who seeks influence over the sea." #AI
 building_dragonguard_sanctum_01: "$building_type_dragonguard_sanctum_01$ (Pirate Hideout)"
 building_dragonguard_sanctum_01_desc: "The Dragonguard, who once built and inhabited this place, are now completely eradicated. The impressive fortress, once tasked with safeguarding the numerous trade routes in this region, has now transformed into the complete opposite - a formidable pirate hideout and the base for countless raids throughout the Topal Bay."
 building_dragonguard_sanctum_02: "$building_type_dragonguard_sanctum_01$"
 building_dragonguard_sanctum_02_desc: "$building_type_dragonguard_sanctum_01_desc$"

##Black Marsh Special Buildings
 # Lilmoth New City
 building_type_development_committee_01: "Lilmoth New City"
 building_type_development_committee_01_desc: "Lilmoth New City was Reman II's monstrously utopian attempt to build a provincial capital for the newly-conquered Black Marsh. Six hundred years and millions of embezzled drakes later it looks far worse than the Lilmothiit ruin it stands on top of.\n\nRoofs of summer villas peek from under the mud in strict concentric circles of failed urban planning, entire streets are lost to massive seasonal floods, logistics collapse frequently and brutally. Every problem solved creates two more in its stead. Merely perpetuating Lilmoth New City is an incredible drain on its already thinly-spread resources and bureaucracy."
 building_development_committee_01: "$building_type_development_committee_01$ Construction Site"
 building_development_committee_01_desc: "$building_type_development_committee_01_desc$"
 building_development_committee_02: "$building_type_development_committee_01$ Construction Site"
 building_development_committee_02_desc: "Learning to maintain the waterworks of Old Lilmoth and applying their design across the region has put a stop to flooding and made clean water easy to come by. To conserve as many resources as possible the city had to abandon all but its most prospective developments and cluster its scattered population there. But even now, at tenth of its size, the New City struggles to meet its needs."
 building_development_committee_03: "$building_type_development_committee_01$"
 building_development_committee_03_desc: "Though immensely behind schedule and above budget, Lilmoth New City has managed to capture a tenth of the insane grandeur of its original plans. And even that has pushed the boundaries of civil engineering to its limits.\n\nWhile still reliant on trade, self-sufficiency is ensured by a mix of exotic agricultural techniques and a clever application of traditional Lilmothiit architecture. The residents of Lilmoth regularly assess all matters of urban planning, fighting daily against the dereliction of their homes."

 # Puzzle City
 building_type_puzzle_city_01: "Puzzle City"
 building_type_puzzle_city_01_desc: "A massive labyrinth, the Puzzle City of Mazzatun is a maze of such complexity that none of it makes sense. The disconnected hallways, jumbled staircases and impossible angles can only be the handiwork of an architect gone truly mad - with mad labourers to construct it in this fashion. Throughout it all runs the roots of its Hist, twisting and turning, its amber plasm gathering in pools throughout this complex of madness."
 building_puzzle_city_01: "$building_type_puzzle_city_01$"
 building_puzzle_city_01_desc: "$building_type_puzzle_city_01_desc$"
 autocratic_or_sithis: "Holder [faith|E] must have Sithis in its [pantheon|E] or the holder must be of a non tribal government."

 # Shrine of the Oracle
 building_type_oracle_shrine_01: "Shrine of the Oracle"
 building_type_oracle_shrine_01_desc: "Little is known about Cantemir, the enigmatic leader who guided a group of Chimer to settle in Black Marsh. However, legend holds that she was an ardent follower of the Psijic Endeavor, relentlessly pursuing the path to godhood. Deep within the confines of Amberstone Keep rests a secluded shrine, within which grows a great Hist - its roots digging deep into the land to connect with its kin. The mysterious visions she encountered during these sessions among its roots continue to provoke diverse interpretations and impassioned debates, ensnaring the curiosity of her descendants through the ages.\n\nThis shrine and its sacred tree not only bears immense religious and cultural significance for the Cantemeric Velothi but is also fortified enough to safeguard this hallowed refuge against the dangers lurking in the surrounding marshlands." #AI
 building_oracle_shrine_01: "$building_type_oracle_shrine_01$"
 building_oracle_shrine_01_desc: "$building_type_oracle_shrine_01_desc$"

 # Deep Graves Cemetery
 building_type_deep_graves_01: "Deep Graves Cemetery"
 building_type_deep_graves_01_desc: "Even in the long-forgotten days of the pre-Dusk Fall Era, this site served as a cemetery for deceased Argonians. While the location has remained the same, the funeral practices have changed over time. No longer are the dead interred in the towering Xanmeers that still stand watch; instead, they are now buried in the wet ground between them. Hundreds of gravestakes sprout from the swamp, slowly rotting away alongside the corpses they anchor. Despite the decay, their numbers do not diminish, as new stakes are continually added."
 building_deep_graves_01: "$building_type_deep_graves_01$ (Defiled)"
 building_deep_graves_01_desc: "$building_type_deep_graves_01_desc$\n\nOnce merely a place to avoid at night, it has now become a realm of terror under the control of necromancers. Bog Blights roam relentlessly, dragging unfortunate souls into the depths of the swamp." #AI - maybe
 building_deep_graves_02: "$building_type_deep_graves_01$"
 building_deep_graves_02_desc: "$building_type_deep_graves_01_desc$\n\nThis is a sacred place during the day, still held dear by many Argonians. However, at night, it becomes perilous, haunted by ghosts, strange lights, and even more sinister things."

 # Blackpool Complex
 building_type_blackpool_fort_01: "Blackpool Complex"
 building_type_blackpool_fort_01_desc: "Once a Ayleid Palace Complex now serves as the Residence of the Kings and Queens of Soulrest."
 building_blackpool_fort_01: "Blackpool Halls"
 building_blackpool_fort_01_desc: "Once an opulent palace for the Sorcerer-Kings, this monument to decadence now serves the people of Soulrest under the banner of charity. Thousands gather in these bleached halls every day: to shed their excesses to feed the needy and the vulnerable, and relax in the thermal springs beneath the building. To spite its ancient builders further, Blackpool's lofty bedchambers house not nobility, but ordinary folk who have no home of their own."
 building_blackpool_fort_02: "Palace of Lorianen"
 building_blackpool_fort_02_desc: "The mannish rabble has been evicted from these spires, the spring-water cleaned of their oils, the ancient paintwork painstakingly restored by the masters of their craft. The beautiful Lorianen is reborn with new colors, ready to once more bear within itself the finest of our kin like the oyster does its pearl."
 
 # Soulrest Emporium
 building_type_soulrest_port_01: "Soulrest Emporion"
 building_type_soulrest_port_01_desc: "This dizzying union of terraces, cothons, and alcoves carved into a strip of rocky coast is the economic hub of Soulrest and, by far, the busiest port of Black Marsh.\n\nThe Emporion is a miracle of architecture that takes the Ayleid Alteration-assisted masonry techniques to their logical extreme in a feat of environmental engineering. As one stands high atop the blossoming terraces and overlooks the bustling lagoon hiding behind the steep wind-breaking cliffs, one can't help but think that, in the right hands, prosperity is inevitable."
 building_soulrest_port_01: "$building_type_soulrest_port_01$"
 building_soulrest_port_01_desc: "$building_type_soulrest_port_01_desc$"
 building_type_soulrest_port_02: "$building_type_soulrest_port_01$"
 building_type_soulrest_port_02_desc: "$building_type_soulrest_port_01_desc$"
 building_soulrest_port_02: "$building_type_soulrest_port_01$ (Ravaged)"
 building_soulrest_port_02_desc: "Since the Knahaten Flu swept over the Emporium as a wave of death, the waters of the lagoon have been mostly still. Only few ships make their way from the Emporium to Elsweyr or the Heartlands these days. The Ayleid masonry is still standing, but its walls are slowly claimed by foliage just like the occasional ayleid ruins in the nearby wilderness."
 building_soulrest_port_03: "$building_type_soulrest_port_01$ (Restored)"
 building_soulrest_port_03_desc: "Once again the Emporium has become a bustling hub of trade and commerce. The walls have all been cleaned & polished and the cothons are filled with ships from all corners of Tamriel. The Emporium is a beacon of prosperity and wealth in the Black Marsh, and the people of Soulrest are proud of their port."

 # Thorn Palace
 building_type_thorn_palace_01: "Thorn Palace"
 building_type_thorn_palace_01_desc: "The Palace of Thorn serves a dual purpose of intimidating and defending. Thorn was once inhabited by Argonians but the Great House Dres earned its title through a significant slave-raid on the city after which they started to turn Thorn into a bastion of their own to defend their local interests.\n\nThorn may now be known as  the 'Jewel of the East', but the heavily fortified palace serves as a constant reminder of the city's bloody history, which is also immortalized in the silhouette-painting 'The Slave-Coffles of Thorn', commemorating the city's pivotal role in the rise of House Dres to prominence in the slave industry."
 building_thorn_palace_01: "$building_type_thorn_palace_01$"
 building_thorn_palace_01_desc: "$building_type_thorn_palace_01_desc$"

 #Rockgrove
 building_type_rockgrove_01: "Rockgrove"
 building_type_rockgrove_01_desc: "The mangroves of the Nha have long been a meeting place of Kothri merchants who ceremonially erected hundreds of wailing stones there, to invite and celebrate good fortune. To avoid filling the market grounds with more stones than people, Kothringi began dressing them in silver instead, imitating the trees in their sacred groves. Many moneyed outsiders stop in Xi-Tsei, if only to ogle the exotic wares and feel the dirge of the wailing stones as silver-gleaming chimes and bells quiver in the air."
 building_rockgrove_01: "$building_type_rockgrove_01$"
 building_rockgrove_01_desc: "$building_type_rockgrove_01_desc$"

 #Wailing Stones
 building_type_wailing_stones_01: "Wailing Stones"
 building_type_wailing_stones_01_desc: "The men of Perkar and Kotherra raise these giant standing stones to mark safe routes in jungle and swampland. Stones that see frequent traffic are often carved with warnings and directions or simple ornaments by passing travellers.\n\nWhen winds blow through the hollows in the rock, they turn into a low, haunting hum heard for miles. This is why western Black Marsh is sometimes called Wailing Coast. "
 building_wailing_stones_01: "$building_type_wailing_stones_01$"
 building_wailing_stones_01_desc: "$building_type_wailing_stones_01_desc$"

##Valenwood Special Buildings
 # Elden Grove
 building_type_elden_grove_01: "Elden Grove"
 building_type_elden_grove_01_desc: "A legendary forest known among the Bosmer as the birthplace of the sacred First Tree. This First Tree then gave life to all the forests of Tamriel, which are greatly revered by all adherents to the Green Pact."
 building_elden_grove_01: "Elden Grove"
 building_elden_grove_01_desc: "$building_type_elden_grove_01_desc$"
 holy_site_or_nature_freak: "Holder [faith|E] must consider it a [holy_site|E] or have the Green Pact or Jephre [pantheon|E]"

 # Cathedral of the Golden Path
 building_type_cathedral_of_the_golden_path_01: "Cathedral of the Golden Path"
 building_type_cathedral_of_the_golden_path_01_desc: "Toward the end of the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], when Valenwood was ruled by the Second Empire, Southpoint was the most important Imperial colony-town in what was then called the Kingdom of Grahtwood. The cathedral there was built by Governor Zantonius, a Colovian from Kvatch."
 building_cathedral_of_the_golden_path_01: "$building_type_cathedral_of_the_golden_path_01$ (Overgrown)"
 building_cathedral_of_the_golden_path_01_desc: "$building_type_cathedral_of_the_golden_path_01_desc$\n\nThe Valenwood has now claimed this place. Trees grow through the shattered roof, their roots intertwining with the remnants of the structure, while ivy cloaks the once-pristine marble walls in vibrant green. Local Bosmer gather here to pray to their own gods."
 building_cathedral_of_the_golden_path_02: "$building_type_cathedral_of_the_golden_path_01$"
 building_cathedral_of_the_golden_path_02_desc: "$building_type_cathedral_of_the_golden_path_01_desc$\n\nThe cathedral stands not only as a beacon of faith but also as a testament to Colovian defensive architecture. Constructed in a foreign land, its imposing design and fortified structure ensure that it can withstand the trials of a potential armed conflict."

 # Haven Docks
 building_type_haven_docks_01: "Haven Docks"
 building_type_haven_docks_01_desc: "Haven has consistently strived to personify its namesake – seeking to provide a sanctuary of security and comfort, a stark juxtaposition to the treacherous jungles and unfamiliar landscapes that stretch across the borders of Valenwood. Consequently, its harbor is often hailed as the Gateway to Valenwood, serving as the primary arrival point for most newcomers before they decide whether to venture further into the lush expanse, or to stay at this place to engage in the lively trading activity or seek work at one of the countless shipyards."
 building_haven_docks_01: "$building_type_haven_docks_01$"
 building_haven_docks_01_desc: "$building_type_haven_docks_01_desc$"

 # Caverns of Abamath
 building_type_abamath_01: "Caverns of Abamath"
 building_type_abamath_01_desc: "Wood Orcish myths claim that Abamath contains "Blood of Mauloch" in its caverns, a magical war paint said to give Orcs incredible strength. However, with the Ayleid conquest of Abamath, it was impossible to know whether it was true.\n\nBut with the recent conquest of Abamath by its ancient inhabitants and excavations of its caverns, the legends turned out to be true. Thanks to the blood of their progenitor, the people of Abamath have become more ferocious than ever, but with such strength come disadvantages: ferocious warriors can barely tell friend from foe."
 building_abamath_01: "$building_type_abamath_01$"
 building_abamath_01_desc: "$building_type_abamath_01_desc$"

 # Barrowbough
 building_type_bone_orchard_01: "Barrowbough"
 building_type_bone_orchard_01_desc: "The Bone Orchard has long been sacred to the Bosmeri, interring their ancestors' bones as far as they can remember beneath the roots of the Barrowbough tree. The Spinners would tell stories of the oldest bones, of the malleable and ever-shifting ancestors of the wood folk that buried their remains deep below the darkest roots of the Barrowbough. Many outsiders balk at the idea of an open air charnel, yet to the Bosmeri there is no greater honor for them to be interred with their families and loved ones, giving back to the Valenwoods what they owed."
 building_bone_orchard_01: "$building_type_bone_orchard_01$ (Defiled)"
 building_bone_orchard_01_desc: "Laden with magick, the Bone Orchard has long attracted scholars and mages into exploring it. With time and enough resources, the profane magicks of necromancy can be used to great effect beneath the roots of the Barrowbough. Bones animated through an application of rituals that seeped deep into the roots of the ancient tree, while ritualists mocks the rites of the Spinners as they chant words of power to rise the shambling undead. Most terrifying of all are the risen bones of the oldest things interred beneath the earth - The Wild Hunt's remnants risen as tangled and misshapen masses of bones, gnashing teeth and rattling chitin."
 building_bone_orchard_02: "$building_type_bone_orchard_01$"
 building_bone_orchard_02_desc: "$building_type_bone_orchard_01_desc$"

 # Remans Bluff
 building_type_fort_of_reman_bluff_01: "The Bluff"
 building_type_fort_of_reman_bluff_01_desc: "Under Reman I, Valenwood was conquered by Cyrodiil. Reman's Bluff was built to control the local populace, making sure any dissent was quashed in the new province. Yet the fort quickly fell to the local Wood Orcs.\n\nUnder them, the fort turned into ruins, and little remains of the ancient fortifications. The tin mine that the Cyrodiils dug also has almost run dry, yet it still provides a small stream of the materials."
 building_fort_of_reman_bluff_01: "$building_type_fort_of_reman_bluff_01$"
 building_fort_of_reman_bluff_01_desc: "$building_type_fort_of_reman_bluff_01_desc$"
 building_type_fort_of_reman_bluff_02: "Stronghold of Barkbite"
 building_type_fort_of_reman_bluff_02_desc: "With time and hard work, the fort of Reman's Bluff has been rebuilt to working order. The ancient fortifications were rebuilt and shaped into working order once more. Most of all is the newly built armoury, housing a state of the art forge that produces weaponry for the stronghold. The tin mine was expanded. Miners work full time in making sure the shafts are always staffed and continuously churning the goods from the deep."
 building_fort_of_reman_bluff_02: "$building_type_fort_of_reman_bluff_02$"
 building_fort_of_reman_bluff_02_desc: "$building_type_fort_of_reman_bluff_02_desc$"

 # Rootwater Grove
 building_type_rootwater_grove_01: "Rootwater Grove"
 building_type_rootwater_grove_01_desc: "Just almost a day's trek away from Woodhearth, a verdant and idyllic grove stands untouched for centuries. The trees that surrounds the patch of woodland seems to tangle and snake around it like a shroud, branches entangling like tendrils and leaves sway as if blinking. The Rootwater Grove is home to the cult of the Wooded Eye, worshippers of the Daedric Prince of Knowledge. The cultists of Hermaeus Mora are secretive, enigmatic and seemingly pacifistic to all efforts to oust them from the grove. It is said that from the ramblings of madmen and half-sane survivors of raids to the cult's stronghold, a hidden library is veiled from the mundane mind by dark magicks and daedric influences. The library houses texts that is pulled straight out of the realm of Apocrypha, guarded by nothing but the whispers of forbidden knowledge and the laughter of gibbering fools who lost themselves in the depths of the grove. "
 building_rootwater_grove_01: "$building_type_rootwater_grove_01$"
 building_rootwater_grove_01_desc: "$building_type_rootwater_grove_01_desc$"

 # Starstone Lake
 building_type_star_stone_lake_01: "Starstone Lake"
 building_type_star_stone_lake_01_desc: "Legends tell of a falling star in ages past that left a crater in its wake, creating a lake that shimmers and shines like the stars themselves in certain nights. Lake Bisnen, usually known as Starstone Lake by travellers, is certainly a beautiful sight to behold. On certain nights the lights from the skies above would illuminate the waters just right and it would seem as if there are glimmering stars dancing on the ripples. The beauty of the Starstone Lake isn't just the only thing that drives people to see it, but also the deposit of glass and meteoric ores that are mined near the shores or panned in times of drought. The Spinners would even weave the tale of an ancient stone, the oldest that fell from the heavens and made the crater, that is said to grant any wish that the owner may ask." 
 building_star_stone_lake_01: "$building_type_star_stone_lake_01$"
 building_star_stone_lake_01_desc: "$building_type_star_stone_lake_01_desc$"

 # Arenthia Citadel
 building_type_stridmeet_01: "Stridmeet"
 building_type_stridmeet_01_desc: "Stridmeet is a popular trading outpost along the Strid River. Khajiti traders come from the south with sweetmeats and silk, the Arenthian Bosmer likewise carry their haul of meat and boneworking products, while the Cyrodiils from the north provide fine tools and sweet heady wine from their vineyards."
 building_stridmeet_01: "$building_type_stridmeet_01$"
 building_stridmeet_01_desc: "$building_type_stridmeet_01_desc$"

 # Redfur Trading Post
 building_type_redfur_trading_post_01: "Redfur Trading Post"
 building_type_redfur_trading_post_01_desc: "The traditions of the Bosmeri people can often be odd and offputting to outsiders, but where there are people there will often be exceptions to the rule. The Redfur Trading Post is a pleasant settlement on the surface, with welcoming people and a good amount of trade coming in from both the south and the north routes. Beneath the veneer of respectability lies a lucrative black market run by the local thieves collectives and smuggler gangs, most prominently being the Hollow Moon gang and the Bonesnappers gang. At day the marketplace teems with travellers from all over, but at night the underground caverns beneath the settlement is alight with activity."
 building_redfur_trading_post_01: "$building_type_redfur_trading_post_01$"
 building_redfur_trading_post_01_desc: "$building_type_redfur_trading_post_01_desc$"

 # Ruined Labyrinth
 building_type_labyrinth_ruin_01: "Ruined Labyrinth"
 building_type_labyrinth_ruin_01_desc: "DO NOT ENTER\n\nWILDERKING LIVES HERE"
 building_labyrinth_ruin_01: "$building_type_labyrinth_ruin_01$"
 building_labyrinth_ruin_01_desc: "$building_type_labyrinth_ruin_01_desc$"

##Summerset Special Buildings
 building_type_sapiarch_college_01: "College of Sapiarchs"
 building_type_sapiarch_college_01_desc: "To the west of Lilandril, off the coast and on an island isolated from any connection to land, stands the College of Sapiarchs. Within the magically enforced walls of the academy are the Sapiarchs, two hundred and twenty three scholars of fields ranging from Alchemy and Naval Excogitation to Applied Phrenology and Praxic Discourses. The main duties of the Sapiarchs are to research each of their fields, until death or retirement from their field of study. Beyond that the scholars are also to counsel the rulers of Alinor with their wisdom, and it is said that any Kinlord of Alinor or Auridon that has a Sapiarch by their side will be prosperous for as long as the wise scholar stays at their side."
 building_sapiarch_college_01: "$building_type_sapiarch_college_01$"
 building_sapiarch_college_01_desc: "$building_type_sapiarch_college_01_desc$"

 building_type_alinor_harbor_01: "Ports of Alinor"
 building_type_alinor_harbor_01_desc: "The beating heart of Summerset is, no doubt, the waterways of the Ports of Alinor. Exotic wares from every corner of Tamriel — and beyond, as far east as Esroniet — find themselves here, after passing the infamously scrutinizing eye of the Altmeri customs office. The fearsome Alinori Navy is stationed here as well: a constant reminder to all of the Aran-El's might."
 building_alinor_harbor_01: "$building_type_alinor_harbor_01$"
 building_alinor_harbor_01_desc: "$building_type_alinor_harbor_01_desc$"
 
 building_type_firsthold_orrery_01: "Great Orrery of Firsthold"
 building_type_firsthold_orrery_01_desc: "Wrought of Aetherial minerals gathered from the very skies it studies, the walls of the Orrery of Firsthold are the last and grandest legacy of the Sun Birds of Alinor. Within them work seers and symbologicians, mechanisms and mysticisms, and the most accomplished of Alinor's augurs, in the service of enciphering ancient truths into the spheres above."
 building_firsthold_orrery_01: "$building_type_firsthold_orrery_01$"
 building_firsthold_orrery_01_desc: "$building_type_firsthold_orrery_01_desc$"
 
 building_type_cloudrest_college_01: "College of Chirurgeons"
 building_type_cloudrest_college_01_desc: "In the College of Chirurgeons, primordial forms of Restoration tinged with dawn magicks and stained with blood are taught and practiced for the removal of blemishes and the exaltation of the physique. More clandestinely, the College's flesh-sculptors also attend to the #italic improvement # of features considered distasteful in elite circles."
 building_cloudrest_college_01: "$building_type_cloudrest_college_01$"
 building_cloudrest_college_01_desc: "$building_type_cloudrest_college_01_desc$"

 building_type_banished_cells_01: "Banished Cells"
 building_type_banished_cells_01_desc: "The Banished Cells are a high security prison that is built into the remains of a large underground complex. They are specifically designed to held high ranking prisoners, especially ones with a vast amount of magical capabilities or – and that occurs dangerously often – individuals who get too close to the [Glossary( 'Daedra', 'DAEDRA_GLOSS' )]. To doing so is considered a most heinous crime as it allows malevolent forces to get a gripe on altmer society, which in the most extreme cases could led to its destruction if left unchecked.\n\nTherefore only the most capable of guards, called keepers, are allowed to work here and they are supported in their duty by powerful magical barriers and the thick walls of this unforgiving prison."
 building_banished_cells_01: "$building_type_banished_cells_01$"
 building_banished_cells_01_desc: "$building_type_banished_cells_01_desc$"

 building_type_alinor_palace_01: "Royal Palace of Alinor"
 building_type_alinor_palace_01_desc: "The Palace of Alinor, the most flamboyant building on the blessed isles, if not in the world. The tallest spire casts a shadow on the city below like a sundial and houses its fabled throne room at the top — encased in perfectly translucent crystal cut to dissect the passing sunlight into a rainbow aureole. It is said that walking these halls is the closest a mortal can feel to the divine while still on Nirn."
 
 building_alinor_palace_01: "$building_type_alinor_palace_01$"
 building_alinor_palace_01_desc: "$building_type_alinor_palace_01_desc$"
 
 building_type_alinor_city_01: "City of Alinor"
 building_type_alinor_city_01_desc: "Bustling but far from chaotic, the heart of Altmeri civilization inspires awe and respect in all those who behold its streets and spires. Here, amidst the shadows cast by delicate glass-blown spires and past towering arches carved from ancient rock, all strata of Elven society go about their business, mingling rarely, and each with their own purpose. Splendid in the light of color-scintilla broken through its aetherquartz windows, outsiders may be forgiven for thinking the city is built from insect wings and light."
 
 building_alinor_city_01: "$building_type_alinor_city_01$"
 building_alinor_city_01_desc: "$building_type_alinor_city_01_desc$"

##Skyrim Special Buildings
 building_type_shalidors_maze_01: "Shalidor's Maze"
 building_type_shalidors_maze_01_desc: "The great mage Shalidor built his labyrinth deep within the old city of Bromjunaar, and his power still echoes through its halls. Some say he concealed magickal secrets within; others, that artifacts of great power are hidden in the walls. Still others say that Shalidor trained his apprentices in its challenging course, or worse: that this is how he separated wheat from chaff among the many mages who sought his tutorship. Whatever the truth, many have entered Labyrinthian, and many corpses still remain. Those mages who navigate it, though, are indisputably more powerful than they were before… and different, somehow."
 building_shalidors_maze_01: "$building_type_shalidors_maze_01$"
 building_shalidors_maze_01_desc: "$building_type_shalidors_maze_01_desc$"
 building_shalidors_maze_02: "$building_type_shalidors_maze_01$" #EK TODO: add loc for tier 2 - Do I have to? Regards, Fullerton.
 building_shalidors_maze_02_desc: "$building_type_shalidors_maze_01_desc$" #EK TODO: add loc for tier 2 - Do I have to? Regards, Fullerton.
 
 building_type_understone_keep_01: "Understone Keep"
 building_type_understone_keep_01_desc: "Markarth is built around the ancient Dwarven city of Nchuand-Zel. Its highest ramparts and walls form the Understone Keep, a defensible bastion built into the earth itself. Enough of the subterranean city survives that the people of Markarth can retreat here when threatened, and store victuals and valuables enough to survive almost indefinitely. Any army would struggle to breach the Understone. Many generals would not even try."
 building_understone_keep_01: "$building_type_understone_keep_01$"
 building_understone_keep_01_desc: "$building_type_understone_keep_01_desc$"

 building_type_nordic_walls_01: "Ancient Nordic Walls"
 building_type_nordic_walls_01_desc: "Towering Walls dating back to the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )] and beyond. Build by the Ancient Nords with methods barely understood now and reinforced with arcane magics, they have protected those that live inside them for generations."
 building_nordic_walls_01: "$building_type_nordic_walls_01$"
 building_nordic_walls_01_desc: "$building_type_nordic_walls_01_desc$"
 
 building_type_blue_palace_01: "Blue Palace"
 building_type_blue_palace_01_desc: "The Blue Palace has served as the seat of the Jarls of Solitude (and occasional High King) since at least the year 143 of the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )]. Called the 'Blue Palace' because of its blue roofs and great blue dome, it towers on top of Solitude's Great Arch and can be seen when aproaching the city by boat or foot."
 building_blue_palace_01: "$building_type_blue_palace_01$"
 building_blue_palace_01_desc: "$building_type_blue_palace_01_desc$"
 
 building_type_solitude_arch_01: "Solitude Arch"
 building_type_solitude_arch_01_desc: "It's said that Kyne, the chieftain of the Nordic gods, shaped the Solitude Arch out of her very breath. The wind that passes through is sacred and life-giving, and to face the sky on the archway is to be seen by the Great Widow and her meadhall."
 building_solitude_arch_01: "$building_type_solitude_arch_01$"
 building_solitude_arch_01_desc: "$building_type_solitude_arch_01_desc$"
 
 building_type_jorrvaskr_01: "Mead Hall of Jorrvaskr"
 building_type_jorrvaskr_01_desc: "The Hall of Jorrvaskr, Home of the Companions, is acording to legend constructed out of the ship 'Jorrvaskr' which carried Ysgramor and his 500 Companions across the Sea of Ghosts to Skyrim."
 building_jorrvaskr_01: "$building_type_jorrvaskr_01$"
 building_jorrvaskr_01_desc: "$building_type_jorrvaskr_01_desc$"
 
 building_type_gildergreen_01: "Gildergreen"
 building_type_gildergreen_01_desc: "Gildergreen is a Holy Tree found in Whiterun sacred to worshippers of Kyne. It was planted during the early settlment of the city from a sappling of the old tree Eldergleam."
 building_gildergreen_01: "$building_type_gildergreen_01$"
 building_gildergreen_01_desc: "$building_type_gildergreen_01_desc$"
 
 building_type_winterhold_fortress_01: "Ice Fortress"
 building_type_winterhold_fortress_01_desc: "The Ancient Ice Fortress of Winterhold acording to old texts was once the home of Arch-Mage Shalidor, where he resided with his wife Ulfsild. It is regarded as one of his greatest accomplishments."
 building_winterhold_fortress_01: "Ice Fortress of Winterhold"
 building_winterhold_fortress_01_desc: "$building_type_winterhold_fortress_01_desc$"

 building_type_winterhold_college_01: "College of Winterhold"
 building_type_winterhold_college_01_desc: "The College of Winterhold is Skyrim's premier location for learning and studying the arcane arts. It was supposedly founded by the great Arch-Mage Shalidor in the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], and has for generations bought prestige and recognition to Winterhold."
 building_winterhold_college_01: "$building_type_winterhold_college_01$"
 building_winterhold_college_01_desc: "$building_type_winterhold_college_01_desc$"

 building_type_dragon_prison_01: "Dragonsreach"
 building_type_dragon_prison_01_desc: "#italic 'Olaf was Numinex, a dragon in human form; on moonless nights, he would spread wing and fly. But this was his prison, and here he did die; the palace Dragonsreach of Olaf One-Eye.'#!\n\nThere are many stories about Olaf One-Eye, the king who built Dragonsreach to hold a dragon. Whatever their truth, the palace remains, perched atop Whiterun like the dragon it once held."
 building_dragon_prison_01: "Dragonsreach"
 building_dragon_prison_01_desc: "$building_type_dragon_prison_01_desc$"

 building_type_palace_of_kings_01: "Palace of the Kings"
 building_type_palace_of_kings_01_desc: "Dating back to the First Empire of the Nords, this lofty palace stands on a tall hill to overlook all of Windhelm and the barrow where Ysgramor laid to rest his beloved son. Built from robust dark stone under immense efforts by the first Atmoran settlers who followed him, the Palace was built to endure the ages and the relentless northern winds that now break upon its high halls. Cold and grim on the outside, song and mead keeps the court within warm and lively."
 building_palace_of_kings_01: "$building_type_palace_of_kings_01$"
 building_palace_of_kings_01_desc: "$building_type_palace_of_kings_01_desc$"

 building_type_volkihar_castle_01: "Volkihar Castle"
 building_type_volkihar_castle_01_desc: "An unusually ancient fortress, Volkihar Castle housed the vampire bloodline of the same name for almost a thousand years. The grim castle's stoneworks go deep underground, with evidence that the Volkihar made home atop an earlier Nordic structure that had long been devoured by the earth. Gargoyles and ferocious undead roam the island's periphery, while the castle protects itself with magical defenses and bulwarks tested by time and wear."
 building_volkihar_castle_01: "$building_type_volkihar_castle_01$"
 building_volkihar_castle_01_desc: "$building_type_volkihar_castle_01_desc$"

 building_type_snowprince_tomb_01: "Tomb of the Snow Prince"
 building_type_snowprince_tomb_01_desc: "The Snow Prince was one of the great Falmer heroes who fought valiantly against the Nord to prevent the downfall of his race. It was said that he wielded ice magic with the same efficiency as his spear and had it not been for the twelve-year-old girl Finna, who managed to throw her mother's sword at him, he might have led the snow elves to a victory. But his death led to the Falmer defeat in this Battle of the Moesring. Out of respect for such an fierce enemy, the victorious Nords erected a great tomb for him, filled it with treasures and even provided guards to protect it.\n\nThe tomb stands to this day, reminding every visitor of the value of valor in battle and the honor one can hold even towards their foes."
 building_snowprince_tomb_01: "$building_type_snowprince_tomb_01$"
 building_snowprince_tomb_01_desc: "$building_type_snowprince_tomb_01_desc$"

 building_type_bthalft_01: "Bthalft"
 building_type_bthalft_01_desc: "This unremarkable Dwarven ruin was once chosen as the premier city-state of the Aetherium League, where its clans held council on matters of cooperation and the pursuit of knowledge. After the League collapsed into brutal Aetherium Wars, the Nords launched a series of conquests against the weakened Dwarven cities, but the confused invaders found Bthalft scoured of all life, with nothing of value but the naked stone."
 building_bthalft_01: "Ruins of Bthalft"
 building_bthalft_01_desc: "$building_type_bthalft_01_desc$"
 building_bthalft_02: "Aetherium Forge"
 building_bthalft_02_desc: "Sealed beneath Bthalft in mourning and coveted by all is the Aetherium Forge, a garganutan pipe organ of twelve modules and eighty-six thousand pipes, their dense ranks snaking through furnaces and cavestone like brass roots. Here, a virtuoso Tonemaster extracts the properties of Aetherium through blackening heat and application of proper tones: all to craft Aetherium tools and animunculi whose mere promise was enough to plunge the Dwemer into vicious, brother-killing wars."

 building_type_bthuand_01: "Bthuand Palpitation Array"
 building_type_bthuand_01_desc: "A master smith of the lost House Dwemer, Bthuand of Bthuand once built vast and faultless automata of hammers and anvils -- not to work metal, but to match and understand the beating of the Heart of Lorkhan. It is here Kagrenac forged the Tools in secret, using the Palpitation Array to strike the Heart's own polyrhythms into the tissue of his materials. Even as its makers have disappeared, Bthuand continues to hammer away, never faltering, never silent."
 building_bthuand_01: "$building_type_bthuand_01$"
 building_bthuand_01_desc: "$building_type_bthuand_01_desc$"

 building_type_arkngthamz_01: "Saturation Chamber"
 building_type_arkngthamz_01_desc: "A large convex room entombed in endless layers of wool-like metal at the heart of the capital of Dwemer clan Kragen. Great rail-mounted arrays of tuning forks jut out of the ground in constellations. The weakest noise will linger in these walls for minutes, but the drone of the tuning forks folds into an inconsolable wail that boils water and splits bone until it's vapor and dust."
 building_arkngthamz_01: "$building_type_arkngthamz_01$"
 building_arkngthamz_01_desc: "$building_type_arkngthamz_01_desc$"
 EXECUTION_SATURATE: "Saturate to Completion"

 building_type_hroldan_01: "Old Hrol'dan"
 building_type_hroldan_01_desc: "Old Hrol'dan is one of the most ancient and most fortified settlements in the Reach. It has successfully served as a staging area for countless Nordic warlords seeking to subjugate the Reach, and has been used by the Reachmen to repel many invasions from the east."
 building_hroldan_01: "$building_type_hroldan_01$"
 building_hroldan_01_desc: "$building_type_hroldan_01_desc$"

#High Rock special buildings
 building_type_grayhome_citadel_01: "Grayhome Citadel"
 building_type_grayhome_citadel_01_desc: "In ages past, Rada al-Saran of the infamous Gray Host built an imposing citadel on a bleak and frozen rock. Grayhome still houses the remnants of many vile experiments concerning life and death and the means to repeat them. Twofold walls of basalt made impenetrable with blood magicks surround the citadel as spires of weather-beaten marble rise into the sky. Sailors unfortunate enough to castaway on the island would find more than misfortune and horror."
 building_grayhome_citadel_01: "$building_type_grayhome_citadel_01$"
 building_grayhome_citadel_01_desc: "$building_type_grayhome_citadel_01_desc$"

 building_type_cath_bedraud_01: "Cath Bedraud"
 building_type_cath_bedraud_01_desc: "Built in the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], in the wake of Battle of Glenumbra Moors, the great cemetary of Cath Bedraud houses all the fallen soldiers and heroes who died defending High Rock. Over the centuries it evolved to house the greatest rulers of High Rock, and it is now common for a royal family to be granted an exclusive portion of the cemetary to house their dead."
 building_cath_bedraud_01: "$building_type_cath_bedraud_01$"
 building_cath_bedraud_01_desc: "$building_type_cath_bedraud_01_desc$"

 building_type_castle_daggerfall_01: "Castle Daggerfall"
 building_type_castle_daggerfall_01_desc: "The Castle of Daggerfall overlooks both the Iliac and Eltheric waters like a proud sea bird. Its high towers, enchanted portcullis and unfathomable moat join forces to deter intruders. Past monarchs of Daggerfall exercised control not only over Glenumbra but the whole of Starfall Bay relying on this august fortress and its bustling castle town.\n\nThe building testifies to the turbulence of [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )] High Rockian politics: Altmer techniques can be seen in the construction, yet the layout is reminiscent of ancient Nord fortresses. No matter this heritage, architects made the castle a distinctly Breton work with walls typical of a High Rock hillfort, only grander and sturdier than any other stronghold besides Bangkorai Garrison."
 building_castle_daggerfall_01: "$building_type_castle_daggerfall_01$"
 building_castle_daggerfall_01_desc: "$building_type_castle_daggerfall_01_desc$"

 building_type_bangkorai_garrison_01: "Bangkorai Garrison"
 building_type_bangkorai_garrison_01_desc: "Graveyard of armies, Bangkorai Garrison broke many invasions during its existence. Built upon a strategic pass between Evermore and Hallin, it mainly defended the Bretons earning it the nickname 'Shield of High Rock'. But there are exceptions; The host of King Joile was scattered by the Makela Leki and her sworn sisters on this same place when they tried to invade Hammerfell through the pass.\n\nThe fort occupies the narrowest point of the pass, able to project control on trade, war and politics. With steady income from toll gates, any governor in charge of this pivotal stronghold will instantly become a powerhouse."
 building_bangkorai_garrison_01: "$building_type_bangkorai_garrison_01$"
 building_bangkorai_garrison_01_desc: "$building_type_bangkorai_garrison_01_desc$"

 building_type_ire_sanctum_01: "Temple of Ire"
 building_type_ire_sanctum_01_desc: "The blessed spirit of conflict and contention, Malakh and Trinikh both,' reads the metal tablet of Orcish make, discarded at the holy sanctum of the Temple of Ire where paired statues, one bearing a blade and one wielding a maul, are locked forever in still combat. The local Witchmen speak of furious airs surrounding the temple grounds, where the edge of one's feelings grows sharp and dangerous, and hatred is both pious and revered.\n\nThe Temple of Ire has seen use by so many people over the ages that the original identity of the altar statues has been lost to history. Now they're simply two spirits of conflict and spite, entwined and adversarial."
 building_ire_sanctum_01: "$building_type_ire_sanctum_01$"
 building_ire_sanctum_01_desc: "$building_type_ire_sanctum_01_desc$"
 building_ire_sanctum_02: "Temple of Ire"
 building_ire_sanctum_02_desc: "The restored Temple of Ire is among the largest monuments of Orcish religion. At first sight much more castle than temple, the transcendent aura of the site keeps visitors in awe. The attached library is a repository of 'perceived betrayals and injustices' going back a few millenia: effectively an excellent source of Orcish perspective on historical events.\n\nThe origin of the blessings vested unto the Temple of Grievance is a topic of debate. Whether it be Malacath or Trinimac, the favour of a deity permeates the temple."

 building_type_ilni_shrine_01: "Shrine of Ilni"
 building_type_ilni_shrine_01_desc: "Once, this was a temple in the Akaviri style dedicated to Ilni, the Tsaesci goddess of the wind. The snake-priests decreed that it should be dismantled and rebuilt every four years in a ritual of transience, and over time much of the surrounding Glenumbran architecture snuck into the new constructions. Now, aside from the glass-blown bells that chime a quiet melody, and illegible prayers written on paper strips that sway in the wind, little distinguishes the building from a temple of Kynareth."
 building_ilni_shrine_01: "$building_type_ilni_shrine_01$"
 building_ilni_shrine_01_desc: "$building_type_ilni_shrine_01_desc$"

 building_type_doomcrag_tower_01: "The Doomcrag"
 building_type_doomcrag_tower_01_desc: "Once the tallest spire of a forgotten Ayleid colony, the Doomcrag is nothing more than a beacon of death and corruption now. At the top of the ruins lies Abagandra — the Lightless Remnant in Ayleidoon. This fallen relic was corrupted by the wanton bloodshed between the Ayleid colonists and the native inhabitants leading to this twisted mutation.\n\nThe Doomcrag has variously been rumored known to drain the lifeforce of trespassers, curse them with vampirism, spirit away people or make them tumble into the sea. One should be very careful if they intend to travel near it."
 building_doomcrag_tower_01: "$building_type_doomcrag_tower_01$"
 building_doomcrag_tower_01_desc: "$building_type_doomcrag_tower_01_desc$"
 building_doomcrag_tower_02: "The purified Doomcrag"
 building_doomcrag_tower_02_desc: "Through deep purifying magic, the Doomcrag has been purified and Erokii stands again! Proudly overlooking the land is Lattanya—Light of Life— of old, the guardian relic which made nature blossom and warded off illnesses. Its soothing magic ensure the hinterlands prosper and are safe to walk again."

 building_type_fang_lair_01: "Fang Lair (Haunted)"
 building_type_fang_lair_01_desc: "This cursed place is known to its inhabitants only as the 'Fang Lair', though legends tell of dragons and dwarves that lived here in ancient times."
 building_fang_lair_01: "$building_type_fang_lair_01$"
 building_fang_lair_01_desc: "$building_type_fang_lair_01_desc$"
 building_fang_lair_02: "Fang Lair"
 building_fang_lair_02_desc: "Its mighty gates thrown open to the sunlight, the lost city that became Fang Lair is again claimed by the living. While its lootable wealth is nearly spent, its true value seems to be in whatever mysteries were worked here by its old masters: powerful magical currents fill its halls and corridors, but an evil presence can also ever be felt lurking just out of eyesight; workers periodically go missing. In the deepest vault was unearthed the massive remains of the wyrm Thurvokun, remarkably well preserved. Some labourers swear that in this chamber a breeze may be felt, and that the bones of the ancient dragon sometimes stir, rattling in response to the winds of magic."

 building_type_torugs_tomb_01: "King Torug's Tomb"
 building_type_torugs_tomb_01_desc: "Unassuming cave mouths are scattered across these mountains. Some are burial sites; the higher on the mountaintops, the more important the chief. Near the apex of Mount Sorrow lies the tomb of Torug, whose sarcophagus still sits on a dais within its cave. The orcs revere the founder of their first Orsinium; as do the Reach, for the ancient chivalrous Breton they hold him to be."
 building_torugs_tomb_01: "$building_type_torugs_tomb_01$"
 building_torugs_tomb_01_desc: "$building_type_torugs_tomb_01_desc$"
 orsimer_or_reachmen: "Is #V $heritage_orcish_name$#!  #V $heritage_breton_name$#! [heritage|E]"

 building_type_northpoint_lighthouse_01: "Northpoint Beacon"
 building_type_northpoint_lighthouse_01_desc: "Northpoint is one of the major trade hubs along the Sea of Ghosts, and its lighthouse is a beacon of hope for all sailors who travel these dangerous waters. The lighthouse is a symbol of the city's wealth and power, and it is said that its magical light can be seen from as far as the shores of Wrothgar."
 building_northpoint_lighthouse_01: "$building_type_northpoint_lighthouse_01$"
 building_northpoint_lighthouse_01_desc: "$building_type_northpoint_lighthouse_01_desc$"
 
 building_type_city_of_orsinium_01: "City of Orsinium"
 building_type_city_of_orsinium_01_desc: "This was the site of the ancient city of Orsinium. Sacked long ago, abandoned by its population — now dispersed in diaspora — and levelled almost to the ground, its once-formidable walls were reduced to above-ground quarries, piles of bricks ready to use."
 building_city_of_orsinium_01: "Ruins of Orsinium"
 building_city_of_orsinium_01_desc: "After a successful siege in the 430th Year of the [Glossary( 'Second Era', 'SECOND_ERA_GLOSS' )], the City of Orsinium - the home of the Orcs - was sacked and almost completely destroyed.\nIts Orcish population was expelled, forced to flee without a home. \n\nWhat remains of the city is routinely pillaged by whoever owns the ruins, which is a great source of pride for many."
 building_city_of_orsinium_02: "Reclaimed Ruins of Orsinium"
 building_city_of_orsinium_02_desc: "Reclaimed by the Orcs after decades of foreign ownership, the Ruins of Orsinium are another symbol of the Orcish way of life - beaten down, fighting against insurmountable odds, and yet triumphing.\n\nWork has already started, but it will need many more years and many more workers before it can be once again the proud home of the Pariah Folk."
 building_city_of_orsinium_03: "City of Orsinium"
 building_city_of_orsinium_03_desc: "Reclaimed by the Orcs after decades of foreign ownership, the Ruins of Orsinium are another symbol of the Orcish way of life - beaten down, fighting against insurmountable odds, and yet triumphing.\n\nAfter years of work and defense agaist foreign raids or invasions, the City of Orsinium stands once more as the center of Orsimer civilization.\nHundreds or thousands of Orcs join it everyday, eager to defend it and help it grow."
 ruined_orsinium_trigger_desc: "Orcs cannot make use of the pillaged Orsinium - you must rebuild it!"
 rebuild_orsinium_trigger_desc: "You lack the [GetCultureTradition('tradition_denizens_lost_orsinium').GetName|V] [tradition|E]"

 building_type_crypt_of_hearts_01: "Crypt of Hearts"
 building_type_crypt_of_hearts_01_desc: "Once known as "Agea Relle", the ruins left by their former corrupted master were twisted into new and repulsing designs by Dutheil, the Mad Architect. A place of love and hope twisted by jealousy and hatred into a perverse dungeon of eternal torment."
 building_crypt_of_hearts_01: "$building_type_crypt_of_hearts_01$"
 building_crypt_of_hearts_01_desc: "$building_type_crypt_of_hearts_01_desc$" 
 holy_site_or_mephala: "Holder [faith|E] must consider it a [holy_site|E] or have Mephala in its [pantheon|E]"

#Hammerfell
 building_type_sword_song_school_01: "Sword Song School"
 building_type_sword_song_school_01_desc: "Sword Song School was founded by the Order of Diagna to protect the borders of Hammerfell from hostile Reach and Breton tribes and to educate new generations to carry on this duty. The school provides education in martial arts for any Redguard who passes its rigorous, sometimes deadly, trials of prowess. Those who finish their education serve as marshals to the rulers of Hammerfell or embark on their own adventures."
 building_sword_song_school_01: "$building_type_sword_song_school_01$"
 building_sword_song_school_01_desc: "$building_type_sword_song_school_01_desc$"
 
 building_type_dwarven_observatory_01: "Dwarven Observatory"
 building_type_dwarven_observatory_01_desc: "Along the cliffs of Hunding Bay is found the magnificent Dwarven Observatory. From here the Dwemer of old studied the stars and the movements of the Constellations, as described in #italic Ffoulke's Firmament#!. It is however in disrepair, making the nearby Dwarven city ruin of Bthzark a lot more interesting."
 building_dwarven_observatory_01: "$building_type_dwarven_observatory_01$ (Ruined)"
 building_dwarven_observatory_01_desc: "$building_type_dwarven_observatory_01_desc$"
 building_dwarven_observatory_02: "$building_type_dwarven_observatory_01$"
 building_dwarven_observatory_02_desc: "Thorough pillaging of the ruins of Bthzark provides this province with a steady income. During these excavations however, a great supply of Dwemer gears and other such mechanical parts were discovered, making it possible to restore the old Observatory. It has since become an important centre of learning, equal to the other great orreries of Tamriel."

 building_type_amenos_station_01: "Amenos Station"
 building_type_amenos_station_01_desc: "Amenos Station, colloquially known as the Brine to its inhabitants, is less of a settlement and more of a prison. When the Imperials took over the Systres, hordes of prisoners were brought onto the island to clear it of its jungles and strip it of its precious ores. The death toll of the penal colonies administered by the Amenos Station was staggering: even those who could withstand the brutal working conditions would often succumb to wildlife and tropical disease."
 building_amenos_station_01: "$building_type_amenos_station_01$"
 building_amenos_station_01_desc: "$building_type_amenos_station_01_desc$"

 building_type_skaven_firedancer_college_01: "Firedancer College"
 building_type_skaven_firedancer_college_01_desc: "The Firedancers of Skavyn are well-known across Tamriel for being entertainers of the highest quality, with many kings and governors once hiring them for their illusory performance. The Firedancer College in Skavyn is not a simple college for upcoming bards and dancers, it teaches its aspirants the basics of Illusion and Destruction, small spells and cantrips that turn dance into spectacle."
 building_skaven_firedancer_college_01: "$building_type_skaven_firedancer_college_01$"
 building_skaven_firedancer_college_01_desc: "$building_type_skaven_firedancer_college_01_desc$"

 building_type_swordsingers_crypt_01: "Swordsingers' Crypt"
 building_type_swordsingers_crypt_01_desc: "This crypt is the final resting place of the legendary sword-singer Frandar Hunding, his son Divad Hunding, and the god-like swordmaiden Makela Leki. History's greatest sword saints have been buried here, but so holy has the Hall of Heroes grown with their presence that nobody living or dead is permitted to cross its sacred threshold anymore -- even the greatest warrior of this age will profane it with inferior swordsmanship and inadequately glorious conquests."
 building_swordsingers_crypt_01: "$building_type_swordsingers_crypt_01$"
 building_swordsingers_crypt_01_desc: "$building_type_swordsingers_crypt_01_desc$"
 holy_site_or_yokudan: "Holder [faith|E] must consider it a [holy_site|E] or holder must be of Yokudan [heritage|E]"

 building_type_taria_salt_fields_01: "Helkati Salt Flats"
 building_type_taria_salt_fields_01_desc: "It's often boasted that Helkati salt flats supply more than a quarter of the province's salt. Regardless if that's the case, the salterns of Helkati are, and will always be, a lucrative venture to whoever governs over the salt flats." 
 building_taria_salt_fields_01: "$building_type_taria_salt_fields_01$"
 building_taria_salt_fields_01_desc: "$building_type_taria_salt_fields_01_desc$"

 building_type_morwha_conservatorium_01: "Morwha Conservatorium"
 building_type_morwha_conservatorium_01_desc: "In the Perfumers District of Hegathe, the Conservatorium of Morwha serves it's purpose as both a temple dedicated to the Mother Goddess and as a rectory for the clergy and the cloistered trainees. It is an incredibly prestigious deed for anyone to send their youth to study in the Conservatorium, learning natural sciences, healing, the arts, and the sacred act of lovemaking and birthing. The graduates of the Conservatorium usually becomes clerics of Morwha, but plenty also become courtiers to the countless rulers of Hammerfell due to their skill in rhetoric and espionage."
 building_morwha_conservatorium_01: "$building_type_morwha_conservatorium_01$"
 building_morwha_conservatorium_01_desc: "$building_type_morwha_conservatorium_01_desc$"

 building_type_sentinel_palace_01: "Samuruik"
 building_type_sentinel_palace_01_desc: "It is said in Sentinel that there is no place more beautiful or more splendid than Samuruik, the Palace of Sentinel, with many poets and painters glorifying its famous golden dome in ink and oil. The Palace of Sentinel isn't just known for its beauty but also for its massive and overwhelming fortifications, a remnant of the harbour-fort that would become the Sentinel of today. Ramparts, kill-slits, even several surrounding casbah that makes it not just a vista but also a fortified home for the Forebear Kings."
 building_sentinel_palace_01: "$building_type_sentinel_palace_01$"
 building_sentinel_palace_01_desc: "$building_type_sentinel_palace_01_desc$"

 building_type_tower_fifth_doctrine_01: "Tower of the Fifth Doctrine"
 building_type_tower_fifth_doctrine_01_desc: "The Tower of the Fifth Doctrine is known in scholarly circles as 'Little Gwylim' due to how much of it's curricula draws from the prestigious institution. Built at the start of the reign of Emperor Reman III, the university's members are known to both be scholars and learned mages. The most well-known structure in the university would, of course, be the Library of the Fifth Doctrine. From Yoku myths to translations into the Cis-Niben folk language, one can find almost anything in the vast collection." 
 building_tower_fifth_doctrine_01: "$building_type_tower_fifth_doctrine_01$"
 building_tower_fifth_doctrine_01_desc: "$building_type_tower_fifth_doctrine_01_desc$"

 building_type_merchant_lord_harbor_01: "The Port of Khefrem"
 building_type_merchant_lord_harbor_01_desc: "The port of Abah's Landing flourishes under the sway of the Crown ruling class. A mixture of autonomous oversight and a firm guard structure, the Port of Khefrem as it is now usually called rivals the prominence of the port of Anvil in the Abecean. Silks from Taneth, wine from Skingrad, and even leather from Silvenar all make it's way to the port of Abah's Landing."
 building_merchant_lord_harbor_01: "Merchant Lords' Harbour"
 building_merchant_lord_harbor_01_desc: "Once called the 'Jewel of Khefrem', the lucrative trade routes of Abah's Landing around the Abecean Sea became mired in the autonomy and freedom the city was given by the provincial powers that tried to rule over it. Now, the so-called Merchant Lords rule over the port and control its trade -- self-styled magnates who grow fat and wealthy from both the vast amount of commerce that the port sees and the underbelly that festered in the shadow of unsupervised autonomy given to the city. Smugglers, pirates, and every other sort of criminals are at home in the port of Abah's Landing."
 building_merchant_lord_harbor_02: "$building_type_merchant_lord_harbor_01$"
 building_merchant_lord_harbor_02_desc: "$building_type_merchant_lord_harbor_01_desc$"
 is_crown_under_crown: "Your [culture|E] has [GetCultureTradition('tradition_crown_core').GetName|V] [tradition|E] and your liege holds [GetTitleByKey('e_crown').GetName] or [GetTitleByKey('e_hammerfell').GetName] [title|E]"

 building_type_temple_of_onsi_01: "Temple of Onsi"
 building_type_temple_of_onsi_01_desc: "In the south-western section of the city of Rihad stands an arena of great size, built all the way back in the First Era by the Forebear King Nihat the Reverent. One of the most curious thing about the Rihad Arena is that it also serves as the largest and most popular temple to the Yoku god Onsi, the Boneshaver. Every time a battle was about to begin, the announcer would proclaim a prayer to the god of blades. Every clash of steel, every spell flung, every arrow nocked is a prayer to the Boneshaver."
 building_temple_of_onsi_01: "$building_type_temple_of_onsi_01$"
 building_temple_of_onsi_01_desc: "$building_type_temple_of_onsi_01_desc$"

 building_type_satakalaam_necropolis_01: "Satakalaam Necropolis"
 building_type_satakalaam_necropolis_01_desc: "The Necropolis of Satakalaam is home to the tombs of Redguard families tracing their descent back to ancient Yokuda. The stories of their exploits can be seen on the murals of the countless tombs in the necropolis; tales of sword-singing warriors splitting serpent-demons, of the fabled ancestors, and of the last of dreaded serpent spirit hewn in three parts and sealed inside the deepest and most ancient of the tombs."
 building_satakalaam_necropolis_01: "$building_type_satakalaam_necropolis_01$"
 building_satakalaam_necropolis_01_desc: "$building_type_satakalaam_necropolis_01_desc$"

 building_type_gilane_assembly_01: "Assemblage of Gilane"
 building_type_gilane_assembly_01_desc: "The city of Gilane is well known for it's massive glassworks industry, one that spanned an entire section of the city. This industry fuels not just the city's economy, but the very heart of the city's ruling class. The Crowns of Gilane assemble and decide the city and their domain's decision in the Assemblage of Gilane, a parliament of noble Crowns and wealthy glassmakers that all but rules the city. The parliament building itself is a testament to skills of the city's glassworks, being almost entirely built out of shining glass and shimmering quartz. In a bright day, the sun would shine down and highlight the stained windows of the assemblage building where storied tales of the Na-Totambu are etched and drawn."
 building_gilane_assembly_01: "$building_type_gilane_assembly_01$"
 building_gilane_assembly_01_desc: "$building_type_gilane_assembly_01_desc$"

 building_type_hunding_statue_01: "Statue of Frandar Hunding"
 building_type_hunding_statue_01_desc: "This grand statue of Frandar Hunding stands tall, overlooking the busy and bustling harbors of Port Hunding. Local [Glossary( 'Na-Totambu', 'NATOTAMBU_GLOSS' )] and [Glossary( 'Ra Gada', 'RAGADA_GLOSS' )] both honor the great Redguard hero, who made way for their ancestors in Hammerfell and, more specifically, liberated this island from goblins. In the eyes of the modern Crown populace, the statue of Hunding takes a new meaning - a warrior who stands firm and has fulfilled his role, yet stayed his blade down and rested his ambitions. A warrior's ilk is to fight with blade in hand, yet to stand down in the face of his betters."
 building_hunding_statue_01: "$building_type_hunding_statue_01$"
 building_hunding_statue_01_desc: "$building_type_hunding_statue_01_desc$"

 building_type_herne_palace_01: "Palace of Six Domes"
 building_type_herne_palace_01_desc: "The Palace of Six Domes might be the greatest vista on the island of Herne. In the distant past, it was the home to the six most powerful [Glossary( 'Na-Totambu', 'NATOTAMBU_GLOSS' )] families that sailed in the wake of the Ra Gada. Built upon a tall cliff, the palace is an example of pre-Tamrielic Yoku architecture that still stands today. Clean cut nephrite were the materials used in the main construction of the palace, with the famed six domes being entirely made out of a mix of jade and an odd black stone native to Herne. In the modern day the palace still stands as a sign of the everlasting nature of the descendants of the noble and proud Na-Totambu."
 building_herne_palace_01: "$building_type_herne_palace_01$"
 building_herne_palace_01_desc: "$building_type_herne_palace_01_desc$"

 building_type_volenfell_01: "The Bells of Volen"
 building_type_volenfell_01_desc: "The masterwork of the Dwemer clan Rourken, unfinished and time-corroded, suspended within the hollowed-out mountain above their capital. Sixteen-and-ten bells, the smallest the size of a castle, cast in an alloy found nowhere else on Tamriel. If struck, these bells could bring down the entire mountain and make the rest of Hammerfell feel it — but that cannot be their intended purpose."
 building_volenfell_01: "$building_type_volenfell_01$"
 building_volenfell_01_desc: "$building_type_volenfell_01_desc$"

 building_type_hollow_faced_01: "Hollow-Faced Mastaba"
 building_type_hollow_faced_01_desc: "Belying the stunning beauty of the natural oasis, Nohotogrha is home to several curious landmarks that hides in plain view. The most infamous of these landmark is the Hollow-Faced Mastaba, an unassuming tomb resting near the western shores of the oasis that depicts mysterious faceless serpentine figures upon it's walls. Travellers and caravans alike reports odd and frightening sightings of figures lurking in the night as they rested in Nohotogrha, watching them from afar yet disappearing from periphery once one realises they were watched."
 building_hollow_faced_01: "$building_type_hollow_faced_01$"
 building_hollow_faced_01_desc: "$building_type_hollow_faced_01_desc$"
 building_hollow_faced_02: "$building_type_hollow_faced_01$"
 building_hollow_faced_02_desc: "Further excavations and reparations within the Hollow-Faced Mastaba revealed disturbing yet curious insights. The tomb is supposed to be the final resting place of extinct sect of Satakal-worshipping people called the Toghra-Ket, the 'Hollow-Faces'. Etched in some of the deepest recesses of the tomb are the tales of the Toghra-Ket, how they emulated the 'serpent spirits' by devouring their magicks and flesh, gaining the frightful ability to peel back their skin and flesh. The sepulchre of these ancient people even reveal some of their methods, allowing some mages to try and emulate their stomach-churning magickal practices."

 building_type_scourg_barrow_01: "Scourg Barrow"
 building_type_scourg_barrow_01_desc: "In the depths of the Dragontails, a hall of darkness and profane magicks was carved out to house the grand ambitions of the Worm Cult. On the surface, Scourg Barrow is nothing but a weather-worn edifice that is built on an almost inhospitable mountain. Yet when one enters its halls the truth becomes clear as day, shambling undead roams the cavernous lair freely and necromancers of all sorts calls it sanctuary.\n\nThe innermost part of the Barrow houses the infamous Hall of the Necromancers, the sanctum of the Worm Cult and its hallowed leader. Upon a raised dais made from black stone supplicants would disrobe and prostrate before the Ascendant's feet. The anchorites would study in depth the recesses of soul magicks, entwining their knowledge of anatomy to create fouler forms of undead at the behest of the King of Worms."
 building_scourg_barrow_01: "$building_type_scourg_barrow_01$"
 building_scourg_barrow_01_desc: "$building_type_scourg_barrow_01_desc$"

 building_type_elinhir_observatory_01: "Elinhir Observatory"
 building_type_elinhir_observatory_01_desc: "The observatory in Elinhir is the oldest in Hammerfell, personally used by the High Oracle and the noblest of Na-Totambu. They look upon the stars in attempts to read the Redguards' fate and to find Ruptga's way to the Far Shores."
 building_elinhir_observatory_01: "$building_type_elinhir_observatory_01$"
 building_elinhir_observatory_01_desc: "$building_type_elinhir_observatory_01_desc$"

#Yokuda special buildings
 building_type_noghalo_cowry_pools_01: "Noghalo Cowry Pools"
 building_type_noghalo_cowry_pools_01_desc: "Once upon a time, Samara was known as the breadbasket of the north. When the ruin came and blighted the isle, the Yoku would not allow their home to die - spending generations nurturing a recovering ecosystem. Now, the shallow pools have been turned into coastal farms of gleaming cowries - famed throughout Yokuda for their sheen and beauty."
 building_noghalo_cowry_pools_01: "$building_type_noghalo_cowry_pools_01$"
 building_noghalo_cowry_pools_01_desc: "$building_type_noghalo_cowry_pools_01_desc$"

 building_type_ansu_gurleht_temple_01: "Temple of the Ansu-Gurleht"
 building_type_ansu_gurleht_temple_01_desc: "The Temple of the Circle Talker is a bizarre place that even the most esoteric scholars of Yoku myths cannot make sense of to a great degree. The inscriptions and bas-reliefs tell of a strange other called Ansu-Gurleht, the Circle Talker and the God Who Makes Us Women. Yoku priests and faithful do not pay homage to this Ansu-Gurleht, yet still they clean and maintain the temple grounds as dictated by the fear and reverence it seems to instill in the locals."
 building_ansu_gurleht_temple_01: "$building_type_ansu_gurleht_temple_01$"
 building_ansu_gurleht_temple_01_desc: "$building_type_ansu_gurleht_temple_01_desc$"

 building_type_conclave_zawru_hun_01: "Conclave of Zawru Hun"
 building_type_conclave_zawru_hun_01_desc: "Some scholars seek not only to record their cherished present, but too to build upon the legacy of a revered past. This is the purpose of the Conclave of Zawru Hun, whose initiates work tirelessly to recover the knowledge of old Yokuda so that its misuse may never be repeated."
 building_conclave_zawru_hun_01: "$building_type_conclave_zawru_hun_01$"
 building_conclave_zawru_hun_01_desc: "$building_type_conclave_zawru_hun_01_desc$"

#Morrowind special buildings
 building_type_temple_quill_gavel_01: "Temple of the Quill and Gavel"
 building_type_temple_quill_gavel_01_desc: "The Temple of the Quill and Gavel has long been a site of pilgrimage and a house of learning. It was built on the site where St. Olms the Just tried and repented the twenty-three vagabonds, and even to this day the spot where he had lain down his blade can be seen and still visited by the faithful."
 building_temple_quill_gavel_01: "$building_type_temple_quill_gavel_01$"
 building_temple_quill_gavel_01_desc: "$building_type_temple_quill_gavel_01_desc$"

 building_type_mala_tor_01: "Mala Tor"
 building_type_mala_tor_01_desc: "Mala Tor was built by the Ayleids at the easternmost border of their Imperatum to pacify the scar-covered eastern nomads. Since the destruction of the Imperatum Saliache, this foreboding, elegant spire has changed hands between the Imperial heirs to the Heartland, who long sought to use it as a garrison of the East, and the native Dunmeri, who have made it a bulwark against Imperial encroachment upon their lands."
 building_mala_tor_01: "$building_type_mala_tor_01$"
 building_mala_tor_01_desc: "$building_type_mala_tor_01_desc$"

 building_type_under_skar_01: "Under Skar"
 building_type_under_skar_01_desc: "The mighty Skar was once the greatest of the emperor crabs, who ruled Vvardenfell in ages long lost. Skar alone avoided his species' degeneration into the feeble mudcrab, meeting an honourable end at the speartips of a united Ashlander host instead. Now his massive shell houses a neutral meeting ground for the tribes, reminding them of the great deeds they may accomplish, if they stand united. Legends tell that Skar will, in the time of Morrowind's greatest need, rise up to stand with the Ashlanders in a fierce and final battle."
 building_under_skar_01: "$building_type_under_skar_01$"
 building_under_skar_01_desc: "$building_type_under_skar_01_desc$"

 building_type_othrenis_01: "Othrenis Necropolis"
 building_type_othrenis_01_desc: "During the [Glossary( 'First Era', 'FIRST_ERA_GLOSS' )], this necropolis was created to inter a group of mages from Vvardenfell that were sent to seal away the Brothers of Strife, two hulking Bone Colossi that wreaked havoc across the land, slaughtering both Chimer and Nede alike. Not just the men, but the women and children too."
 building_othrenis_01: "Othrenis Necropolis"
 building_othrenis_01_desc: "$building_type_othrenis_01_desc$"

 building_type_almas_thir_01: "Almas Thir"
 building_type_almas_thir_01_desc: "The great canton of Almas Thir joins the banks of the river Thir at the site of Veloth's crossing. In all but appearance, it's a traditional Velothi temple-fortress whose bridgeways are swarming with pilgrims walking the path of the Prophet, and whose walls cannot be scaled by the enemy. In this more peaceful era, however, Almas Thir functions as a glorified tollhouse, extracting payment from merchants to cross or raise its bridges."
 building_almas_thir_01: "$building_type_almas_thir_01$"
 building_almas_thir_01_desc: "$building_type_almas_thir_01_desc$"

 building_type_necrom_necropolis_01: "City of the Dead"
 building_type_necrom_necropolis_01_desc: "At the heart of Necrom’s winding marble causeways lies the City of the Dead – the largest necropolis in all of Morrowind and the center of Dunmeri ancestor worship. Beneath the city’s busy streets is an ever-expanding network of catacombs that house the honored dead, who have found their eternal rest in the care of the Keepers of the Dead. Both the living and the dead call Necrom home, filling the vibrant causeways in a constant flow that never ceases."
 building_necrom_necropolis_01: "$building_type_necrom_necropolis_01$"
 building_necrom_necropolis_01_desc: "$building_type_necrom_necropolis_01_desc$"

 building_type_gorne_asylum_01: "Gorne Asylum"
 building_type_gorne_asylum_01_desc: "The entire island of Gorne holds a rather grim history. Following the War of the [Glossary( 'First Council', 'FIRST_COUNCIL_GLOSS' )], numerous loyalists of the Sixth House were brought here for interrogation, imprisonment, and ultimately execution.\n\nOnce it lost its usefulness for that purpose, the facility was rebuilt into an asylum for those who had fractured their minds during the study of the arcane. While it primarily houses mentally unstable sons and daughters of the mighty House Telvanni now, rumors suggest that not everyone sent to this island is truly insane. It may also function as a place to incarcerate political rivals and other inconvenient individuals.\n\nIn the end, the distinction becomes irrelevant, as anyone who arrives at the Gorne Asylum not mad is destined to become so soon." #EK TODO: check if AI
 building_gorne_asylum_01: "$building_type_gorne_asylum_01$"
 building_gorne_asylum_01_desc: "$building_type_gorne_asylum_01_desc$"

 building_type_odai_tradeport_01: "Odai Tradeport"
 building_type_odai_tradeport_01_desc: "The Odai River provides a direct link from the Inner Sea to Balmora, leading to the city's port becoming a primary gateway for goods flowing between the island and the mainland."
 building_odai_tradeport_01: "$building_type_odai_tradeport_01$"
 building_odai_tradeport_01_desc: "$building_type_odai_tradeport_01_desc$"

 building_type_ald_mirathi_01: "Ald Mirathi Shrine"
 building_type_ald_mirathi_01_desc: "This shrine built in honor of the [Glossary( 'Daedric Prince', 'DAEDRA_GLOSS' )] of Destruction, Mehrunes Dagon, stands upon Lake Boethiah's shores since time immemorial."
 building_ald_mirathi_01: "$building_type_ald_mirathi_01$"
 building_ald_mirathi_01_desc: "$building_type_ald_mirathi_01_desc$" 
 special_building_mehrunes: "Holder [faith|E] must have Mehrunes Dagon in its [pantheon|E]"

 building_type_parliament_of_bugs_01: "Parliament of Bugs"
 building_type_parliament_of_bugs_01_desc: "This tower — if it is a tower — resembles a gigantic mushroom planted deep in a crater and rising high to the skies. Those who brave the crater's slopes will find no door, and those who scale the walls will find no windows: there is not a single entrance beneath the shade of the mushroom's canopy. Nonetheless, this tremendous spire is where the Telvanni sorceror-lords hold their great councils.\n\nSomewhere within, the lords and their Mouths hover in airborne debate. The air practically palpitates with their magicks — and trembles with their treachery."
 building_parliament_of_bugs_01: "$building_type_parliament_of_bugs_01$"
 building_parliament_of_bugs_01_desc: "$building_type_parliament_of_bugs_01_desc$"
 parliament_of_bugs_requirement: "You or your [liege|E] must hold [GetTitleByKey('k_telvanni').GetName] [title|E]"

 building_type_kragen_zel_01: "Kragen-Zel"
 building_type_kragen_zel_01_desc: "The Kragen, a particularly crafty and wily clan even among the Dwarves, were one of the lesser Houses comprising the lost House Dwemer. They rejected the rule of Indoril Nerevar and the law of the First Council, and left Morrowind for the frigid and barbarous north. This rusted-over ruin was once their capital, and though the Dunmer chose to forget its many brass blasphemies, there is still much to pilfer within its corpse."
 building_kragen_zel_01: "$building_type_kragen_zel_01$"
 building_kragen_zel_01_desc: "$building_type_kragen_zel_01_desc$"

 building_type_tear_slave_nexus_01: "Slave Nexus"
 building_type_tear_slave_nexus_01_desc: "Tear is the ugly beating heart of Tamrielic slave trade with the single largest slave market in the world. Every day, tens of thousands souls are sold and bought in the open air markets with cold efficiency, and taken away to grease the cogs of Morrowind with their blood.\n\nAny kind of slave for any kind of task can be found here. The countless slaver companies of House Dres pillage every sea, have cells in every major city, and will never shy away from raiding entire villages into slavery. As long as Tear stands, no outlander is really safe from becoming merchandise of some Dunmer lord."
 building_tear_slave_nexus_01: "$building_type_tear_slave_nexus_01$"
 building_tear_slave_nexus_01_desc: "$building_type_tear_slave_nexus_01_desc$"

 building_type_telvannis_undercity_01: "Telvannis Undercity"
 building_type_telvannis_undercity_01_desc: "There is no ground level in Port Telvannis. So ancient and numerous and large are the towers of Telvannis that the growing layers of their twisting roots choke and perforate the earth. In these hollows and tunnels is a lightless, sprawling place called the Undercity, and it's home to the common folk of the Telvanni capital.\n\nLawless, labyrinthine, often cramped, illuminated by fungus and magelight, the Undercity may be mistaken for a slum, and in many ways it is. However, it is also shockingly diverse: housing all the rejects of the world, from Altmer dissidents to failed Imperial pretender-kings; and shockingly productive. The locals have things and services in store that are either unthinkable or deeply illegal in the outside world."
 building_telvannis_undercity_01: "$building_type_telvannis_undercity_01$"
 building_telvannis_undercity_01_desc: "$building_type_telvannis_undercity_01_desc$"

 building_type_dust_adeptorium_01: "Dust Adeptorium"
 building_type_dust_adeptorium_01_desc: "There is a reason as to why the northern Telvanni Peninsula is sparsely inhabited, as only the hardiest people would stay in the dust-choked ashlands. The Hive Council braved these tormented lands, where ash storms choked even the stubbornest of life. Built on top of a sand-gashed mesa, the Dust Adeptorium studies the secrets of the roiling ash and the howling winds. Cloaked in heavy woven robes and carapace-masks, the Dust Adepts traverse through the ashlands with spells that preserves moisture and humidity. When a storm rages through the Hive Council, the Dust Adeptorium opens its gates for the hardiest students to brave into."
 building_dust_adeptorium_01: "$building_type_dust_adeptorium_01$"
 building_dust_adeptorium_01_desc: "$building_type_dust_adeptorium_01_desc$"

 building_type_kogoruhn_citadel_01: "Ashplagued Ruins"
 building_type_kogoruhn_citadel_01_desc: "Long ago, before there was a Council of Morrowind, the Houses built strongholds across Vvardenfell to defend against Nord incursions, but the protection of the Three Living Gods rendered these strongholds obsolete and they have fallen into disrepair. Kogoruhn was the ancient stronghold of the Sixth House, the House Unmourned, Great House Dagoth, scrubbed from memory and left to drown in the lone and level ash."
 building_kogoruhn_citadel_01: "$building_type_kogoruhn_citadel_01$"
 building_kogoruhn_citadel_01_desc: "$building_type_kogoruhn_citadel_01_desc$"

 building_type_kogoruhn_citadel_02: "Kogoruhn Citadel"
 building_type_kogoruhn_citadel_02_desc: "Blessed with Scarab Blood and blessed by Scarab Blood, Kogoruhn rises as it once did under the Dagoth banner, before the Foul Murder and the False Gods turned the Dunmer astray. The Sixth House and its allies may bide their time in this cloistered citadel until the Sleeper wakes and sets Morrowind free from its long, restless nightmare."
 building_kogoruhn_citadel_02: "$building_type_kogoruhn_citadel_02$"
 building_kogoruhn_citadel_02_desc: "$building_type_kogoruhn_citadel_02_desc$"

 building_type_mournhold_palace_01: "City of Mournhold"
 building_type_mournhold_palace_01_desc: "Mournhold, the capital of Morrowind, is home to Great Mother Almalexia and is the ancestral seat of House Indoril, staunch supporters of the Tribunal Temple. The immense bureaucratic burden of overseeing the lands of both the Temple and the Great Houses turns Mournhold into the only place in Morrowind where courthouses stand tall in the same height as the temples and the homes of nobles, where priests sing more verdicts than prayers, and where Ordinators wield quills more expertly than their swords."
 building_mournhold_palace_01: "$building_type_mournhold_palace_01$"
 building_mournhold_palace_01_desc: "$building_type_mournhold_palace_01_desc$"

 building_type_lichen_fields_01: "Lichen Fields"
 building_type_lichen_fields_01_desc: "Despite the name, the Lichen Fields grow mostly saltrice, but quantities that humble the rice paddies of the Niben. Even though the Lichen Fields have been cleared and planted only some hundred years ago, being entrusted with the Lichen Fields manor has become something of a vaunted honour House Dres enjoys bestowing upon its most ruthless and ambitious members. Perhaps the sad reason behind this lies in the unique workforce situation: the Lichen Fields owe their impressive output not only to the fertile Tearmarsh soil, but also to scores of Argonian and Khajiit slaves, who toil in the knee-deep bracken waters..."
 building_lichen_fields_01: "$building_type_lichen_fields_01$"
 building_lichen_fields_01_desc: "$building_type_lichen_fields_01_desc$"

 building_type_rootspire_01: "The Rootspire"
 building_type_rootspire_01_desc: "Massive even by the standards of the Great Houses, the council hall where House Redoran convenes resembles nothing more than a fortress, save perhaps a giant corkbulb rising against the ash-riddled skies. Immodest in its dimensions, it nevertheless remains a largely unadorned building in accord with the Gah-Julani architectural and moral standards, though some cannot help but point out that the Grand Council itself could be accomodated twice over in the Rootspire."
 building_rootspire_01: "$building_type_rootspire_01$"
 building_rootspire_01_desc: "$building_type_rootspire_01_desc$"

 building_type_plaza_brindisi_dorom_01: "Plaza Brindisi Dorom"
 building_type_plaza_brindisi_dorom_01_desc: "This portion of Almalexia is dedicated to its ruler, High Councillor Brindisi Dorom, who perished in the Mehrunes Dagon's assault on the city. As a centrepiece, a colossal statue depicting Almalexia's decisive blow against Dagon stands amongst the canals and well-tended parks."
 building_plaza_brindisi_dorom_01: "$building_type_plaza_brindisi_dorom_01$"
 building_plaza_brindisi_dorom_01_desc: "$building_type_plaza_brindisi_dorom_01_desc$"

 building_type_almalexia_temple_01: "High Chapel of Almalexia"
 building_type_almalexia_temple_01_desc: "The High Chapel of Almalexia towers over every other building in the city of Mournhold, higher even than the Palace of the High Councillor and the Mansion of the Grandmaster. Almalexia's Hands, the Ordinator order sworn to the goddess personally, spend day and night shepherding the faithful pilgrims desperate for an audience with the merciful form of Mother Morrowind. The sick, the needy, the lost, all flock into the High Chapel looking for the life-giving embrace of Almalexia."
 building_almalexia_temple_01: "$building_type_almalexia_temple_01$"
 building_almalexia_temple_01_desc: "$building_type_almalexia_temple_01_desc$"

 building_type_clockwork_lake_01: "Clockwork Lake"
 building_type_clockwork_lake_01_desc: "The Clockwork City was once a bastion of industry and learning in the lands of Morrowind built by the god-king Sotha Sil, yet its disappearance has baffled even the most cunning of mages and scholars. Leaving a water-filled crater behind from the vanishing, the lake often shores up odd mechanical contraptions and misshapen creatures. The Temple advises that any pilgrims and faithful who approach to stay in the guarded paths and not linger too long on the lake's shores." 
 building_clockwork_lake_01: "$building_type_clockwork_lake_01$"
 building_clockwork_lake_01_desc: "$building_type_clockwork_lake_01_desc$"

 building_type_kemel_ze_01: "Clockwork Probabilis"
 building_type_kemel_ze_01_desc: "Built into the site of a great cliff and featuring a vast network of underwater facilities, Kemel-Ze stands as one of the most impressive ruins the Dwemer ever left before their mysterious disappearance. It is also well-preserved and extensively studied, as a portion of this city was granted to Sotha Sil by the Dwemer themselves while they still inhabited it.\n\nSotha Sil named his section of the city the Clockwork Probabilis, where he layed the foundation for what would later become his most ambitious project - the Clockwork City.\n\nThough the god and the Dwemer have long departed, Kemel-Ze still offers boundless opportunities for advanced research in every conceivable field and is visited by scholars from all over Tamriel."
 building_kemel_ze_01: "$building_type_kemel_ze_01$"
 building_kemel_ze_01_desc: "$building_type_kemel_ze_01_desc$"

 building_type_amaya_vineyard_01: "Amayan Fields"
 building_type_amaya_vineyard_01_desc: "Caressed by the tranquility of Lake Amaya's shores with tender care, this fertile ground blossoms, promising a prosperous future for this esteemed estate in Vvardenfell."
 building_amaya_vineyard_01: "Amayan Fields"
 building_amaya_vineyard_01_desc: "$building_type_amaya_vineyard_01_desc$"
 building_type_amaya_vineyard_02: "Amayan Vineyards"
 building_type_amaya_vineyard_02_desc: "Caressed by the tranquility of Lake Amaya's shores with tender care, this fertile ground blossoms, promising a prosperous future for this esteemed estate in Vvardenfell."
 building_amaya_vineyard_02: "Amayan Vineyards"
 building_amaya_vineyard_02_desc: "$building_type_amaya_vineyard_02_desc$"

 building_type_the_crimson_valley_01: "The Crimson Valley"
 building_type_the_crimson_valley_01_desc: "The Crimson Valley, a foreboding stronghold of Malahk Orcs, is drenched in blood from ritual sacrifices to their Daedric god-king Malahk. This land, both sacred and cursed, is stained deep red, with towering old fortresses looming over pools of blood.\n\nWith such a grim reputation, invaders seeking to purge this dark realm face fierce resistance, facing Orcs unrelenting fury in brutal defense of their sacrificial sanctuaries."
 building_the_crimson_valley_01: "$building_type_the_crimson_valley_01$"
 building_the_crimson_valley_01_desc: "$building_type_the_crimson_valley_01_desc$"

 building_type_subo_lathla_skyport_01: "Subo-Lathla Skyport"
 building_type_subo_lathla_skyport_01_desc: "Subo-Lathla is the greatest Sload skyport of the east and of all Tamriel; here, the Dunmer bargain freely and ruthlessly with the inhabitants of Thras. The #italic worms#! sell both their goods and secrets, over which the elf lords compete endlessly."
 building_subo_lathla_skyport_01: "$building_type_subo_lathla_skyport_01$"
 building_subo_lathla_skyport_01_desc: "$building_type_subo_lathla_skyport_01_desc$"

 building_type_narsis_bazaar_01: "Grand Bazaar"
 building_type_narsis_bazaar_01_desc: "The Grand Bazaar of Narsis has been the largest market and the primary source of foreign goods in Resdayn since the time of the [Glossary( 'First Council', 'FIRST_COUNCIL_GLOSS' )]."
 building_narsis_bazaar_01: "$building_type_narsis_bazaar_01$"
 building_narsis_bazaar_01_desc: "$building_type_narsis_bazaar_01_desc$"


