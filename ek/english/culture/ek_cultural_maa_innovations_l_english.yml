 ### Military
 # Aldmeris
 innovation_eton_nir_gryphon_riders: "Eton Nir Gryphon Riders"
 innovation_eton_nir_gryphon_riders_desc: "Historically, there have only ever been four Welkynar at a time. The Unification Wars and our ambitions on Tamriel, however, have necessitated a significant increase in the number of these gryphon knights, and their deployment outside of the isles."
 # Argonian
 innovation_black_marsh_materials: "Black Marsh Materials"
 innovation_black_marsh_materials_desc: "Flint and bone, hackwing feathers and volcanic glass, bog iron and brass, all these and more can be found in Black Marsh. Perhaps the armors we create from such disparate materials cannot rival steel plate, but wherever our warrios fight, it is Black Marsh itself that armors them."
 # Bosmeris
 # Chimeris
 # Dunmeris
 innovation_guar: "Guar Breeding"
 innovation_guar_desc: "Guars are the primary domesticated herd animals of Morrowind and Black Marsh, and are often raised as pack animals, beasts of burden and providers of hide, eggs and meat. Their more aggresive cousins, the Kagouti, are used as war mounts."
 # Falmeris
 innovation_crag_warfare: "Crag Warfare"
 innovation_crag_warfare_desc: "For decades we fought against our tyrant overlords for control of the underground. When they were no more, we were free of our bonds and could make our homes in this subterranean world. There we lived, prospered - and fought, a neverending fight for survival."
 # Orcish

