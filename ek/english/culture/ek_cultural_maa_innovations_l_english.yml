# Riekling
 innovation_bristleback_taming: "Bristleback Taming"
 innovation_bristleback_taming_desc: "The robust bristlebacks roaming the snowy plains of northern Tamriel prove to be surprisingly adept steeds when properly tamed. Their sturdiness and toughness make them particularly well-suited for the harsh climate of our own homeland."
# Riekr
# Goblin
 innovation_durzog_breeding: "Durzog Breeding"
 innovation_durzog_breeding_desc: "Most individuals tend to avoid Durzogs due to their repulsive appearance and carnivorous hunting behavior. However, it's worth noting that these creatures possess remarkable intelligence, making them capable of being trained as formidable war beasts."

