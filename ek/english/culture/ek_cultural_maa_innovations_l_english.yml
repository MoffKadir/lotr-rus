 # Khajiit 
 innovation_lunar_lattice: "Lunar Lattice"
 innovation_lunar_lattice_desc: "Eons ago we were forced to live shapeless, constantly changing and never assuming a stable form. We have then been tied to the Moons, so that our people's form depends on the cycle of Masser and Secunda."
 unlocks_other_maa_innovations: "Automatically unlocks other Khajiiti army innovations when the regular innovation is researched"
 replaces_innovation_basic_armor_forging: "#I This [innovation|E] replaces $innovation_basic_armor_forging$#!"
 innovation_unlocked_by_innovation_lunar_lattice: "Is unlocked with the $innovation_lunar_lattice$ [innovation|E]"

 innovation_lunar_mysteries: "Lunar Mysteries"
 innovation_lunar_mysteries_desc: "Not only does the Lunar Lattice determine our physcial form, it also opens a path to lost and eminent secrets. If we decipher the movements of the moons and follow their path we can reach deeper into the arcane and even share this knowledge with our children."
 
 innovation_alfiq: "Alfiq Training"
 innovation_alfiq_desc: "We are bound to the Moons, and our physiology is deeply tied to their form when we are born. The smallest of us, the Alfiq, are predisposed to the magical arts, and can support our warriors either in the backline, or by sitting in a shoulder harness worn by our largest warriors."
 
 innovation_pahmar: "Pahmar Training"
 innovation_pahmar_desc: "We are bound to the Moons, and our physiology is deeply tied to their form when we are born. The largest of the two-legged forms, the Pahmar can easily wear even the heaviest armor and wield the biggest weapons. They will be great on the battlefield, charging the enemy frontline and paving the way for their smaller brethren."
 innovation_unlocked_by_innovation_quilted_armor: "Is unlocked with the $innovation_quilted_armor$ [innovation|E]"
 
 innovation_senche_raht: "Senche-Raht Training"
 innovation_senche_raht_desc: "We are bound to the Moons, and our physiology is deeply tied to their form when we are born. Some of us, the Senche-Raht, are capable of charging the enemy lines on four feet, and are strong enough to carry a regular-sized soldier on their back. We should integrate them into our armies."
 innovation_unlocked_by_innovation_arched_saddle: "Is unlocked with the $innovation_arched_saddle$ [innovation|E]"

 