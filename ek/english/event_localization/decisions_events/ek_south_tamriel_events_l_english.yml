 south_tamriel.0001.t: "The Light of Arnesia"
 south_tamriel.0001.desc: "Ah, Arnesia - the mighty fortress-kingdom of the Cantemirics!\n\nFounded in the spot where the wise Oracle Cantemir allegedly reached enlightenment and gained true knowledge of the Endeavour from her Hist teachers, it served as a safe haven in an inhospitable land - alongside its sister cities of Archon and Thorn a true sanctuary from the trials of Mundus. Here the fortunes of the Cantemiric clans ebbed and flowed, never sinking beneath the waves.\n\nIn the wake of a slow decline, the Velothi have again surged forth under the lead of [ROOT.Char.GetFullNameNicknamedNoTooltip]. Sweeping away all opposition within and without, [ROOT.Char.GetSheHe] has annexed all lands south of the fortress until Archon, restoring the long lost Kingdom of Arnesia.\n\Kothri, Argonians and perhaps more shall see that Cantemiric walls stand strong, in stone and in faith."
 south_tamriel.0001.a: "Arnesia my beloved..."
 
 south_tamriel.0011.t: "The Marshes of Tear"
 south_tamriel.0011.desc: "After countless raids and wars started by the people occuping Tearmarsh, the region has been brought under our control.\nOur administration has worked tirelessly to integrate Tearmarsh, and its people and ruling class now call the Black Marsh their home."
 south_tamriel.0011.a: "No more raids and no more wars."

# it's a very simple event with simple desc, not gonna bother making too unique descs for it
 south_tamriel.0012.t: "The Marshes of Tear"
 south_tamriel.0012.desc: "After countless raids and wars started by the people occuping Tearmarsh, the region has been brought under our control.\nOur administration has worked tirelessly to integrate Tearmarsh, and its people and ruling class now call Cantemiris their home."
 south_tamriel.0012.a: "No more raids and no more wars."

 south_tamriel.0013.t: "The Marshes of Tear"
 south_tamriel.0013.desc: "After expunging the invaders, the region has been brought back under our control.\n Now our administration must work tirelessly to reintegrate Tearmarsh, undoing the damage caused to the hearts and minds of its people."
 south_tamriel.0013.a: "Justice!"

 south_tamriel.0014.t: "A New Tribe"
 south_tamriel.0014.desc: "Our kind has found a meticulous adversary in those men from the west who fought us for this land for centuries. We found no peace in cutting one another down forever, but in doing so we fell to their trappings of commerce and hierarchy.\n\nIt might be that the only way to beat this adversary is to become like them. Change and adaptation is the nature of our people, and here is a rare chance to give it direction."
 south_tamriel.0014.option.1: "The city magocrats have law and wisdom to consider."
 south_tamriel.0014.option.1.tooltip: "The [ojel_culture.GetName] [culture|E] gains the [GetCultureTradition('tradition_imperial_battlemages').GetName] [tradition|E]"
 south_tamriel.0014.option.2: "The rural mysticism is closer to our spirit."
 south_tamriel.0014.option.2.tooltip: "The [ojel_culture.GetName] [culture|E] gains the [GetCultureTradition('tradition_ut_nibenu_folklore').GetName] [tradition|E]"
 south_tamriel.0014.option.3: "Our new tribe shall develop naturally."