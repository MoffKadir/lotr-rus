l_english:
 form_pirate_confederacy_the_isles_decision: "Form the Pirate Confederacy of the Isles"
 form_pirate_confederacy_the_isles_decision_desc: "The isles of the Abecean Sea are home to scoundrels and freebooters of all stripes. Divided, we are a mere annoyance... But if I can unite us Abecean pirates, I'll be able to launch the boldest raids Tamriel has ever seen!"
 form_pirate_confederacy_the_isles_decision_tooltip: "A powerful pirate could unite the Abecean Sea..."
 form_pirate_confederacy_the_isles_decision_confirm: "Summon the fleets and the raiders!"
 form_pirate_confederacy_the_isles_de_jure_tt: "All [duchies|E] in the region of $mundus_tamriel_pirate_conf_the_isles$ become [de_jure|E] part of the new realm"
 has_raided_for_a_thousand_gold_ct: "You have raided for 1000 [gold|E] (currently at [ROOT.Var('total_loot').GetValue])"
 form_normal_confederacy_the_isles_decision: "Form the Kingdom of the Abecean Isles"
 form_normal_confederacy_the_isles_decision_desc: "The islands of the Abecean Sea are part of the most different kingdoms. But whoever unites them could achieve unimagined dominion over the entire Abecean Sea - and its shores would be ripe for conquest."
 form_normal_confederacy_the_isles_decision_tooltip: "A powerful ruler could unite the Abecean Sea..."
 form_normal_confederacy_the_isles_decision_confirm: "Summon the fleets and the privateers!"

 
 ### Attrebus/Interregnum decisions
 
 attrebus_draft_tsaesci_act_decision: "Pass the Tsaesci Act"
 attrebus_draft_tsaesci_act_decision_desc: "Many of the surviving supporters of the Akaviri Potentate still refuse to recognize me as their Emperor. New measures are needed to combat the dissidents."
 attrebus_draft_tsaesci_act_decision_tooltip: "Combat the Akaviri dissidents"
 attrebus_draft_tsaesci_act_decision_confirm: "Demand their fealty."
 attrebus_draft_tsaesci_act_decision_no_tsaesci_ruler_imperial_isle: "No ruler in the Imperial Isle has the Tsaesci [heritage|E]"
 attrebus_draft_tsaesci_act_decision_effect_desc: "After the Tsaesci Act is enacted, your Akaviri vassals ([GetCulturePillar('heritage_tsaesci').GetName] [heritage|E] [culture|E] or [GetFaithByKey('court_dawnbeauty').GetName] [faith|E]) will have a choice between swearing fealty to you or refusing. If they refuse, you will gain an [imprisonment_reason|E] against them and will be able [banish|E] their kin from the [realm|E]."
  
 ### Orsinium
 create_orsinium_decision: "Reestablish Orsinium"
 create_orsinium_decision_desc: "The Kingdom of Orsinium has been established, razed and reestablished many times in Tamriel's history. A sufficiently powerful Orcish ruler could claim to be the new King of the Orcs and restore the old kingdom of the Pariah Folk. \n \n( #S Note#!: If you're a [duke|E], you'll only be able to expand Orsinium's [de_jure|E] borders within the [de_jure|E] [kingdom|E] you reestablish it in)."
 create_orsinium_decision_tooltip: "Create the Kingdom of Orsinium!"
 create_orsinium_decision_confirm: "For Orsinium!"
 create_orsinium_decision_cd: "Your [capital|E], which must not be inside another [kingdom|E]'s capital duchy, has #V $heritage_orcish_name$#! [heritage|E] [culture|E]"
 create_orsinium_decision_alt_cd: "Your [capital|E] is not located inside another [de_jure|E] [kingdom|E] capital [duchy|E] (for example, the Duchy of The Imperial Isle in the Kingdom of The Heartlands)"
 orsinium_hold_capital_duchy_cd: "You hold the [duchy|E] where your [capital|E] is located"
 orsinium_county_culture_cd: "Your [capital|E] is of your culture"
 create_orsinium_kingdom_decision: "Reestablish Orsinium"
 create_orsinium_kingdom_decision_confirm: "For Orsinium!"
 
 form_orsinium_empire_decision: "Establish Greater Orsinium"
 form_orsinium_empire_decision_desc: "Now that the Kingdom of Orsinium has been reestablished, a better, stronger and greater Orsinium awaits."
 form_orsinium_empire_decision_tooltip: "Make Orsinium great again!"
 form_orsinium_empire_decision_confirm: "For Greater Orsinium!"
 expanded_orsinium_cd: "You have expanded the Kingdom of Orsinium [de_jure|E] borders beyond it's initial [duchy|E]"
 orsinium_kingdom_requirement_cd: "You hold at least 4 [kingdom|E] titles"
 form_orsinium_empire_decision_effect: "Every [kingdom|E] title you [completely_control|E] becomes part of Greater Orsinium"
 
 old_orsinium_capital_decision: "Occupy Old Orsinium"
 old_orsinium_capital_decision_desc: "The original Orsinium, built on the impugnable hills overlooking Shipwreck Bay, was razed countless times by the Breton hordes. It's high time that we reocuppy it as the rightful capital of the Pariah Folk."
 old_orsinium_capital_decision_tooltip: "Move Orsinium's capital back to Old Orsinium"
 old_orsinium_capital_decision_confirm: "Tradition matters!"
 
 expand_orsinium_decision: "Expand Orsinium"
 expand_orsinium_decision_desc: "The frontiers of Orsinium should expand to comprehend all of its former [de_jure|E] [kingdom|E]. Only a strong Orsinium shall be a lasting Orsinium."
 expand_orsinium_decision_tooltip: "Expand the Kingdom of Orsinium!"
 expand_orsinium_decision_confirm: "For Orsinium!"
 expand_orsinium_decision_cd: "You hold Orsinium's original [de_jure|E] [kingdom|E]"
 
 reintegrate_orsinium_decision: "Reintegrate Orsinium"
 reintegrate_orsinium_decision_desc: "One of your duchies has been claimed by the Orcs as their new Orsinium. Just as it has fallen in the past, Orsinium shall fall again and the Pariah Folk disperse."
 reintegrate_orsinium_decision_tooltip: "Decimate pesky Orsinium!"
 reintegrate_orsinium_decision_confirm: "Orsinium is no more!"
 reintegrate_orsinium_decision_cd: "Control Orsinium's capital [duchy|E]"
 no_orsimer_king_vassal_cd: "Orsinium isn't held by an #V $heritage_orcish_name$#! [heritage|E] vassal"
 orsinium_culture_regains_pariah_status: "The [regained_pariah_culture.GetName] culture regains their status as [pariah|E], signified by them regaining the #V Pariah Folk#! [innovation|E]"
 
 ### Nibenay
 establish_new_nibenay_kingdom_decision: "Found a New Kingdom in Nibenay"
 establish_new_nibenay_kingdom_decision_desc: "The territories east of the Niben River are not legally considered part of any Imperial County. While the lords of Nibenay might like to lay claim to it, an ambitious local warlord who united these lands could instead form a new County based in one of the many great cities of the Cis-Niben, certainly a rival to the likes of Leyawiin and Bravil."
 establish_new_nibenay_kingdom_decision_tooltip: "You will create a new [kingdom|E] in eastern Nibenay."
 establish_new_nibenay_kingdom_decision_confirm: "A mere territory no more!"
 establish_new_nibenay_kingdom_decision_ce: "Your will get to select a capital for your new kingdom, which the kingdom will be named after"
 hold_two_duchies: "You hold at least #V 2#! [duchy|E] [titles|E]"
 establish_new_nibenay_kingdom_ct: "You hold more than #V 50%#! of the [de_jure|E] [counties|E] of [GetTitleByKey('k_nibenay').GetName]"

 reclaim_artemon_decision: "Reclaim the Artemon peninsula"
 reclaim_artemon_decision_desc: "While south of the Panther River, the Artemon peninsula was formerly part of the Cis-Niben territory. With the founding of my kingdom, it is time to reclaim this land."
 reclaim_aretemon_decision_tooltip: "You will integrate Artemon into your primary title"
 reclaim_artemon_decision_confirm: "Shoo, away with ye!"
 reclaim_artemon_decision_tooltip: "Make the [duchy|E] of Artemon [de_jure|E] Cis-Niben"
 
 cross_niben_decision: "Secure the eastern Niben bank"
 cross_niben_decision_desc: "Proud Bravil, clinging to the western bank of the Niben River, would do well in securing the eastern bank to fasten its grip on the mouth of the Rumare. It is only right, after all."
 cross_niben_decision_tooltip: "You will lay claim to the eastern bank of the Niben River"
 cross_niben_decision_confirm: "We'll need a ferry service..."

 integrate_nibenay_decision: "Integrate the Cis-Niben Territories"
 integrate_nibenay_decision_desc_bravil: "The lands between the east bank of the Niben River and the Valus Mountains have historically been considered the Imperial Territory of Cis-Niben, not legally part of any Imperial County. This, of course, cannot stand.\n\nWhile not as impressive as glorious Bravil, the lands north of the Panther River are fertile and would be a fine addition to our County."
 integrate_nibenay_decision_desc_leyawiin: "The lands between the east bank of the Niben River and the Valus Mountains have historically been considered the Imperial Territory of Cis-Niben, not legally part of any Imperial County. This, of course, cannot stand.\n\nThe Artemon peninsula south of the Panther River would clearly benefit from integration into County Leyawiin."
 integrate_nibenay_decision_desc_neutral: "The lands between the east bank of the Niben River and the Valus Mountains have historically been considered the Imperial Territory of Cis-Niben, not legally part of any Imperial County. For just as long, both Bravil and Leyawiin have been eyeing opportunities in this area.\n\nAs ruler of these lands, I can divide this territory between them."
 integrate_nibenay_decision_effect: "The [GetTitleByKey('k_nibenay').GetName] will be divided and made [de_jure|E] part of the [GetTitleByKey('k_bravil').GetName] and the [GetTitleByKey('k_leyawiin').GetName]"
 integrate_nibenay_decision_tooltip: "You will integrate parts of the [GetTitleByKey('k_nibenay').GetName] into your primary title"
 integrate_nibenay_decision_confirm: "Expand the borders!"
 integrate_nibenay_bravil_effect_de_jure_tt: "[GetTitleByKey('k_bravil').GetName] becomes [de_jure|E] liege of all duchies in the [region|E] of [GetGeographicalRegion('mundus_tamriel_cyrodiil_cisniben_north').GetName]"

 accept_colovia_nibenay_divide_decision: "The Seat of Sundered Kings"
 accept_colovia_nibenay_divide_decision_desc: "Without an Empire to keep the two halves of [GetTitleByKey('e_cyrodiil').GetNameNoTier] together, perhaps it is best if Colovia and Nibenay once again go their separate ways."
 accept_colovia_nibenay_divide_decision_tooltip: "Divide Cyrodiil into two [de_jure|E] [empires|E]"
 accept_colovia_nibenay_divide_decision_confirm: "A Sundered Land of Sundered Kings"
 accept_colovia_nibenay_divide_decision.colovia_vassals.tt: "All [kingdoms|E] in the [GetGeographicalRegion('mundus_tamriel_cyrodiil_colovia_bruma').GetName] [region|E] will become [de_jure|E] vassals of [GetTitleByKey('e_colovian_estates').GetNameNoTier]"
 accept_colovia_nibenay_divide_decision.nibenay_vassals.tt: "All [kingdoms|E] in the [GetGeographicalRegion('mundus_tamriel_cyrodiil_nibenay').GetName] and [GetGeographicalRegion('mundus_tamriel_cyrodiil_heartlands').GetName] [regions|E] will become [de_jure|E] vassals of [GetTitleByKey('e_nibenay').GetNameNoTier]"
 accept_colovia_nibenay_divide_decision.reunite_cyrodiil.tt: "Rulers of [GetTitleByKey('e_nibenay').GetNameNoTier] or [GetTitleByKey('e_colovian_estates').GetNameNoTier] will be able to attempt to restore the #bold Empire of Cyrodiil#! and destroy other pretenders to the Imperial throne."

 ###Deathlands - high kingdom for Keptu
 restore_deathlands_decision: "Unite Keptu"
 restore_deathlands_decision_desc: "Before the [Glossary( 'Ra Gada', 'RAGADA_GLOSS' )] came, our people were united in a loose confederation of tribes, swearing fealty to the High King in Skyreach. Although it is a distant memory for our people, I could claim to be an heir of that realm by returning our ancient lands."
 restore_deathlands_decision_tooltip: "You will create a new [empire|E] for Keptu"
 restore_deathlands_decision_confirm: "Never again shall we be subjugated!"
 form_nedic_kingdom_scripted_effect_de_jure_tt: "All kingdoms within the [region|E] of [GetGeographicalRegion('ek_nedic_kingdom_region').GetName] will become [de_jure|E] vassals of [nedic_confederation.GetNameNoTier]"