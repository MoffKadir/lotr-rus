### 440
 bm_group_440: "2E 440"
 # Warlord Rising - Cyrodiil
 bm_warlordrising: "Warlord Rising"
 bm_warlordrising_desc: "A decade has passed since the assassination of the Akaviri Potentate and the subsequent collapse of the Second Empire. Yet some remnants of the Potentate still cling to the Imperial City, supported by Nibenese nobility in the East. But in the Colovian West, a new warlord is rising — Attrebus Sosildor. The young king of Chorrol proclaimed his ambitions to reunite the Empire and convinced his Colovian compatriots to support his claim.\n\n#bold Will Attrebus and his allies restore what seems lost, or will the "days and nights of blood and venom" reign?#!"
 bm_warlordrising_attrebus: "$title_general_male$ Attrebus"
 bm_warlordrising_attrebus_subheading: "$title_general_male$ of the Colovian Estates"
 bm_warlordrising_attrebus_desc: "Attrebus, a scion of the royal family of Chorrol, has spent his younger years in the legion, fraternizing with other noble sons and daughters of Colovia and honing his skills at warfare. Since then, he ascended to his mother's throne and proclaimed his ambitions to depose the new Potentate and restore the shattered Empire, rallying like-minded Colovian lords to his side.\n\n#bold The coming war will determine the fate of Tamriel. Will Attrebus fail in his efforts to unite the Cyrodiils, or will a new Empire be born and the Interregnum averted?#!"
 bm_warlordrising_attrebus_alt_vesta: "Lady Vesta"
 bm_warlordrising_aixnieras_ves: "Potentate Aixnieras-Ves"
 bm_warlordrising_aixnieras_ves_subheading: "The Akaviri Potentate"
 bm_warlordrising_aixnieras_ves_desc: "Aixnieras-Ves is a competent administrator from one of the many Akaviri families in the Heartlands. He was chosen by the more pragmatic Nibenese nobles as the new Potentate after Potentate Savirien-Chorak was assassinated. But now an already fragile peace is threatened by a new warlord in the west, who wishes to take the Imperial City and restore the empire to its glory.\n\n#bold Will the Potentate fall and see its authority crumble in Cyrodiil? Or will you defeat the knights of Colovia and forge a new destiny for Tamriel?#!"
 bm_warlordrising_caius: "Duke Caius"
 bm_warlordrising_caius_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_warlordrising_caius_desc: "Caius Lex is a warlord in a tenuous position. To the west, a new self-proclaimed emperor is rising. To the east, the remnants of [Glossary( 'Potentate', 'POTENTATE_GLOSS' )] grasp onto life. Caius knows that his strength could decide the outcome of the war and uses that to keep his independence. But soon, he will need to make a choice.\n\n#bold Will you manage to successfully deal with the powers above you and make sure that your blood will sit on the Ruby Throne?#!"
 bm_warlordrising_humilio: "Governor Humilio"
 bm_warlordrising_humilio_subheading: "Governor of Cheydinhal"
 bm_warlordrising_humilio_desc: "Cheydinhal is the jewel of Upper Nibenay and the seat of House Tharn, blessed with longevity and magical affinity. Unlike other rulers of Cyrodiil, Humilio has resisted the call of warlordism—for now—and remains loyal to the [Glossary( 'Potentate', 'POTENTATE_GLOSS' )] in the Imperial City. \n\n#bold Humilio is in a prime position to build a foundation for his progeny. Will you bide your time and support the Potentate in hopes of rewards, or boldly strike out to become an Overlord of the Nibenay Basin?#!"
 bm_warlordrising_humilio_alt_abnur: "Abnur Tharn"

