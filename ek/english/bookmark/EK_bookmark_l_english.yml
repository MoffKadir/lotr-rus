 # Warlord Rising - Skyrim
 bm_skyrim: "A Contested Verity"
 bm_skyrim_desc: "The home of the Nords stands divided.\n\nAfter High King Logrolf was murdered, the Jarl of Solitude Svartr disputed the heir apparent's legitimacy. As the Moot convened and held Freydis, Logrolf's daughter, as the rightful successor chosen by the Crown of Verity itself, Svartr held his own Moot in Solitude.\n\nSkyrim would then be divided between its East, ruled by Freydis and her line, and its West, ruled by Svartr and his heirs, for centuries.\n\n#bold Can one pretender crush the other and reunite the province? Or will the Nords stay divided for centuries until an outsider conquers the Nords as their own subject?#!"
 bm_skyrim_svartr: "High King Svartr"
 bm_skyrim_svartr_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_svartr_desc: "The aging Jarl of Solitude, Svartr was first to contest Freydis's legitimacy after Logrolf's assassination. Quick to act, he convened a partial Moot within his halls to crown him High King, but not before Freydis managed to hold her own Moot and wear the Crown of Verity. Unwilling to back down, Svartr and his supporters refuse to recognize the Crown of Verity as anything more than a powerless relic, and he would rather be crowned High King due to the strength of his armies.\n\n#bold Will the pretender queen kill Svartr's campaign before it can garner enough support? Or can you take charge, unite Skyrim under your banner, and bring an end to centuries of rule from the east?#!"
 bm_skyrim_freydis: "High Queen Freydis"
 bm_skyrim_freydis_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_freydis_desc: "The daughter of the now deceased High King Logrolf, Freydis's lack of unanimous support means her hold on Skyrim's western half is tenuous at best. Svartr, the old Jarl of Solitude, refuses to recognize her as his rightful ruler, and unless she wants Skyrim to stay divided for centuries, Freydis will have to march west and bring back Solitude and Svartr's supporters back into the fold.\n\n#bold Are Freydis and her line doomed to fail? Or can you crush the pretender, unite the province, and finally be crowned High Queen of Skyrim?#!"
 bm_skyrim_lodvar: "King Lodvar"
 bm_skyrim_lodvar_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_lodvar_desc: "A Nord king in a Reachman kingdom, Lodvar ascended to power after claiming Markarth for himself and defeating the Reach tribes surrounding the city. Most of the Reach is still outside his grasp, and his subjects actively conspire to overthrow him, but he may still find allies to his north and east.\n\n#bold Will the unruly Reachmen overthrow you and be free once more, or can you turn the Reach into a proper Nord hold and civilize the region?#!"
 bm_skyrim_yashnag: "King Yashnag"
 bm_skyrim_yashnag_subheading: "King of Falcrenth"
 bm_skyrim_yashnag_desc: "Following the sack of Orsinium, Yashnag and his tribe fled east to their ancestral land in Skyrim. Svartr, holding power in the western part of the province, was unable to stop the Orcs, and they claimed their chiefdom in Falkreath. After holding Falcrenth for a few decades, Yashnag and his champions were challenged to duels and defeated by the former Jarl of Falkreath's son, Hakkvild.\n\n#bold Surrounded by enemies, will Yashnag and his line fail, leaving the Orcs no choice but to scatter once more? Or will you stay strong, keep the Chiefdom of Falcrenth as Orcish land, and forge a new Orsinium here in the crucible of war?#!"
 bm_skyrim_torygg: "King Torygg"
 bm_skyrim_torygg_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_skyrim_torygg_desc: "Few Nords are as respected as King Torygg the Honest, but fewer still are those who speak ill of the charismatic, thoughtful man. Ruling over the crossroads of Skyrim, Torygg has brought prosperity and peace to the holds of the central plains by making friends with the willing and promises to the worthy.\n\nYet, with the High Kingdom in dispute and the battle lines being drawn around his kingdom, Torygg may find himself forced to declare for one side, as both claimants to the throne call upon Whiterun's rich coffers and armories in time of need.\n\n#bold Will the coming unrest sweep him aside like a gale that cuts through the tundra, or will his peacemaking ken keep Whiterun safe in the storm?#!"
 bm_skyrim_brynjolfr: "High Chieftain Brynjolfr"
 bm_skyrim_brynjolfr_subheading: "High Chieftain of Felsaad"
 bm_skyrim_brynjolfr_desc: "High Chieftain Brynjolfr carries great expectations on his shoulders, being the last living kin to the fabled Aevar Stone-Singer, hero of the Skaal who long ago reclaimed the gifts of the All-Maker when the Adversary had stolen them away.\n\nNow, with much of Solstheim's land lost to Riekling tribes, the Skaal place hope in Brynjolfr that he will return their lands to them as his ancestor once restored the divine gifts. But secretly, Brynjolfr places little stock in stone-lore and tall tales, and believes that good things come to those who wait.\n\n#bold Can he restore Solstheim through peaceful means, as did his forebear, or will he become the hero his people want him to be?#!"



