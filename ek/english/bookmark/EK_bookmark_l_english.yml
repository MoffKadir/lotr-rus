 # recommanded characters for the topal bay 440
 bm_topal: "Sea of Troubles"
 bm_topal_desc: "The Potentate crumbles under its weight! The rubble flows down the Niben and pools up by its estuary, where freshly-built bridges block it from ever reaching the sea. With trade and power shifting south from the sick man of Tamriel towards the Topal Sea, opportunity washes onto its shores with a faithful companion of its own: danger.\n\nTo the east, a Yespest queen looks to the future with hope and apprehension. To the north, Leyawiin and the duchy of Blueblood play with fire, dealing with a discontent people, yet reaping great rewards. And to the west, Senchal faces perhaps its greatest chance for power yet.\n\n#bold Four rulers stand on the precepice of history with a promise of prosperity within their reach. Will they seize it? Or will their realms become ruins for others to discover?#!"
 bm_topal_aine: "Queen Aine"
 bm_topal_aine_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_topal_aine_desc: "Here stands Aine clan Atla, daughter to the eminent King Auril, who united the Yespest tribes. Aine rules at a difficult time: Argonian raids grow more frequent, the Lilmothiit opportunists more daring, and worse yet, Leyawiin's ambitions pose direct threat to Yespest independence.\n\n#bold Yespest sovereignity has been threatened for many centuries and they have sacrificed much for this taste of freedom. Will Aine's leadership preserve it, or will she wilt and perish in her father's shadow?#!"
 bm_topal_fabiana: "Duchess Fabiana"
 bm_topal_fabiana_subheading: "Duchess of Blueblood"
 bm_topal_fabiana_desc: "Fabiana Arcato is completely enamored with the Yespest Queen Aine, and they're mutually fascinated with the idea of kicking Lovierus of Leyawiin in the teeth until his head disconnects from his body. Nothing brings two noblewomen closer than patricide and dreams of vengeance.\n\nHowever, Fabiana's realm isn't exactly in the shape to put her plans in motion: as a foreigner to her traditional $nibenu$ subjects, she has a hard time finding support in Blackwood. She must find a compromise to ensure that they at least don't try to depose her for not knowing each and every obscure river-saint of theirs by name.\n\n#bold And if Fabiana keeps her realm stable and her ally happy? It's all but certain that no Overlord shall lord over her — or anyone, for that matter.#!"
 bm_topal_lovierus: "$king_feudal_male_nibenese$ Lovierus"
 bm_topal_lovierus_subheading: "$king_feudal_male_nibenese$ of Leyawiin"
 bm_topal_lovierus_desc: "Overlord Esdrufus Darak left his successor many loose ends to tie up. To the west, the Transnibenese $malapiit$ growl. To the east, the Cisnibenese princesses sharpen their knives. And then, there are the Leyawiin bridges... The mad infrastructure project is profitable but put a target on his back all the way to the Rumare. Though that makes Lovierus wonder... Should he outwit his foes, Topal Sea will be his lucrative backyard.\n\n#bold Will he conquer the ghosts of his father's legacy? Or will his arrogance be his undoing?#!"
 bm_topal_kahada: "$duke_feudal_female_khajiiti$ Kahada"
 bm_topal_kahada_subheading: "$duke_feudal_female_khajiiti$ of Senchal"
 bm_topal_kahada_desc: "Senchal has found itself in the middle of a perfect storm. Leyawiin feuds with its rebellious Nibenu vassals and Yespest tribes, giving Kahada the opportunity to take advantage of the chaos and dominate Topal Bay. But the Queen of Senchal prefers peace to war and foregoes any avenues of expansion.\n\n#bold Will a new spirit overtake her in this crucial period and lead Senchal to dominate the seas, perhaps even leading to the revival of independent Pellitine?#!"

 # recommanded characters for reaper's march 440
 bm_reaper: "The Reaper's Due"
 bm_reaper_desc: "At the crossroads of Valenwood and Elsweyr lies Reaper's March. The arid plains had been contested for centuries, and the beginning of the Interregnum did not change that fact. Colovian warlords clash with Bosmer and Khajiiti tribes, all claiming the rightful ownership of this land.\n\n#bold Reaper's March has been the graveyard of many ambitions over the years. Who will emerge victorious from the melee?#!"
 bm_reaper_cicero: "King Cicero"
 bm_reaper_cicero_subheading: "King of South Weald"
 bm_reaper_cicero_desc: "Nobles north of the Strid were astounded to learn one of them conquered Arenthia, backed by a mercenary host. Cicero Pullia may have fared well in the initial invasion but the decadent Arenthi Wards managed to wage unending guerilla, a lingering thorn in his side. More worrying even are the reports of the Treethane in Vinedusk gathering sizable might to drive him back into the West Weald. Although his diverse subjects are compliant for now, they will go into resistance at the slightest hint of weakness.\n\n#bold The 'South Weald' is far from pacified, if Cicero wants to found a lasting kingdom south of the Strid he will need to extinguish all embers of resistance. The treacherous Reaper will collect his due in time…Or will you find a way across the ordeal and establish a legacy to last the Eras?#!"
 bm_reaper_maevelle: "$count_feudal_female_bosmeris$ Camoran Maevelle"
 bm_reaper_maevelle_subheading: "$count_feudal_female_bosmeris$ of Autumnsite"
 bm_reaper_maevelle_desc: "The roots of the Camoran tree sprawl all over Valenwood. The sorry state of the Arenthi branch is cause for concern nonetheless after a Colovian adventurer conquered most of their territory. Maevelle has a long way to go if she wants to secure her place in Reaper's March. Her powerbase is weak and exposed to raids from Colovians and fellow Bosmer who seek to eat before they are eaten. Worse yet, a lowborn named Nendaer brazenly claims all that she owns! Thankfully the blood of Eplear still carries weight in these lands, perhaps enabling a timely marriage alliance?\n\n#bold The fate of her lineage rests in her hands as she dances on a knife's edge. Maybe the Reaper has come to prune the tree...Or will you take charge, depose the usurper king and crush all traitors to your rule?#!"
 bm_reaper_habais: "$king_feudal_male_khajiiti$ Habais"
 bm_reaper_habais_subheading: "$king_feudal_male_khajiiti$ of Dunei"
 bm_reaper_habais_desc: "Habais watches the chaos in Arenthia unfold in gleeful serenity for his kingdom is strong and surrounded by weaker neighbours. His only major threat, the South Weald is wracked by internal strife as the Colovian king struggles to make the Bosmer populace submit to him. Some warlords that reject the authority of Dune'i can be put to heel and even the prosperous Arenthia can be welcomed back into the Anequinan fold should he seize the right opportunity.\n\n#bold Opportunities line up for Habais but waiting too long could leave his enemies entrenched and his grand ambitions thwarted. Good things come to those that can wait but should you take the reins could you walks in the steps of Darloc Brae and restore the glory of Ne-Quin-Al?#!"
 bm_reaper_nendaer: "$duke_feudal_male_bosmeris$ Nendaer 'the Ironbark'"
 bm_reaper_nendaer_subheading: "$duke_feudal_male_bosmeris$ of Vinedusk"
 bm_reaper_nendaer_desc: "Colovian 'adventurers' are a fact of life in Vinedusk but the catastrophic rout of the established families about a decade prior spurred some smaller characters to action. One Nendaer 'the Ironbark' is such new blood, for he does not fear the wrath of Maevelle Camoran by claiming her thanedom and sets his sight on deposing the pretender king in Arenthia. The Camorans have failed, Cicero will fail but Nendaer can succeed in liberating Reaper's March from him and defending it from others. Showing promise isn't equal to achievements however and he could simply meet a early grave by offending so many big characters at once.\n\n#bold The Vinedusk Rangers have declared big plans for Reaper's March but in a region known for fallen heroes how can they hope to stay alive for long...Maybe you can lead them to glory and found an order that will defend Arenthia in the future?#!"

 # recommanded characters for hammerfell 440
 bm_hf: "A Crown in the Sand"
 bm_hf_desc: "#italic Divide and rule#! — such was the policy of the Second Empire of Cyrodiil.\n\nThe Redguard nation stands divided. There is infighting among the Forebears, each wishing to take advantage of the chaos of the Interregnum; but the Crowns stand united behind their leader in Hegathe, ready to take back what they lost.\n\n#bold Will the Na-Totambu rule the Republic of Hammerfell again, or will a new leader emerge from this chaotic period?#!"
 bm_hf_kavar: "$title_crown_republic_female$ Arlimahera"
 bm_hf_kavar_subheading: "$title_crown_republic_female$ of the Crown Republic"
 bm_hf_kavar_desc: "The Crown Arlimahera rules a divided Hammerfell, but not for lack of trying. She has used every tool at her disposal to restore her party's rule over Hammerfell, including the dreaded Dark Brotherhood. \n\n#bold Will Arlimahera return the [Glossary( 'Na-Totambu', 'NATOTAMBU_GLOSS' )] to their rightful place, or will her methods cause the downfall of the Republic?#!"
 bm_hf_ahlam: "Duchess Katie"
 bm_hf_ahlam_subheading: "Duchess of Beraja"
 bm_hf_ahlam_desc: "Duchess Katie may not rule Sentinel, but she leads the defense of the kingdom against Crown aggression. Although do-Nisewan dynasty ruled fairly for a long time, the [Glossary( 'Ra Gada', 'RAGADA_GLOSS' )] warbands are unhappy with Queen Fereshtah and her lack of leadership.\n\n#bold For now Katie is content to serve Sentinel, but will you lead her and her descendants to greater heights?#!"
 bm_hf_murahd: "Queen Irvina"
 bm_hf_murahd_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_murahd_desc: "Rihad boasts an achievement not many managed: they rebelled against the Empire and won. Irvina led her people to this victory, but now she grows old, and all Rihadians are worried about what lies ahead...\n\n#bold Will the Forebear warriors of Rihad remain strong? Or will the warbands collapse into infighting without a strong leader to unite them?#!"
 bm_hf_isobel: "Duchess Lassinia"
 bm_hf_isobel_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_isobel_desc: "Lassinia leads the remnants of the Empire in Hammerfell after the assassination of her brother, the last governor of the province. She gathered what loyal legionaries she could and assumed temporary control of the prefecture of Lainlyn, from which she intends to restore the Imperial rule.\n\n#bold Will Lassinia manage to bring back law and order to Hammerfell?#!"
 bm_hf_yarana: "King Divad IV"
 bm_hf_yarana_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_hf_yarana_desc: "The Do-Rahal Dynasty rules Elinhir at the behest of the Empire. But with the fall of the Empire, the authority of the Forebear kings disappears as well. Orc raids intensify, while the Crown Republic awaits the opportunity to reclaim its rightful holdings.\n\n#bold Will the  [Glossary( 'Ra Gada', 'RAGADA_GLOSS' )] of Elinhir survive the Interregnum, or is Na-Totambu victory inevitable?#!"

 # recommanded characters for black marsh 440
 bm_kv: "Ku-Vastei"
 bm_kv_desc: "Nothing is constant in Black Marsh; this is the truth known to the People of the Root. In the north the House Dres faces an uprising by their slaves, while the Ayleid kingdom of Silyanorn clings on as the last of their kind. In the south, both the Yespest and Horwalli tribes stand united for the first time. The Argonians watch these developments with hope and resignation, knowing that both rises and falls are all part of the same cycle.\n\n#bold Can you follow the tides of change and build a lasting place for your dynasty, or will your legacy sink forgotten into the swamp?#!" 
 bm_kv_morilye: "$duke_feudal_independent_female_ayleid$ Carandol Morilye"
 bm_kv_morilye_subheading: "$duke_feudal_independent_female_ayleid$ of Loriasel"
 bm_kv_morilye_desc: "Morilye comes from a venerable line of Ayleid kings, her ancestors having fled Cyrod following the  [Glossary( 'Narfinsel Schism', 'NARFINSEL_GLOSS' )], finding a new home in the inhospitable Black Marsh. Now the realms of her forebears are much weaker and under constant threat from Argonian and Kothringi tribes.\n\n#bold Surrounded by potential enemies, will Morilye prevail?#!"
 bm_kv_xir: "$duke_feudal_male_lilmothiit$ Xir 'the Usurper'"
 bm_kv_xir_subheading: "$duke_feudal_male_lilmothiit$ of Lakemire"
 bm_kv_xir_desc: "Xir the Exile, now Xir the Usurper, is the firstborn son and would-be heir of Aiisxar of Blackrose. However a quarrel between them two years ago saw him exiled to his mother's kin in Buwomousa. But now his father is dead and his sister sits on the throne of Blackrose.\n\n#bold Xir has rallied the tribes loyal to him and seeks to reclaim Blackrose, but will he succeed in his ambitions?#!"
 bm_kv_alt_mispaxa: "Pathfinder Mispaxa"
 bm_kv_vraseth: "High Chieftain Urseth"
 bm_kv_vraseth_subheading: "High Chieftain of Archon"
 bm_kv_vraseth_desc: "Born to just one of many Horwalli tribespeople, no one would have expected the young headhunter named Urseth to accomplish anything truly extraordinary, let alone unite all the Horwalli people under one banner. His greatest victory was the Battle of Archon, where he slew the Argonian king in personal combat, securing the strategic settlement for the Horwalli. But Urseth is no longer a young warrior, and many enemies await his death... \n\n#bold Will his conquests and the dreams of a great Horwalli Kingdom manage to survive his death?#!"
 bm_kv_brandshei: "$duke_feudal_male_argonian$ Brand-Shei 'the Fury'"
 bm_kv_brandshei_subheading: "$duke_feudal_male_argonian$ of Alten Tormont"
 bm_kv_brandshei_desc: "In terms of scars, there is no besting Brand-Shei.Captivity in Dres controlled Stormhold has been horrifying yet pivotal in forging his sanguine self. When he toiled in the fields beneath its walls, he made a promise to himself: to rule the place and place the governor's head on a spike! But before he can even do so, he has to support his brother-in-law in his own uprising against nothing less than a coalition of Dres magnates. \n\n#bold Can Brand-Shei seize his dreams with both hands or will his grave stake join the piles of would be liberators?#!"
 bm_kv_milos: "$duke_feudal_male_argonian$ Milos"
 bm_kv_milos_subheading: "$duke_feudal_male_argonian$ of Seafalls"
 bm_kv_milos_desc: "The Tharumee once ruled all of Archon as Kings but those days are long gone. Much of their lands were slowly lost and then the Horwalli sacked and took Archon itself five years ago killing Milos's father Raj-kaal Dreekius. Milos retains only a small amount of provinces to the North, his sister having taken control of the closer Archal. \n\n#bold Will Milos be able to retake Archon and perhaps even reclaim the Kingdom of Archon itself? Or will the Tharumee fade into irelevance?#!"
 bm_kv_talenjei: "Raj-kaal Talen-Jei 'the Returned'"
 bm_kv_talenjei_subheading: "$duke_feudal_male_argonian$ of Helstrom"
 bm_kv_talenjei_desc: "Thousands of years before this Era, there was a King of Shadows. Order, progress, lasting achievement were the law of the land. Through obscure xanmeer magicks this King underwent rebirth. Failure or the erosion of time thwarted his designs, casting him into a much diminished vessel. Talen-Jei is now the scion of a ruined kingdom, surrounded by a populace which embraces squalor \n\n#bold Can Talen-Jei restore the glory of Duskfall or will he fail to tame the heart of the people?#!"

# 450
 # Interregnum
 bm_group_450: "2E 450"
 bm_interregnum: "Interregnum"
 bm_interregnum_desc: "Twenty years ago, the last Akaviri Potentate and all of his heirs were murdered, ending the Second Empire.\nCyrodiil and High Rock are now split between dozens of rival successor states. Skyrim struggles with civil unrest as two self-proclaimed High Kings strive to claim the province for themselves. Former subjects of the Empire struggle with one another over even the smallest of resources. Most of Tamriel fares no better, with regional hostilities gripping nearly every region outside of Alinor.\n\n#bold In all this chaos, is it possible for the Empire to be restored? Can any individual possibly hope to pacify the turbulence and stand above all others as the Emperor of not only Cyrodiil but also all Tamriel? Anything is possible amidst the chaos of the Interregnum.#!"
 bm_interregnum_marandrujo: "Mane Ma'randru-jo"
 bm_interregnum_marandrujo_subheading: "Mane of the Elsweyr Confederacy"
 bm_interregnum_marandrujo_desc: "Since time immemorial there has been a Mane to guide the faithful. In these troubled times, the 'Braided Crown' is worn by His Excellency Ma'randru-jo, rightful ruler of all Elsweyr!\n\nIf Pellitine obeys, Anequina is defiant at its own expense. Only Dune has a semblance of order as Riverhold, Orcrest and Rimmen descend into anarchy. Not even the Brae are spared — they fight an implacable war against their Rimmenese subjects turned Kings.\n\nBy secular law, Anequina should obey the the Two Moons' Dance if Ma'randru-jo overcame his aloof character.\n\n#bold Will Anequina escape the grasp of the Mane, or can you ensure the Hierocrat reigns supreme again?#!"
 bm_interregnum_hakkvild: "$duke_feudal_male_nordic$ Hakkvild"
 bm_interregnum_hakkvild_subheading: "$duke_feudal_male_nordic$ of Helgr"
 bm_interregnum_hakkvild_desc: "Hakkvild is no sheltered prince, having lost his father and birthright almost two decades ago to the Yal Clan. Serving his uncle Engar in Helgen left him ample time to grind his ax into dust and then some.\n\nHaving succeeded the avuncular throne, he is now chomping at the bit to return the Hold to his Nordic hands.\n\nConsidering he enlisted the support of Whiterun against the marauding Orcs and his capital is a solid place from which to attack or retreat to, his dream is within reach.\n\n#bold One can never be too careful as the Orsimer are ruthless and fell enemies ready for anything. Will you overcome all their defenses to chase out Mauloch's children or will you watch as Hakkvild crashes against Orcish might?#!"
 bm_interregnum_mariette: "$duke_feudal_female_bretic_independent$ Mariette"
 bm_interregnum_mariette_subheading: "$duke_feudal_female_bretic_independent$ of Camlorn"
 bm_interregnum_mariette_desc: "House Rielle has exalted origins, from Fabre 'the Iron Son' carving a sphere of influence in post-Nordic High Rock to Sebastien the Great officially annexing the dependencies into the modern Kingdom of Camlorn. If not for Direnni felony maybe Fabre 'the Black' could have united all of Glenumbra and beyond! Queen Mariette has no such ambition: holding a tight leash on her vassals is taking all her full focus. But should she ever grow tired of toying with their nerves, the princes and petty monarchs of Camlorn are ripe for the picking.\n\n#bold Should Mariette spread her shadow over her rightful domain or will her cabbal of terror prove her undoing?#!"
 bm_interregnum_kaidarbul: "Ashkhan Urshilaku Kaid-Arbul"
 bm_interregnum_kaidarbul_subheading: "Ashkhan of Urshilaku"
 bm_interregnum_kaidarbul_desc: "Urshilaku. One of the Four Great Tribes of the Ashlanders is in the capable hands of Kaid-Arbul, son of Enkidu. Devout, stoic and kind, the Velothi of Valenvaryon have little to fear under his rule.\n\nAlas the greed of the outlanders cannot be contained for long, inexorably edging them towards further encroachment and conflict with the Velothi. Tales of a hero that will punish the wicked Dunmer may sooth the meek and the feeble, but Kaid-Arbul knows a singular truth: #bold Might Makes Right!#!\n\n#bold Will the Urshilaku throw back the outlanders into the sea or begin their descent into irrelvance.#!"
 bm_interregnum_torg: "High Chieftain Torg gro-Brog"
 bm_interregnum_torg_subheading: "High Chieftain of Rubedite"
 bm_interregnum_torg_desc: "'Blood of the Scarlet Vein', the Rubedite Clan of Iron Orcs carved out their seat on the back of the eponymous ore. Saddled with comfortable wealthand strong warbands, Torg gro-Brog is at a crossroad.\n\nThe tribesfolk chaff under his mild temper such an antithesis to the stubborn and ruthless Osh Ornim paragon. His own father once said he was 'a timid goat spawned by a fierce boar'. Chieftain Brog was no prolific Orc, leading Torg to accede the chiefdom unopposed.\n\n#bold Will Torg collapse when faced with Osh Ornim expectations of rulership or will you toe the line between his true self and duty?#!"
 bm_alinor_hidellith: "$emperor_feudal_male_altmer$ Auriel Hidellith 'len Imare"
 bm_alinor_hidellith_subheading: "$emperor_feudal_male_altmer$ of Alinor"
 bm_alinor_hidellith_desc: "Hidellith 'len Imare Tandil 'ata Naemon Tamlien, Ceremoniarch of the Altmer, King of Alinor and the Summerset Isles will have to helm his dominion through dangerous tides. \n\nApraxis stirs the heart of the masses, slowly driving the realm towards chaos. The best scryers see danger engulfing fair Alinor in the coming years. \n\nThe seeds of chaos are already sprouting; Elendarie V of Lillandril wages a succession war caused by her #italic questionable#! bloodline. The current Rilis of Firsthold has strayed far off conventional wisdom by performing foul [Glossary( 'Daedric', 'DAEDRA_GLOSS' )] rituals. Without stern reprimand he may soon assemble acolytes willing to conspire alongside him.\n\n#bold What will become of the home of the Aldmer under the rule of this Aran-El? A paradise of peace or a house of disasters? That is for you to decide.#!"

 bm_ir_cyro: "Red Diamond Shattered"
 bm_ir_cyro_desc: "Twenty years ago, the Potentate Savirien-Chorak and all of his heirs were murdered, ending the Second Empire.\n\nEight years ago, Attrebus Sosildor defeated the Potentate Aixnieras-Ves and established his own rule over Cyrodiil.\n\nSix years ago, the rulers of the Nibenay Valley united under Venaros Cuptor to rise up against Attrebus.\n\n#bold A year ago, Attrebus died, shattering any unity in Cyrodiil and fully plunging it into the Interregnum#!."
 bm_ir_cyro_hesta: "$king_feudal_female_heartlands$ Hesta"
 bm_ir_cyro_hesta_subheading: "$king_feudal_female_heartlands$ of the Heartlands"
 bm_ir_cyro_hesta_desc: "Lady Hesta governs the Heartlands as the heir of the would-be Emperor Attrebus. In spite of the chaos of the last decade, the Imperial City remains the jewel of Tamriel, and Hesta's realm is one of the most stable and prosperous in Cyrodiil. But the warlords of Cyrodiil are many, and each desires to control the capital city...\n\n#bold Will the Sosildor kingdom fall victim to the ambitious warlords like the rest of Cyrodiil, or will the heirs of Attrebus prove ambitious enough to unite the Empire and fulfill his dream?#!"
 bm_ir_cyro_caius: "Caius Lex"
 BOOKMARK_RELATION_REGENT: "Regent"
 bm_ir_cyro_venaros: "$title_grand_overlord$ Venaros"
 bm_ir_cyro_venaros_subheading: "$title_grand_overlord$ of Nibenay"
 bm_ir_cyro_venaros_desc: "When Attrebus passed the infamous "Tsaesci Act", Venaros saw an opportunity. He spearheaded the Defiance of Nibenay, leading to his triumph at Poppad Woods and the death of Attrebus. Cuptor now claims the title of Grand Overlord of Nibenay, although the lords beyond Cis-Niben deny his claims, and his ancestral seat of Bravil still escapes his grasp.\n\n#bold Will Venaros return the lost Cuptor holdings and become a true overlord of Nibenay?#!"
 bm_ir_cyro_hieron: "King Hieron"
 bm_ir_cyro_hieron_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_hieron_desc: "When Attrebus requested help from lords of Colovia, Sancre Tor refused. When Attrebus failed, Sancre Tor stood strong and undefeated, and its king was happy to sway what Colovian lords he could to his side. Hieron is convinced that he is the great man Cyrodiil needs and that he #bold will#! succeed where Attrebus failed!\n\n#bold Will a Dor sit on the Ruby Throne again or will the Colovian pretenders fall apart a second time?#!"
 bm_ir_cyro_ilnori: "King Ilnori"
 bm_ir_cyro_ilnori_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_ilnori_desc: "It is hard to decide if the Aquilarios family profited more from Attrebus' meteoric rise or his sudden fall. When the warlord seized the Imperial City, Helvidius Aquilarios received the appointment to govern Chorrol. Now, with Attrebus gone, the independent kings of Chorrol are one of the strongest powers in the Colovian highlands.\n\n#bold Will Ilnori's rise eclipse that of Attrebus or will the Aquilarios' stint on the throne prove even more short-lived?#!"
 bm_ir_cyro_abnur: "Duke Abnur"
 bm_ir_cyro_abnur_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_abnur_desc: "''Indecision is the ruin of fortune.' Thus spoke Abnur at the beginning of his 'regency' on behalf of his father. Tharn's eyes are set on the Cyrodiil City, his ultimate goal: his blood on the Ruby Throne. While none may deny Abnur's arcane skill or his political acumen, he never displayed a great talent for strategy.\n\n#bold Will Abnur manage to navigate chaotic Nibenay and defeat its many warlords?#!"
 bm_ir_cyro_harald: "King Harald"
 bm_ir_cyro_harald_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ir_cyro_harald_desc: "With the death of the great warchief Borvir of Bruma, replaced by his soft-spoken son, the clan-heads now spurn the Frost-Beard clan's authority. The eastern chiefs no longer pay tribute to Bruma and rule as kings themselves.\n\n#bold Will Harald's gentler approach doom his kingdom, or will he prove an unexpected boon to his clan?#!"



 # recommanded characters for the iliac bay 450
 bm_iliac: "The Tower's Shadow"
 bm_iliac_desc: "From its privileged position in the Isle of Balfiera, the Adamantine Tower, cradle of Nirn's creation, silently bears witness as commerce once again makes way for war in the calm waters of the Iliac Bay.\n\nAs the natural barrier between High Rock and Hammerfell, the history of the Iliac Bay has always been an intricate tapestry of conquest, intrigue, insurrection, and plague. Bretons, Altmer, Redguards and even the occasional Akaviri pirate and Orc raider, all dispute for control over one of Tamriel's wealthiest regions.\n\nIn the last century, the chaos of the Interregnum has allowed even the humblest of barons to claim a hill and declare himself king of the land, opening a new chapter of strife for the rulers of the Bay.\n\n#bold Who shall be the new indisputable ruler of the Iliac Bay? Or is the region doomed to remain divided?"
 bm_iliac_donella: "Queen Donella"
 bm_iliac_donella_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_donella_desc: "Queen Donella grew up hearing about the Seamount Tribe conquest of Betony Isle. The Orcs brutally slew the local royal family, including her loved aunt Nurese, establishing a foothold of Orcish dominance in the entrance of the Iliac Bay. An eyesore that remains to this very day.\n\nSince that show of weakness, the lords of Glenumbra have progressively lost faith in the capacity of Daggerfall to protect them, propelling claims of independence that threaten the very existence of the kingdom.\n\n#bold Will Queen Donella revert this scenario or will Daggerfall be demoted to a minor power in the region?"
 bm_iliac_lywel: "King Lywel"
 bm_iliac_lywel_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_lywel_desc: "Veteran of the great war against Orsinium, King Lywel saw his kingdom's trade deals fall short as the rich ports of Hammerfell gradually closed amidst the recent Forebear Revolution.\n\nOnce known as the Jewel of the Bay, Wayrest's bankruptcy has allowed some disgruntled vassals, increasingly wary of the King's capacity to protect them from encroaching Direnni and Redguard incursions, to server ties with the capital, declaring their independence and further hurting the Kingdom's finances.\n\n#bold Will King Lywel be able to return his kingdom to its former glory or will Wayrest be relegated to ancient history?"
 bm_iliac_ancotar: "Kinlord Direnni Ancotar"
 bm_iliac_ancotar_subheading: "Custodian of Balfiera"
 bm_iliac_ancotar_desc: "Dreaming of emulating his ancestors Aiden and Raven Direnni, Kinlord Ancotar has been slowly reasserting his clan's dominance over their former holdings in Greater Bretony.\n\nHaving personally witnessed the descend into chaos caused by the Interregnum since the assassination of the [Glossary( 'Potentate', 'POTENTATE_GLOSS' )], Ancotar has grown sure that a return of Direnni Hegemony over High Rock could bring much needed peace to the region.\n\n#bold Will Ancotar be able to achieve his objectives or are the Direnni bound to be mere castellans of the Adamantine Tower?"
 bm_iliac_vhosek: "King Vhosek"
 bm_iliac_vhosek_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_iliac_vhosek_desc: "King Vhosek rules an ascendant kingdom. Ojwambu is positioned on the land border between High Rock and Hammerfell but never assumed an active position in the region due to the Imperial presence and was limited to the borders drawn by Reman I at the end of the First Era.\n\n#bold Will Vhosek exploit the Empire's fall and expand Ojwambu's lands? Or perhaps even unite the Forebears?#!"
 bm_iliac_ulmug: "High Chieftain Ulmug"
 bm_iliac_ulmug_subheading: "High Chieftain of Fharrun"
 bm_iliac_ulmug_desc: "Ulmug gro-Garothmuk has grown up in the strangely-shaped shadow of his father, Garothmuk, an atypical orc and an atypical father. So distraught over the loss of culture in the fall of Orsinium, Garothmuk concerned himself more with books by long-dead orcs than with the martial expectations of an orcish chief.\nUlmug would have none of it. Determined to become a true exemplar of orcish martial culture, the boy applied himself with beastlike ferocity to his martial training. Where Garothmuk failed to lead Fharun against nearby farms, Ulmug set forth on the raiding path. While he cannot escape certain inheritances, such as the literacy he is loath to admit he possesses, Ulmug has in nearly all regards thrown off Garothmuk's legacy and taken up the axe in its place.\nWill he succeed in re-establishing Fharun's raiding economy? Will Ulmug assert orcish claims to land that he sees such vulnerable Reach farmers tilling? Or will Ulmug wish that he had followed his father to the archives, desperate for one last bit of knowledge that might have saved his life..?"

 # recommanded characters for the abecean 450
 bm_abecean: "Tidal Ambitions" 
 bm_abecean_desc: "Abecean longfin carpaccio is of the rare delicacies to be equally encensed by Breton, Yokudan, Cyrodiilic and Altmer palates; a testament to the diversity of stakeholders that trade, fight, raid and conquer around the area.\n\nWith the fall of the Potentate came a sharp decline in maritime security and thus trade. Only the boldest and most secure cargo raise the anchor, oftentimes being accosted a few miles into the sea, in plain view of the dockers. Organized chaos has displaced the previous tranquility with two sides forming: the ones that persevere in honest trades, and the others engaing in the dishonest trades at the expense of the former.\n\nCoastal and insular hubs reel from these contradictions as Stros M'Kai, Abah's Landing and the Systres are forced to choose their stance. The periphery of the Abecean world has long made its choice known as Pankorian Dremora and Anvil corsairs wreak havoc upon the passing ships, respectively obeying the orders of a Grand Admiral and a Pirate-King. \n\n#bold Tides come and go, the old waves are washed away by the new waves. Sunny days are over and you need to be clear: are you feeble Prince or a fierce Pirate?#!"
 bm_abecean_afshuur: "Prince Afshuur"
 bm_abecean_afshuur_subheading: "Prince of Hnas"
 bm_abecean_afshuur_desc: "In just five years, Afshuur do-Addin rose from a minor Crown noble entrusted with governing poor land to ruler of one of Hammerfell's largest cities. With the support of the people of Abah's Landing, dissatisfied with Crown tariffs and religious policies, he staged a coup against the Crown's governor and proclaimed himself an independent Prince of Hnas.\n\n#bold Will Afshuur succeed in making himself (and his people) rich, or is his princedom doomed?#!"
 bm_abecean_arctur: "King Arctur"
 bm_abecean_arctur_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_abecean_arctur_desc: "Arctur Doralis is a rarely seen Pirate-King, overtly plying the shipping lanes and ports of his rivals. He toppled House Olo practically overnight, slaying King Rogatus in single combat in the auspicious year 2E 444 and declaring himself King of Anvil by right of conquest.\n\nIf his vision and military acumen are no longer in question, many smallfolk fear for their life and limb under the mercurial and scheming corsair, wondering where he will set his sights next. Pirates are always looking for the next loot after all.\n\n#bold Can you settle down your privateers and become a respectable King or will the sea life catch up to you?#!"
 bm_abecean_fabrelle: "Duchess Martina"
 bm_abecean_fabrelle_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_abecean_fabrelle_desc: "Martina's father was sent to govern Systres and its prisons on behalf of the provincial governor of Hammerfell. Unfortunately for Martina, the Empire is in chaos, the governor is dead, the Abecean Sea is full of hostile pirates, and she is stuck on its most remote island.\n\n#bold Martina is surrounded by enemies on all sides. Will Systres weather the storm, or will it follow the Empire's fate?#!"
 bm_abecean_velehk: "Grand Admiral Velehk"
 bm_abecean_velehk_subheading: "Grand Admiral of the Heartless Horde"
 bm_abecean_velehk_desc: "Velehk Sain is a [Glossary( 'Daedric', 'DAEDRA_GLOSS' )] Lord on a unusually protracted sojourn on Nirn. Born from the chaos of Oblivion, he banished many of rivals to the Darkness before an unassuming Yokudan conjurer summoned him to Nirn.\n\nQuickly dispatching the foolish mortal and mooring himself tightly to the mortal plane,  he was left with an abundance of time and an excess of cruelty. Piracy thus became his occupation, enabling him to keep his wits sharp. Untold numbers of 'heroes' have tried to banish him only to be killed #at best#! or forced back — broken in mind and body.\n\nAcquiring Pankor was a decisive step on the path to world devastation...or domination?\n\n#bold Will the Darkness finally claim Sain's vestige or are we witnessing the birth of a legendary Pirate-King?#!"

 # recommanded characters for valenwood 450
 bm_vw_nilwen: "Queen Camoran Nilwen"
 bm_vw_nilwen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_vw_nilwen_desc: "Queen Nilwen rules a divided kingdom, courtesy of her weak father, who left Cormount to his bastard son. Now Nilwen is surrounded by enemies from all sides, but she welcomes the challenge, ready to prove her mettle on the battlefield.\n\n#bold Will you remind the Valenwood of the might of Eldenroot and claim the mantle of Hart-King? Or is Nilwen's kingdom destined to perish, forgotten by history?#!"

# Kamal
 bm_group_572: "2E 572"
 bm_kamal: "#R Kamal#!"
 bm_kamal_desc: "#R NOT PLAYABLE YET.\nFOR CHECKING EARLIER HISTORY OUTCOMES ONLY#!"
 bm_kamal_aethra: "Empress Aethra"
 bm_kamal_aethra_subheading: "Empress of Durcorach Empire"
 bm_kamal_aethra_desc: "Aethra Durcorach has recently inherited a great gift from her father: historians will call Aneurin the 'Last of the [Glossary( 'Longhouse Emperors', 'LONGHOUSE_EMPEROR_GLOSS' )]', for he consolidated the heart of the Empire that Aethra now rules. But neither she nor her father had foreseen the invasion of the Kamal on the Empire's eastern border.\n\n#bold Can you guide Aethra to turn threat to opportunity, and emerge from the chaos more powerful than her father?#!"

 war_3447_dirennis: "War of Direnni Succession"
