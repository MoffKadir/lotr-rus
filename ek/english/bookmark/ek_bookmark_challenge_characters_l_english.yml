# 450
# Oreyn Bearclaw
 challenge_character_oreyn: "Chief Oreyn"
 challenge_character_oreyn_desc: "Oreyn Bearclaw, son of a Bosmer shaman and a Dunmeri mystic, left at an early age to seek adventure and glory, becoming famous across all of Valenwood after slaying the Witch-Serpent Glenhwyfaunva. But word reached him that his father had used foul necromancy to seize Woodhearth, and Oreyn raced home, rallying the tribes of Greenshade to save the kingdom.\n\n#bold Despite all his might the legions of the undead are without numbers... can you prevail against the odds and establish a legend known from Woodhearth to Sheogorad?#!"

# Malgoth Blackroot
 challenge_character_malgoth: "$duke_feudal_male_bosmeris$ Malgoth"
 challenge_character_malgoth_desc: "Most Wood Elven chiefs are content with protecting their tribes. But not Malgoth: he dreams of becoming King of Valenwood. Since the beginning of his conquests a decade ago, he has displaced High Elven colonists and now wages war against the Ayleids of Hectahame.\n\n#bold Will Malgoth fulfill his grand ambition and gain the royal throne he deserves? Or will he die on the cusp of immortal glory?#!"

 challenge_character_rilis: "Aran Torinaan Rilis XII"
 challenge_character_rilis_desc: "King Rilis was always known for his ambitions, but his desires never took such a dark turn as they did recently: he has secretly pledged his soul to Molag Bal and forsaken the worship of the Aedra.\n\n#bold Will his bid for power prove successful, or will he perish like the other Daedra worshippers in the Isles before him?#!"

 challenge_character_zyg: "Chieftain Zyg"
 challenge_character_zyg_desc: "Born in Southern Alinor, Zyg was exiled from his tribe and travelled north. The Bonedweller tribe were slow to trust the outsider until he protected their chieftain from a murder attempt. Zyg purged the traitors, backed by the mortally wounded chieftain. At the funeral he swore vengeance on the kinholds of Cloudrest...\n\n#bold Can Zyg fulfil his blood oath to his patron? Or will his foolish promise spell doom for Calcract?#!"