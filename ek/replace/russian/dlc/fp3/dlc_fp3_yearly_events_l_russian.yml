l_russian:
 fp3_scholarship.1000.t: "Второй Ффулке" #Replaced Aryabhata with Ffoulke
 fp3_scholarship.1000.desc: "До меня дошли сведения о престиже редгардских астрономов, о чём говорят даже те, кто только начинает изучать космос. Если я заполню свои залы #L [nearby_indian_ruler.GetCulture.GetCollectiveNoun|l]ими#! учёными, то, возможно, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] тоже сможет стать центром астрономии.\n\nЯ могу попросить, пусть [nearby_indian_ruler.GetTitledFirstName] пришлет мне нескольких таких учёных. Но будет ли принята моя просьба?" #Replaced Indians mathematics with Redguard astronomers
 fp3_scholarship.1000.duel_success_tt: "Несколько [nearby_indian_ruler.GetCulture.GetCollectiveNounNoTooltip|l]их астрономов вскоре прибудут к моему двору"
 fp3_scholarship.1000.native_tt: "Астроном [SCOPE.GetRootScope.GetCharacter.GetCulture.GetCollectiveNoun|l]ой культуры появится при дворе благодаря нашей поддержке."
 fp3_scholarship.1001.t: "Прибыл астроном"

 fp3_scholarship.8000.desc: "Мой придворный ученый [court_scholar.GetName] спешно подходит ко мне. За [Select_CString(court_scholar.IsFemale, 'ней', 'ним' )] следуют слуги со стопками книг, свитков и древних пергаментов.\n\n«Кажется, я стою на пороге прорыва! Мне нужно лишь достаточно времени, средства и столько чернил, чтобы ими было впору перекрасить Нибен»."
 fp3_promoted_persian_mathematics_modifier: "Поддержка редгардских астрономов"
 fp3_promoted_persian_mathematics_modifier_desc: "Учёные этого персонажа исследуют собственные астрономические методы, соперничая с редгардскими коллегами."
 
 fp3_yearly.2021.a: "Именем [ROOT.GetCharacter.GetFaith.HighGodNamePossessive], [sinful_tax_collector.GetTitledFirstNameNoTooltip|U] будет [Select_CString(sinful_tax_collector.IsFemale, 'уволена', 'уволен')]."
 
 fp3_yearly.2020.b.desc: "Это произошло, так как ваш вассал [denouncing_taxpayer.GetShortUIName] [Select_CString(denouncing_taxpayer.IsFemale, 'обличила', 'обличил')] некомпетентность персонажа [sinful_tax_collector.GetShortUIName]."
 fp3_yearly.2020.c: "У меня на н[sinful_tax_collector.GetHerHis] другие планы."
 