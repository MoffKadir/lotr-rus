l_english:
 fp3_scholarship.1000.t: "A Second Ffoulke" #Replaced Aryabhata with Ffoulke
 fp3_scholarship.1000.desc: "The prestige of Redguard astronomers has reached my ears, uttered by even the lowliest students of the cosmos. Were I to fill my court halls with [nearby_indian_ruler.GetCulture.GetName] scholars, then perhaps [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] could become a center of astronomy in its own right.\n\nI might ask [nearby_indian_ruler.GetTitledFirstName] to send me several such scholars, but would [nearby_indian_ruler.GetSheHe] accept such a proposal?" #Replaced Indians mathematics with Redguard astronomers
 fp3_scholarship.1000.duel_success_tt: "Several [nearby_indian_ruler.GetCulture.GetNameNoTooltip] astronomers will arrive at my court shortly"
 fp3_scholarship.1000.native_tt: "An Astronomer of [SCOPE.GetRootScope.GetCharacter.GetCulture.GetNameNoTooltip] culture will be elevated to court thanks to our funding."
 fp3_scholarship.1001.t: "Astronomer Has Arrived"

 fp3_scholarship.8000.desc: "My Court Scholar [court_scholar.GetName] rushes to me with several servants in tow, all of them carrying books, scrolls, or ancient parchments.\n\n"I believe I can reach a breakthrough, if only given enough time, ample funds, and enough ink to color the Bjoulsae black." #EK EDIT: replaced Indus with Bjoulsae
 fp3_promoted_persian_mathematics_modifier: "Promoted Redguard Astronomers"
 fp3_promoted_persian_mathematics_modifier_desc: "This character's scholars are discovering their own astronomic innovations to rival those of the Redguards."
 
 fp3_yearly.2021.a: "By [ROOT.GetCharacter.GetFaith.HighGodName], [sinful_tax_collector.GetTitledFirstNameNoTooltip|U] will be dismissed."
 
 fp3_yearly.2020.b.desc: "This happened because your vassal [denouncing_taxpayer.GetShortUIName] denounced [sinful_tax_collector.GetShortUIName]'s inaptness."
 fp3_yearly.2020.c: "I have other plans for [sinful_tax_collector.GetHerHim]."
 